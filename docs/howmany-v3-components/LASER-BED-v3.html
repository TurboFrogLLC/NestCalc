<!DOCTYPE html>
<!--
═══════════════════════════════════════════════════════════════════════════════
LASER-BED-v3 — Individual component lock
Authority: LASER-BED-v3-v1 (sha256 408ce4470f2c9d4d…)
Composition R29 wired this surface under .bed-stage (tip 6a9acc76 / f8398176)

Locked chrome
  · origin pinned bottom-left · fit 48×48 bed
  · blank fill #fff @ 80% · stroke #000 1.25px
  · major grid #000 @ 30% 1px · minor 1" #000 @ 10% 1px
  · left/bottom bed edges #000 @ 50% 1.75px
  · overhang ticks #000 @ 30% 1px · numbers #000
  · single free-corner indicator (no multi-handle box)
  · progressive labels 12 → 6 → 3 → 1
  · Lucide CirclePlus / CircleMinus / Scan · depressed press
  · pure B&W

NO HUD · NO FLiPIT · NO toolPath · NO isolator · NO child-spec
Standalone full-viewport bed (composition hosts a subset under .bed-stage).
═══════════════════════════════════════════════════════════════════════════════
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>HowMany V3 — LaserBed (standalone · v1 lock)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #fff;
      color: #000;
      font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #fff;
      overflow: hidden;
    }
    #world {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    /* 28×28 Lucide-style — icon centered, no padding */
    #chrome {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 6px;
      z-index: 30;
    }
    #chrome button {
      width: 28px;
      height: 28px;
      padding: 0;
      margin: 0;
      border: 1px solid #a2a2a2;
      border-radius: 4px;
      background: #fff;
      color: #171717;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      line-height: 0;
      box-shadow: none;
      transition: none;
    }
    /* depressed / inset press — no color invert */
    #chrome button:active {
      transform: translateY(1px);
      background: #f3f3f3;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.28);
      border-color: #8a8a8a;
    }
    #chrome button svg {
      display: block;
      flex-shrink: 0;
      pointer-events: none;
    }

    #readout {
      position: absolute;
      top: 12px;
      left: 12px;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
      color: #000;
      background: rgba(255,255,255,0.94);
      padding: 5px 9px;
      border: 1px solid #000;
      border-radius: 2px;
      z-index: 30;
      pointer-events: none;
    }

    body.dragging-x { cursor: ew-resize; }
    body.dragging-y { cursor: ns-resize; }
    body.dragging-xy { cursor: nesw-resize; }
    body.panning { cursor: grab; }
    body.panning.dragging { cursor: grabbing; }
  </style>
</head>
<body>
  <div id="stage">
    <svg id="world" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- minor grid: #000 @ 20%, 1px (non-scaling drawn in JS for consistent weight) -->
        <!-- patterns kept only as light fill reference; actual minor lines drawn in JS -->
        <pattern id="grid-fine" width="0.25" height="0.25" patternUnits="userSpaceOnUse">
          <path d="M 0.25 0 L 0 0 0 0.25" fill="none" stroke="#000000" stroke-width="1" stroke-opacity="0.20" vector-effect="non-scaling-stroke"/>
        </pattern>
        <pattern id="grid-1" width="1" height="1" patternUnits="userSpaceOnUse">
          <rect width="1" height="1" fill="#ffffff"/>
        </pattern>
      </defs>

      <g id="camera">
        <!-- bed fill = light grid only; rim drawn separately pure black -->
        <rect id="bed-fill"
              x="0" y="0" width="48" height="48"
              fill="url(#grid-1)"/>

        <!-- major grid lines (aligned to label interval) — redrawn -->
        <g id="major-grid"></g>

        <!-- bed rim — prior weight -->
        <rect id="bed-rim"
              x="0" y="0" width="48" height="48"
              fill="none"
              stroke="#000"
              stroke-width="0.08"
              vector-effect="non-scaling-stroke"/>

        <!-- left + bottom laser bed edges: #000 @ 50%, 1.75px -->
        <line id="edge-x" x1="0" y1="0" x2="48" y2="0" stroke="#000000" stroke-opacity="0.50" stroke-width="1.75" vector-effect="non-scaling-stroke"/>
        <line id="edge-y" x1="0" y1="0" x2="0" y2="48" stroke="#000000" stroke-opacity="0.50" stroke-width="1.75" vector-effect="non-scaling-stroke"/>
        <circle cx="0" cy="0" r="0.12" fill="#000000"/>

        <g id="bed-rulers"></g>

        <!-- blank: pure black outline -->
        <rect id="blank"
              x="0" y="0"
              width="12" height="8"
              fill="#ffffff"
              fill-opacity="0.80"
              stroke="#000000"
              stroke-opacity="1"
              stroke-width="1.25"
              vector-effect="non-scaling-stroke"/>

        <rect id="free-corner"
              x="11.72" y="7.72"
              width="0.28" height="0.28"
              fill="rgba(0,0,0,0.14)"
              stroke="#000000"
              stroke-opacity="1"
              stroke-width="1.25"
              vector-effect="non-scaling-stroke"
              style="pointer-events: none;"/>

        <rect id="hit-right"  x="11.65" y="0"    width="0.7" height="8"  fill="transparent" style="cursor: ew-resize;"/>
        <rect id="hit-top"    x="0"     y="7.65" width="12"  height="0.7" fill="transparent" style="cursor: ns-resize;"/>
        <rect id="hit-corner" x="11.4"  y="7.4"  width="1.1" height="1.1" fill="transparent" style="cursor: nesw-resize;"/>
      </g>
    </svg>

    <div id="chrome">
      <!-- CirclePlus -->
      <button type="button" id="btn-zoom-in" title="Zoom in" aria-label="Zoom in">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>
      </button>
      <!-- CircleMinus -->
      <button type="button" id="btn-zoom-out" title="Zoom out" aria-label="Zoom out">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/></svg>
      </button>
      <!-- Lucide Scan (corners only) -->
      <button type="button" id="btn-reset" title="Fit 48×48 bed" aria-label="Fit bed">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7V5a2 2 0 0 1 2-2h2"/>
          <path d="M17 3h2a2 2 0 0 1 2 2v2"/>
          <path d="M21 17v2a2 2 0 0 1-2 2h-2"/>
          <path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
        </svg>
      </button>
    </div>
    <div id="readout">blank 12.00 × 8.00 in · bed 48×48 · snap 0.25</div>
  </div>

  <script>
    const BED = 48;
    const state = {
      blankW: 12,
      blankH: 8,
      snap: 0.25,
      zoom: 1,
      panX: 0,
      panY: 0,
      dragging: null,
      start: null,
    };

    const svg = document.getElementById('world');
    const camera = document.getElementById('camera');
    const blank = document.getElementById('blank');
    const freeCorner = document.getElementById('free-corner');
    const hitRight = document.getElementById('hit-right');
    const hitTop = document.getElementById('hit-top');
    const hitCorner = document.getElementById('hit-corner');
    const bedRulers = document.getElementById('bed-rulers');
    const majorGrid = document.getElementById('major-grid');
    const readout = document.getElementById('readout');

    const PAD = 36;
    // min screen px between labeled ticks before we drop to a coarser step
    const MIN_LABEL_PX = 36;

    function snap(v) {
      const s = state.snap;
      return Math.round(v / s) * s;
    }

    function fittedScale() {
      const W = svg.clientWidth || window.innerWidth;
      const H = svg.clientHeight || window.innerHeight;
      const usableW = Math.max(80, W - PAD * 2);
      const usableH = Math.max(80, H - PAD * 2);
      return Math.min(usableW / BED, usableH / BED);
    }

    function pxPerInch() {
      return fittedScale() * state.zoom;
    }

    /**
     * Progressive label step from screen density.
     * Prefer 12 → 6 → 3 → 1, only when labels stay ≥ MIN_LABEL_PX apart.
     * Avoids the crowded 1,2,3… mid-zoom problem.
     */
    function labelStep() {
      const s = pxPerInch();
      const candidates = [12, 6, 3, 1];
      for (let i = candidates.length - 1; i >= 0; i--) {
        const step = candidates[i];
        if (step * s >= MIN_LABEL_PX) return step;
      }
      return 12;
    }

    /** Tick marks can be denser than labels */
    function tickStep(labelStep) {
      if (labelStep >= 12) return 12;
      if (labelStep >= 6) return 6;
      if (labelStep >= 3) return 1;
      return 1;
    }

    function applyCamera() {
      const s = pxPerInch();
      camera.setAttribute(
        'transform',
        `translate(${state.panX}, ${state.panY}) scale(${s}, ${-s})`
      );
    }

    function layoutBlank() {
      const w = state.blankW;
      const h = state.blankH;
      blank.setAttribute('width', w);
      blank.setAttribute('height', h);

      const cs = 0.28;
      freeCorner.setAttribute('x', w - cs);
      freeCorner.setAttribute('y', h - cs);

      hitRight.setAttribute('x', w - 0.35);
      hitRight.setAttribute('y', 0);
      hitRight.setAttribute('width', 0.7);
      hitRight.setAttribute('height', h);

      hitTop.setAttribute('x', 0);
      hitTop.setAttribute('y', h - 0.35);
      hitTop.setAttribute('width', w);
      hitTop.setAttribute('height', 0.7);

      hitCorner.setAttribute('x', w - 0.55);
      hitCorner.setAttribute('y', h - 0.55);
      hitCorner.setAttribute('width', 1.1);
      hitCorner.setAttribute('height', 1.1);
    }

    function drawMajorGrid(step) {
      majorGrid.innerHTML = '';
      // minor grid: every 1" — #000 @ 10%, 1px
      for (let i = 1; i < BED; i++) {
        majorGrid.appendChild(line(i, 0, i, BED, 1, '#000000', 0.10));
        majorGrid.appendChild(line(0, i, BED, i, 1, '#000000', 0.10));
      }
      // major grid: aligned to label step — #000 @ 30%, 1px (drawn on top)
      for (let i = step; i < BED; i += step) {
        majorGrid.appendChild(line(i, 0, i, BED, 1, '#000000', 0.30));
        majorGrid.appendChild(line(0, i, BED, i, 1, '#000000', 0.30));
      }
    }

    function drawBedRulers() {
      const s = pxPerInch();
      const L = labelStep();
      const T = tickStep(L);
      bedRulers.innerHTML = '';
      drawMajorGrid(L);

      const fontWorld = 11 / s;
      // outward ticks (outside bed) — darker
      const tickOut = Math.max(0.4, 11 / s);
      const labelOff = Math.max(0.65, 16 / s);
      const gap = Math.max(0.12, 3 / s); // space between tick end and number

      for (let i = 0; i <= BED; i += T) {
        const isLabel = (i % L === 0) && i !== 0;
        const isMajor = (i % L === 0);
        const len = isMajor ? tickOut * 1.4 : tickOut * 0.75;
        // grid overhang (outside bed): #000 @ 30%, 1px
        const col = '#000000';
        const sw = 1;
        const tickOp = 0.30;

        if (i > 0) {
          // X: bottom edge, tick outward (−Y) — overhang
          bedRulers.appendChild(line(i, 0, i, -len, sw, col, tickOp));
          // Y: left edge, tick outward (−X) — overhang
          bedRulers.appendChild(line(0, i, -len, i, sw, col, tickOp));
        }

        if (isLabel) {
          // numbers centered on the grid line, clear of the tick
          bedRulers.appendChild(label(i, -(len + gap + fontWorld * 0.15), String(i), fontWorld, 'middle', 'hanging'));
          bedRulers.appendChild(label(-(len + gap), i, String(i), fontWorld, 'end', 'middle'));
        }
      }

      // origin 0 outside the corner
      bedRulers.appendChild(label(-labelOff * 0.55, -labelOff * 0.55, '0', fontWorld, 'end', 'hanging'));
    }

    function line(x1, y1, x2, y2, sw, color, opacity) {
      const n = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      n.setAttribute('x1', x1); n.setAttribute('y1', y1);
      n.setAttribute('x2', x2); n.setAttribute('y2', y2);
      n.setAttribute('stroke', color || '#000');
      n.setAttribute('stroke-width', sw);
      n.setAttribute('opacity', opacity != null ? opacity : 1);
      n.setAttribute('vector-effect', 'non-scaling-stroke');
      return n;
    }

    function label(x, y, text, size, anchor, baseline) {
      const n = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      n.setAttribute('x', x);
      n.setAttribute('y', y);
      n.setAttribute('font-size', size);
      n.setAttribute('fill', '#000000');
      n.setAttribute('text-anchor', anchor);
      n.setAttribute('dominant-baseline', baseline);
      n.setAttribute('transform', `translate(${x}, ${y}) scale(1, -1) translate(${-x}, ${-y})`);
      n.textContent = text;
      return n;
    }

    function updateReadout() {
      readout.textContent =
        `blank ${state.blankW.toFixed(2)} × ${state.blankH.toFixed(2)} in · bed ${BED}×${BED} · snap ${state.snap} · zoom ${state.zoom.toFixed(2)}×`;
    }

    function render() {
      layoutBlank();
      applyCamera();
      drawBedRulers();
      updateReadout();
    }

    function fitBed() {
      state.zoom = 1;
      const s = fittedScale();
      const W = svg.clientWidth || window.innerWidth;
      const H = svg.clientHeight || window.innerHeight;
      state.panX = (W - BED * s) / 2;
      state.panY = (H + BED * s) / 2;
    }

    function onPointerDown(e) {
      const t = e.target;
      if (t === hitCorner || t.id === 'hit-corner') {
        state.dragging = 'xy';
        document.body.classList.add('dragging-xy');
      } else if (t === hitRight || t.id === 'hit-right') {
        state.dragging = 'x';
        document.body.classList.add('dragging-x');
      } else if (t === hitTop || t.id === 'hit-top') {
        state.dragging = 'y';
        document.body.classList.add('dragging-y');
      } else {
        state.dragging = 'pan';
        document.body.classList.add('panning', 'dragging');
      }
      state.start = {
        cx: e.clientX, cy: e.clientY,
        w: state.blankW, h: state.blankH,
        panX: state.panX, panY: state.panY,
      };
      try { e.target.setPointerCapture(e.pointerId); } catch (_) {}
      e.preventDefault();
    }

    function onPointerMove(e) {
      if (!state.dragging || !state.start) return;
      const dx = e.clientX - state.start.cx;
      const dy = e.clientY - state.start.cy;
      const s = pxPerInch();

      if (state.dragging === 'pan') {
        state.panX = state.start.panX + dx;
        state.panY = state.start.panY + dy;
      } else if (state.dragging === 'x') {
        state.blankW = Math.max(state.snap, snap(state.start.w + dx / s));
      } else if (state.dragging === 'y') {
        state.blankH = Math.max(state.snap, snap(state.start.h - dy / s));
      } else if (state.dragging === 'xy') {
        state.blankW = Math.max(state.snap, snap(state.start.w + dx / s));
        state.blankH = Math.max(state.snap, snap(state.start.h - dy / s));
      }
      render();
    }

    function onPointerUp() {
      state.dragging = null;
      state.start = null;
      document.body.classList.remove('dragging-x', 'dragging-y', 'dragging-xy', 'panning', 'dragging');
    }

    svg.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', onPointerUp);

    svg.addEventListener('wheel', (e) => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
      const newZoom = Math.min(12, Math.max(0.35, state.zoom * factor));
      const s0 = pxPerInch();
      const s1 = fittedScale() * newZoom;
      const wx = (e.clientX - state.panX) / s0;
      const wy = (state.panY - e.clientY) / s0;
      state.zoom = newZoom;
      state.panX = e.clientX - wx * s1;
      state.panY = e.clientY + wy * s1;
      render();
    }, { passive: false });

    document.getElementById('btn-zoom-in').onclick = () => {
      state.zoom = Math.min(12, state.zoom * 1.25);
      render();
    };
    document.getElementById('btn-zoom-out').onclick = () => {
      state.zoom = Math.max(0.35, state.zoom / 1.25);
      render();
    };
    document.getElementById('btn-reset').onclick = () => {
      state.blankW = 12;
      state.blankH = 8;
      fitBed();
      render();
    };

    window.addEventListener('resize', () => {
      fitBed();
      render();
    });

    fitBed();
    render();
  </script>
</body>
</html>
