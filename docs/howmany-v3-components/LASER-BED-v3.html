<!DOCTYPE html>
<!--
═══════════════════════════════════════════════════════════════════════════════
LASER-BED-v3 — Individual component lock (bed + blank ticker residual)
Authority bed: LASER-BED-v3-v1 (sha256 408ce4470f2c9d4d…)
Ticker residual from R31 + right-pin + popover chrome

Locked bed chrome
  · origin pinned bottom-left · fit 48×48
  · blank fill #fff @ 80% · stroke #000 1.25px
  · major/minor grid · free-corner · progressive labels
  · Lucide CirclePlus / CircleMinus / Scan · depressed press

Locked blank ticker
  · Height 34px · 20px inset from blank RIGHT · 10px above blank top
  · Shell = HUD popover: background rgba(26,20,40,0.82)
  · Readout text = system amber #FFCE1B · calc Lucide icon stays white
  · Blank snap = 0.125 in
  · Live blank size readout · not draggable · z-index 22
  · Calc chip chrome only (no HUD bridge in this package)

NO HUD panel · NO FLiPIT · NO toolPath · NO isolator · NO child-spec
═══════════════════════════════════════════════════════════════════════════════
-->
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HowMany V3 — LaserBed (standalone · bed + blank ticker)</title>
<style>
  :root {
    --font: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    --ink: #1A1428;
    --blue: #538BEC;
    --chip-r: 6.6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; font-family: var(--font); color: var(--ink); background: #fff; }

  /* LaserBed stage */
  .bed-stage { position: fixed; inset: 0; background: #fff; overflow: hidden; z-index: 0; }
  .lb-world { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .lb-chrome {
    position: absolute; top: 12px; right: 12px; display: flex; gap: 6px; z-index: 15;
  }
  .lb-chrome button {
    width: 28px; height: 28px; padding: 0; border: 1px solid #a2a2a2; border-radius: 4px;
    background: #fff; color: #171717; display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; line-height: 0;
  }
  .lb-chrome button:active { transform: translateY(1px); background: #f3f3f3; }
  body.lb-dragging-x { cursor: ew-resize; }
  body.lb-dragging-y { cursor: ns-resize; }
  body.lb-dragging-xy { cursor: nesw-resize; }
  body.lb-panning { cursor: grab; }
  body.lb-panning.lb-dragging { cursor: grabbing; }

  /* Blank ticker — right-pinned to blank */
  .blank-ticker {
    position: fixed;
    z-index: 22;
    height: 34px;
    min-height: 34px;
    display: none;
    align-items: center;
    gap: 8px;
    padding: 0 6px 0 12px;
    box-sizing: border-box;
    border-radius: 6.6px;
    border: 1.1px solid rgba(255, 255, 255, 0.12);
    background: rgba(26, 20, 40, 0.82); /* HUD popover transparent black */
    color: #FFCE1B; /* system amber */
    font-family: var(--font-mono);
    font-size: 12.1px;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    box-shadow: 0 0.5px 1px rgba(0, 0, 0, 0.25);
    pointer-events: auto;
    user-select: none;
    touch-action: none;
  }
  .blank-ticker.is-on { display: inline-flex; }
  .blank-ticker .bt-readout { line-height: 1; letter-spacing: 0.01em; }
  .blank-ticker .bt-calc {
    width: 26px; height: 26px; min-width: 26px; min-height: 26px;
    margin: 0; padding: 0;
    border: 1.1px solid rgba(255, 255, 255, 0.18);
    border-radius: 6.6px;
    background: rgba(255, 255, 255, 0.12);
    color: #ffffff; /* Lucide icon stays white */
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0; line-height: 0;
  }
  .blank-ticker .bt-calc:hover { background: rgba(255,255,255,0.22); color: #ffffff; }
  .blank-ticker .bt-calc:active { transform: scale(0.94); }
  .blank-ticker .bt-calc svg { display: block; width: 15px; height: 15px; pointer-events: none; }
</style>
</head>
<body>
  <div class="bed-stage" id="laser-bed-host">
    <svg class="lb-world" id="lb-world" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="lb-grid-1" width="1" height="1" patternUnits="userSpaceOnUse">
          <rect width="1" height="1" fill="#ffffff"/>
        </pattern>
      </defs>
      <g id="lb-camera">
        <rect id="lb-bed-fill" x="0" y="0" width="48" height="48" fill="url(#lb-grid-1)"/>
        <g id="lb-major-grid"></g>
        <rect id="lb-bed-rim" x="0" y="0" width="48" height="48" fill="none" stroke="#000" stroke-width="0.08" vector-effect="non-scaling-stroke"/>
        <line id="lb-edge-x" x1="0" y1="0" x2="48" y2="0" stroke="#000000" stroke-opacity="0.50" stroke-width="1.75" vector-effect="non-scaling-stroke"/>
        <line id="lb-edge-y" x1="0" y1="0" x2="0" y2="48" stroke="#000000" stroke-opacity="0.50" stroke-width="1.75" vector-effect="non-scaling-stroke"/>
        <circle cx="0" cy="0" r="0.12" fill="#000000"/>
        <g id="lb-bed-rulers"></g>
        <rect id="lb-blank" x="0" y="0" width="12" height="8" fill="#ffffff" fill-opacity="0.80" stroke="#000000" stroke-width="1.25" vector-effect="non-scaling-stroke"/>
        <rect id="lb-free-corner" x="11.72" y="7.72" width="0.28" height="0.28" fill="rgba(0,0,0,0.14)" stroke="#000000" stroke-width="1.25" vector-effect="non-scaling-stroke" style="pointer-events:none"/>
        <rect id="lb-hit-right"  x="11.65" y="0"    width="0.7" height="8"  fill="transparent" style="cursor:ew-resize"/>
        <rect id="lb-hit-top"    x="0"     y="7.65" width="12"  height="0.7" fill="transparent" style="cursor:ns-resize"/>
        <rect id="lb-hit-corner" x="11.4"  y="7.4"  width="1.1" height="1.1" fill="transparent" style="cursor:nesw-resize"/>
      </g>
    </svg>
    <div class="lb-chrome">
      <button type="button" id="lb-zoom-in" title="Zoom in"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg></button>
      <button type="button" id="lb-zoom-out" title="Zoom out"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/></svg></button>
      <button type="button" id="lb-fit" title="Fit"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/></svg></button>
    </div>

    <!-- Blank ticker — right edge of blank -->
    <div class="blank-ticker" id="blank-ticker" aria-label="Blank size">
      <span class="bt-readout" id="bt-readout">12.000 × 8.000</span>
      <button type="button" class="bt-calc" id="bt-calc" title="Calculator" aria-label="Calculator">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <rect width="16" height="20" x="4" y="2" rx="2"/>
          <line x1="8" x2="16" y1="6" y2="6"/>
          <line x1="16" x2="16" y1="14" y2="18"/>
          <path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/>
          <path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/>
        </svg>
      </button>
    </div>
  </div>

<script>
/* LaserBed host + blank ticker right-pin residual */
(function () {
  var BED = 48;
  var state = { blankW: 12, blankH: 8, snap: 0.125, zoom: 1, panX: 0, panY: 0, dragging: null, start: null };

  var svg = document.getElementById('lb-world');
  var camera = document.getElementById('lb-camera');
  var blank = document.getElementById('lb-blank');
  var freeCorner = document.getElementById('lb-free-corner');
  var hitRight = document.getElementById('lb-hit-right');
  var hitTop = document.getElementById('lb-hit-top');
  var hitCorner = document.getElementById('lb-hit-corner');
  var bedRulers = document.getElementById('lb-bed-rulers');
  var majorGrid = document.getElementById('lb-major-grid');
  var blankTicker = document.getElementById('blank-ticker');
  var btReadout = document.getElementById('bt-readout');
  if (!svg || !camera || !blank) return;

  var PAD = 36;
  var MIN_LABEL_PX = 36;
  var TICKER_H = 34;
  var GAP_TOP = 10;   /* px above blank top */
  var GAP_RIGHT = 20; /* px inset from blank right edge */

  function snap(v) { var s = state.snap; return Math.round(v / s) * s; }
  function fittedScale() {
    var W = svg.clientWidth || window.innerWidth;
    var H = svg.clientHeight || window.innerHeight;
    return Math.min(Math.max(80, W - PAD * 2) / BED, Math.max(80, H - PAD * 2) / BED);
  }
  function pxPerInch() { return fittedScale() * state.zoom; }
  function labelStep() {
    var s = pxPerInch(), candidates = [12, 6, 3, 1];
    for (var i = candidates.length - 1; i >= 0; i--) if (candidates[i] * s >= MIN_LABEL_PX) return candidates[i];
    return 12;
  }
  function tickStep(L) { if (L >= 12) return 12; if (L >= 6) return 6; return 1; }

  function applyCamera() {
    var s = pxPerInch();
    camera.setAttribute('transform', 'translate(' + state.panX + ', ' + state.panY + ') scale(' + s + ', ' + (-s) + ')');
  }
  function layoutBlank() {
    var w = state.blankW, h = state.blankH, cs = 0.28;
    blank.setAttribute('width', w); blank.setAttribute('height', h);
    freeCorner.setAttribute('x', w - cs); freeCorner.setAttribute('y', h - cs);
    hitRight.setAttribute('x', w - 0.35); hitRight.setAttribute('y', 0);
    hitRight.setAttribute('width', 0.7); hitRight.setAttribute('height', h);
    hitTop.setAttribute('x', 0); hitTop.setAttribute('y', h - 0.35);
    hitTop.setAttribute('width', w); hitTop.setAttribute('height', 0.7);
    hitCorner.setAttribute('x', w - 0.55); hitCorner.setAttribute('y', h - 0.55);
    hitCorner.setAttribute('width', 1.1); hitCorner.setAttribute('height', 1.1);
  }
  function line(x1, y1, x2, y2, sw, color, opacity) {
    var n = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    n.setAttribute('x1', x1); n.setAttribute('y1', y1); n.setAttribute('x2', x2); n.setAttribute('y2', y2);
    n.setAttribute('stroke', color || '#000'); n.setAttribute('stroke-width', sw);
    n.setAttribute('opacity', opacity != null ? opacity : 1);
    n.setAttribute('vector-effect', 'non-scaling-stroke');
    return n;
  }
  function label(x, y, text, size, anchor, baseline) {
    var n = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    n.setAttribute('x', x); n.setAttribute('y', y); n.setAttribute('font-size', size);
    n.setAttribute('fill', '#000'); n.setAttribute('text-anchor', anchor); n.setAttribute('dominant-baseline', baseline);
    n.setAttribute('transform', 'translate(' + x + ',' + y + ') scale(1,-1) translate(' + (-x) + ',' + (-y) + ')');
    n.textContent = text; return n;
  }
  function drawMajorGrid(step) {
    majorGrid.innerHTML = '';
    for (var i = 1; i < BED; i++) {
      majorGrid.appendChild(line(i, 0, i, BED, 1, '#000', 0.10));
      majorGrid.appendChild(line(0, i, BED, i, 1, '#000', 0.10));
    }
    for (var j = step; j < BED; j += step) {
      majorGrid.appendChild(line(j, 0, j, BED, 1, '#000', 0.30));
      majorGrid.appendChild(line(0, j, BED, j, 1, '#000', 0.30));
    }
  }
  function drawBedRulers() {
    var s = pxPerInch(), L = labelStep(), T = tickStep(L);
    bedRulers.innerHTML = ''; drawMajorGrid(L);
    var fontWorld = 11 / s, tickOut = Math.max(0.4, 11 / s), gap = Math.max(0.12, 3 / s);
    for (var i = 0; i <= BED; i += T) {
      var isLabel = (i % L === 0) && i !== 0, isMajor = (i % L === 0);
      var len = isMajor ? tickOut * 1.4 : tickOut * 0.75;
      if (i > 0) {
        bedRulers.appendChild(line(i, 0, i, -len, 1, '#000', 0.30));
        bedRulers.appendChild(line(0, i, -len, i, 1, '#000', 0.30));
      }
      if (isLabel) {
        bedRulers.appendChild(label(i, -(len + gap + fontWorld * 0.15), String(i), fontWorld, 'middle', 'hanging'));
        bedRulers.appendChild(label(-(len + gap), i, String(i), fontWorld, 'end', 'middle'));
      }
    }
    bedRulers.appendChild(label(-Math.max(0.65, 16 / s) * 0.55, -Math.max(0.65, 16 / s) * 0.55, '0', fontWorld, 'end', 'hanging'));
  }

  /* Right-pin residual: 20px from blank right · 10px above blank top */
  function positionBlankTicker() {
    if (!blankTicker) return;
    var s = pxPerInch();
    var screenLeft = state.panX;
    var screenRight = state.panX + state.blankW * s;
    var screenTop = state.panY - state.blankH * s;

    blankTicker.classList.add('is-on');
    var txt = state.blankW.toFixed(3) + ' × ' + state.blankH.toFixed(3);
    if (btReadout) btReadout.textContent = txt;

    /* measure after text update */
    var tw = blankTicker.offsetWidth || 140;
    blankTicker.style.left = Math.round(screenRight - tw - GAP_RIGHT) + 'px';
    blankTicker.style.top = Math.round(screenTop - TICKER_H - GAP_TOP) + 'px';
  }

  function render() {
    layoutBlank(); applyCamera(); drawBedRulers(); positionBlankTicker();
  }
  function fitBed() {
    state.zoom = 1;
    var s = fittedScale();
    var W = svg.clientWidth || window.innerWidth;
    var H = svg.clientHeight || window.innerHeight;
    state.panX = (W - BED * s) / 2;
    state.panY = (H + BED * s) / 2;
  }

  function onPointerDown(e) {
    var t = e.target;
    if (t === hitCorner || t.id === 'lb-hit-corner') { state.dragging = 'xy'; document.body.classList.add('lb-dragging-xy'); }
    else if (t === hitRight || t.id === 'lb-hit-right') { state.dragging = 'x'; document.body.classList.add('lb-dragging-x'); }
    else if (t === hitTop || t.id === 'lb-hit-top') { state.dragging = 'y'; document.body.classList.add('lb-dragging-y'); }
    else { state.dragging = 'pan'; document.body.classList.add('lb-panning', 'lb-dragging'); }
    state.start = { cx: e.clientX, cy: e.clientY, w: state.blankW, h: state.blankH, panX: state.panX, panY: state.panY };
    try { e.target.setPointerCapture(e.pointerId); } catch (_) {}
    e.preventDefault();
  }
  function onPointerMove(e) {
    if (!state.dragging || !state.start) return;
    var dx = e.clientX - state.start.cx, dy = e.clientY - state.start.cy, s = pxPerInch();
    if (state.dragging === 'pan') { state.panX = state.start.panX + dx; state.panY = state.start.panY + dy; }
    else if (state.dragging === 'x') state.blankW = Math.max(state.snap, snap(state.start.w + dx / s));
    else if (state.dragging === 'y') state.blankH = Math.max(state.snap, snap(state.start.h - dy / s));
    else if (state.dragging === 'xy') {
      state.blankW = Math.max(state.snap, snap(state.start.w + dx / s));
      state.blankH = Math.max(state.snap, snap(state.start.h - dy / s));
    }
    render();
  }
  function onPointerUp() {
    state.dragging = null; state.start = null;
    document.body.classList.remove('lb-dragging-x','lb-dragging-y','lb-dragging-xy','lb-panning','lb-dragging');
  }

  svg.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);
  window.addEventListener('pointercancel', onPointerUp);
  svg.addEventListener('wheel', function (e) {
    e.preventDefault();
    var factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
    var newZoom = Math.min(12, Math.max(0.35, state.zoom * factor));
    var s0 = pxPerInch(), s1 = fittedScale() * newZoom;
    var wx = (e.clientX - state.panX) / s0, wy = (state.panY - e.clientY) / s0;
    state.zoom = newZoom;
    state.panX = e.clientX - wx * s1;
    state.panY = e.clientY + wy * s1;
    render();
  }, { passive: false });

  document.getElementById('lb-zoom-in').onclick = function () { state.zoom = Math.min(12, state.zoom * 1.25); render(); };
  document.getElementById('lb-zoom-out').onclick = function () { state.zoom = Math.max(0.35, state.zoom / 1.25); render(); };
  document.getElementById('lb-fit').onclick = function () { state.blankW = 12; state.blankH = 8; fitBed(); render(); };
  window.addEventListener('resize', function () { fitBed(); render(); });

  fitBed(); render();
})();
</script>
</body>
</html>
