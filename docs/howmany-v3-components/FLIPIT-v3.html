<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>HowMany V3 — FLiPIT (standalone · pre-LaserBed)</title>
  <style>
    :root {
      --font: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --frost: #D8D6E2;
      --frost-blue: #E8EEF8;
      --ink: #1A1428;
      --ink-50: rgba(26, 20, 40, 0.50);
      --ink-30: rgba(26, 20, 40, 0.30);
      --ink-22: rgba(26, 20, 40, 0.22);
      --ink-15: rgba(26, 20, 40, 0.15);
      --ink-08: rgba(26, 20, 40, 0.08);
      --white: #ffffff;
      --white-70: rgba(255, 255, 255, 0.70);
      --white-55: rgba(255, 255, 255, 0.55);
      --white-40: rgba(255, 255, 255, 0.40);
      --blue: #538BEC;
      --blue-22: rgba(83, 139, 236, 0.22);
      --blue-28: rgba(83, 139, 236, 0.28);
      --blue-42: rgba(83, 139, 236, 0.42);
      --blue-dark: #2F6FED;
      --blue-border: rgba(47, 111, 237, 0.85);
      --blue-glow: 0 0 0 2.2px rgba(47, 111, 237, 0.45);
      --status-none: #DC143C;
      --status-ready: #00CF00;
      --status-posted: #7DDB8C;
      --green: #00CF00;
      --green-border: rgba(0, 140, 30, 0.70);
      --green-glow: 0 0 0 2.2px rgba(0, 180, 40, 0.45);
      --chip-gray: rgba(26, 20, 40, 0.10);
      --gc-g: #FF00FF;
      --gc-comment: #00CF00;
      --gc-m: #FF8380;
      --gc-fs: #F86400;
      --gc-t: #538BEC;
      --gc-n: #D3D3D3;
      --accept: #22A06B;
      --cancel: #DC143C;
      --panel-w: 418px;
      --bar-h: 44px;
      --radius: 15.4px;
      --chip-r: 6.6px;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
      --dur: 240ms;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: var(--font);
      color: var(--ink);
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      background: #F4F4F6;
    }
    body {
      background:
        linear-gradient(rgba(0,0,0,0.04) 1.1px, transparent 1.1px),
        linear-gradient(90deg, rgba(0,0,0,0.04) 1.1px, transparent 1.1px),
        #F4F4F6;
      background-size: 26.4px 26.4px, 26.4px 26.4px, auto;
    }
    .stage-note {
      position: fixed;
      left: 16px;
      bottom: 16px;
      z-index: 5;
      font-size: 12.1px;
      font-weight: 600;
      color: rgba(26,20,40,0.45);
      background: rgba(216,214,226,0.72);
      border: 1.1px solid rgba(26,20,40,0.10);
      border-radius: 8.8px;
      padding: 6.6px 13.2px;
      pointer-events: none;
      white-space: nowrap;
    }

    /* ── FLiPIT shell ── */
    .gcode {
      position: absolute;
      top: 16px;
      right: 16px;
      left: auto;
      width: var(--panel-w);
      min-width: 418px;
      max-width: 568px;
      display: flex;
      flex-direction: column;
      background: var(--frost);
      color: var(--ink);
      font-family: var(--font);
      border-radius: var(--radius);
      box-shadow:
        0 0 0 1.1px rgba(255, 255, 255, 0.55),
        0 0 0 1.1px rgba(83, 139, 236, 0.22);
      overflow: visible;
      z-index: 30;
      height: auto;
      touch-action: none;
    }
    .gcode::after {
      content: "";
      position: absolute;
      top: -8px; right: -8px; bottom: -8px; left: -8px;
      border: 2px solid rgba(26, 20, 40, 0.22);
      border-radius: calc(var(--radius) + 8px);
      box-shadow: 0 18px 40px -12px rgba(0, 0, 0, 0.38);
      pointer-events: none;
      z-index: -1;
      transition: border-color 180ms var(--ease), box-shadow 180ms var(--ease);
    }
    .gcode.is-post-flash::after {
      border-width: 1px;
      border-color: rgba(0, 180, 40, 0.90);
      box-shadow:
        0 0 2px 2px rgba(0, 180, 40, 0.70),
        0 18px 40px -12px rgba(0, 0, 0, 0.38);
    }
    .gcode:has(.surface-row.is-editing-banner)::after {
      border-width: 1px;
      border-color: #FFCE1B;
      box-shadow:
        0 0 2px 2px rgba(255, 206, 27, 0.55),
        0 18px 40px -12px rgba(0, 0, 0, 0.38);
    }
    .gcode:has(.surface-row.is-editing-banner) .status-dot {
      background: #FFCE1B !important;
    }
    .gcode:has(.surface-row.is-editing-banner) .action-row .stage-action,
    .gcode:has(.surface-row.is-editing-banner) .action-row .stage-status,
    .gcode:has(.surface-row.is-editing-banner) .action-row .rot-chip,
    .gcode:has(.surface-row.is-editing-banner) .action-row .btn-collapse {
      filter: grayscale(1) !important;
      opacity: 0.55 !important;
      pointer-events: none !important;
      box-shadow: none !important;
      border-color: rgba(26, 20, 40, 0.14) !important;
      cursor: default !important;
      transform: none !important;
    }
    .gcode:has(.surface-row.is-editing-banner) .action-row .stage-action,
    .gcode:has(.surface-row.is-editing-banner) .action-row .stage-status {
      background: var(--chip-gray) !important;
      color: var(--ink-50) !important;
      border: 1.1px solid rgba(26, 20, 40, 0.14) !important;
    }
    .gcode:has(.surface-row.is-editing-banner) .tool-strip .icon-btn {
      filter: grayscale(1) !important;
      opacity: 0.45 !important;
      pointer-events: none !important;
      box-shadow: none !important;
      border-color: rgba(26, 20, 40, 0.12) !important;
      background: var(--white-40) !important;
      color: var(--ink-30) !important;
      cursor: default !important;
      transform: none !important;
    }
    .gcode:has(.surface-row.is-editing-banner) .tool-strip .unit-switch {
      filter: grayscale(1) !important;
      opacity: 0.45 !important;
      pointer-events: none !important;
    }
    .gcode:has(.surface-row.is-editing-banner) .btn-detect,
    .gcode:has(.surface-row.is-editing-banner) .part-group .btn-detect,
    .gcode:has(.surface-row.is-editing-banner) .part-group .btn-post,
    .gcode:has(.surface-row.is-editing-banner) .part-group .part-ticker {
      box-shadow: none !important;
      border-color: rgba(26, 20, 40, 0.12) !important;
      border-width: 1.1px !important;
      background: var(--white-40) !important;
    }
    .gcode:has(.surface-row.is-editing-banner) .part-group.is-connected {
      border-color: rgba(26, 20, 40, 0.12) !important;
      box-shadow: none !important;
      background: var(--white-40) !important;
    }
    .gcode:has(.surface-row.is-editing-banner) .part-group.is-connected .btn-detect,
    .gcode:has(.surface-row.is-editing-banner) .part-group.is-connected .btn-post,
    .gcode:has(.surface-row.is-editing-banner) .part-group.is-connected .part-ticker {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
    }

    .gcode-toast {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%) scale(0.96);
      min-width: 132px;
      max-width: calc(100% - 17.6px);
      padding: 8.8px 15.4px;
      border-radius: 8.8px;
      background: rgba(26, 20, 40, 0.60);
      color: #FFCE1B;
      font-size: 12.1px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-align: center;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      z-index: 40;
      box-shadow: 0 11px 26.4px -10px rgba(0,0,0,0.50);
      transition: opacity 180ms var(--ease), transform 180ms var(--ease);
    }
    .gcode-toast.is-on {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    /* Header — dark ink shell */
    .gcode-bar {
      flex: 0 0 var(--bar-h);
      height: var(--bar-h);
      display: flex;
      align-items: center;
      gap: 6.6px;
      padding: 0 7.7px;
      border-bottom: 1.1px solid rgba(255, 255, 255, 0.10);
      cursor: grab;
      box-sizing: border-box;
      min-width: 0;
      position: relative;
      z-index: 1;
      border-radius: var(--radius) var(--radius) 0 0;
      background: rgba(26, 20, 40, 0.82);
    }
    .gcode.is-dragging .gcode-bar { cursor: grabbing; }
    .gcode-bar .mark {
      width: 28.6px; height: 28.6px;
      border-radius: var(--chip-r);
      background: rgba(255, 255, 255, 0.12);
      border: 1.1px solid rgba(255, 255, 255, 0.18);
      color: #ffffff;
      display: inline-flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .gcode-bar .mark svg { display: block; }
    .gcode-bar .surface-label-slot {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding-left: 10px;
    }
    .gcode-bar .surface-label {
      font-family: var(--font);
      font-size: 19.8px;
      font-weight: 700;
      letter-spacing: -0.02em;
      white-space: nowrap;
      user-select: none;
      line-height: 1;
    }
    .gcode-bar .surface-label .label-flip {
      color: #ffffff;
      text-transform: none;
    }
    .gcode-bar .surface-label .label-it {
      color: #FFCE1B;
      font-weight: 800;
      text-transform: none;
    }

    .prog-field {
      position: relative;
      flex: 0 0 auto;
      width: 184.8px;
      max-width: 184.8px;
      min-width: 0;
      height: 28.6px;
      margin-left: 0;
    }
    .prog-name {
      width: 100%;
      height: 28.6px;
      padding: 0 79.2px 0 8.8px;
      border: 1.1px solid transparent;
      border-radius: var(--chip-r);
      background: #fff;
      color: var(--ink);
      font-size: 12.1px;
      font-weight: 600;
      font-family: inherit;
      outline: none;
      text-align: right;
    }
    .prog-name::placeholder { color: var(--ink-30); font-weight: 500; }
    .prog-name:focus {
      background: #fff;
      border-color: rgba(83, 139, 236, 0.45);
      box-shadow: 0 0 0 2.2px var(--blue-22);
    }
    .prog-actions {
      position: absolute;
      right: 3.3px;
      top: 50%;
      transform: translateY(-50%);
      display: inline-flex;
      align-items: center;
      gap: 2.2px;
    }
    .prog-actions .icon-btn {
      width: 24.2px;
      height: 24.2px;
      min-width: 24.2px;
      min-height: 24.2px;
      border: none;
      border-radius: var(--chip-r);
      background: transparent;
      box-sizing: border-box;
      padding: 0;
      margin: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 0;
      overflow: visible;
      flex-shrink: 0;
      box-shadow: none;
      outline: none;
      color: var(--ink);
    }
    .prog-actions .icon-btn svg {
      display: block;
      flex-shrink: 0;
      margin: 0;
      overflow: visible;
      pointer-events: none;
    }
    .prog-actions .icon-btn:hover {
      background: var(--ink-08);
      border: none;
      box-shadow: none;
    }
    .prog-actions .icon-btn:disabled { opacity: 0.4; }
    .prog-clear {
      width: 19.8px;
      height: 19.8px;
      border: none;
      border-radius: 4.4px;
      background: transparent;
      color: var(--ink-50);
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
    }
    .prog-field.is-focus .prog-clear { display: inline-flex; }
    .prog-clear:hover { color: var(--ink); background: var(--ink-08); }
    .prog-clear svg { display: block; pointer-events: none; }

    .status-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--status-none);
      box-shadow: 0 0 0 2.2px rgba(255,255,255,0.45);
      transition: background var(--dur) var(--ease);
    }
    .status-dot[data-state="ready"] { background: var(--status-ready); }
    .status-dot[data-state="posted"] { background: var(--status-posted); }

    .icon-btn {
      width: 28.6px;
      height: 28.6px;
      min-width: 28.6px;
      min-height: 28.6px;
      border: 1.1px solid rgba(26, 20, 40, 0.22);
      border-radius: var(--chip-r);
      background: var(--white-70);
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      margin: 0;
      flex-shrink: 0;
      box-sizing: border-box;
      line-height: 0;
      overflow: visible;
    }
    .icon-btn:hover:not(:disabled):not(.is-editing) { background: var(--white); border-color: rgba(26, 20, 40, 0.35); }
    .icon-btn:active:not(:disabled):not(.is-editing) { transform: scale(0.94); }
    .icon-btn:disabled {
      opacity: 0.4;
      cursor: default;
      transform: none !important;
      pointer-events: none;
    }
    .icon-btn svg {
      display: block;
      flex-shrink: 0;
      margin: 0;
      overflow: visible;
      pointer-events: none;
    }
    .icon-btn.is-on {
      background: var(--blue-dark);
      border-color: var(--blue-dark);
      color: var(--white);
    }
    .icon-btn.is-editing {
      background: rgba(26, 20, 40, 0.10);
      border-color: rgba(26, 20, 40, 0.14);
      color: var(--ink-30);
      cursor: default;
      transform: none !important;
      pointer-events: none;
    }
    .gcode-bar .icon-btn.close {
      background: transparent;
      border: 1.1px solid rgba(255, 255, 255, 0.22);
      color: #ffffff;
    }
    .gcode-bar .icon-btn.close:hover,
    .gcode-bar .icon-btn.close:hover:not(:disabled):not(.is-editing) {
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.35);
      background: rgba(255, 255, 255, 0.12);
    }

    /* Surface row */
    .surface-row {
      display: flex;
      align-items: center;
      gap: 4.4px;
      padding: 8.8px 11px;
      flex-shrink: 0;
      border-bottom: 1.1px solid transparent;
      min-width: 0;
      overflow: hidden;
      position: relative;
    }
    .surface-editing-banner { display: none !important; }
    .surface-row.is-editing-banner {
      background: transparent;
      border-bottom-color: var(--ink-15);
    }
    .surface-row.is-editing-banner > *:not(.surface-editing-banner) {
      opacity: 0.7;
      filter: grayscale(1);
      pointer-events: none;
    }
    .gcode.is-expanded .surface-row {
      border-bottom: 1.1px solid var(--ink-15);
      padding-bottom: 8.8px;
    }
    .surface-spacer { flex: 1 1 auto; min-width: 4.4px; }

    .btn-gc0de {
      height: 28.6px;
      padding: 0 11px;
      border: none;
      border-radius: var(--chip-r);
      background: var(--blue-22);
      color: var(--ink);
      font-size: 12.1px;
      font-weight: 700;
      letter-spacing: 0.04em;
      font-family: var(--font-mono);
      cursor: pointer;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0.5px 1px rgba(0, 0, 0, 0.25);
    }
    .btn-gc0de:hover { background: var(--blue-28); }
    .btn-gc0de:active { transform: scale(0.98); }
    .gcode.is-expanded .btn-gc0de { display: none; }

    .gcode .part-group {
      display: inline-flex;
      align-items: stretch;
      gap: 4.4px;
      height: 28.6px;
      flex-shrink: 0;
      min-width: 0;
      width: auto;
      border: none;
      background: transparent;
      overflow: visible;
    }
    .gcode .part-group.is-connected {
      gap: 0;
      border-radius: var(--chip-r);
      border: 1.1px solid rgba(26, 20, 40, 0.22);
      background: var(--white-70);
      overflow: hidden;
      box-shadow: none;
    }

    .btn-detect {
      height: 28.6px;
      padding: 0 11px;
      border: 1.1px solid rgba(26, 20, 40, 0.22);
      border-radius: var(--chip-r);
      background: var(--white-70);
      color: var(--ink);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      cursor: pointer;
      flex-shrink: 0;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      box-shadow: 0 0.5px 1px rgba(0, 0, 0, 0.25);
      transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
    }
    .btn-detect:hover:not(:disabled) { background: var(--white); }
    .btn-detect .icon-hat { display: none; }
    .btn-detect .label-detect { display: inline; }
    .gcode.is-expanded .btn-detect { width: 28.6px; padding: 0; }
    .gcode.is-expanded .btn-detect .label-detect { display: none; }
    .gcode.is-expanded .btn-detect .icon-hat { display: block; }
    .btn-detect:disabled {
      opacity: 0.4;
      cursor: default;
      color: var(--ink);
      box-shadow: none;
    }
    .btn-detect.is-armed:not(:disabled) {
      background: var(--white-40);
      border: 1.65px solid var(--blue-border);
      color: var(--ink);
      box-shadow: var(--blue-glow);
    }
    .btn-detect.is-armed:not(:disabled):hover { background: var(--white-55); }
    .gcode .part-group.is-connected .btn-detect {
      border: none;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      height: 100%;
      opacity: 1;
    }
    .gcode .part-group.is-connected .btn-detect:disabled {
      opacity: 0.4;
      background: transparent;
    }
    .gcode .part-group.is-connected .btn-detect.is-armed:not(:disabled) {
      background: var(--blue-22);
      border: none;
      box-shadow: none;
      color: var(--ink);
      opacity: 1;
    }
    .gcode .part-group.is-connected .btn-detect:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.55);
    }
    .gcode .part-group.is-connected .btn-detect.is-armed:not(:disabled):hover {
      background: var(--blue-28);
    }

    .part-ticker {
      flex: 0 1 auto;
      width: max-content;
      max-width: min(184.8px, 100%);
      min-width: 0;
      height: 28.6px;
      display: inline-flex;
      align-items: center;
      padding: 0 8.8px;
      border-radius: var(--chip-r);
      background: var(--white-40);
      border: 1.1px solid rgba(26, 20, 40, 0.16);
      box-sizing: border-box;
      transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
    }
    .part-ticker[data-state="ready"] {
      background: var(--chip-gray);
      border: 1.65px solid var(--blue-border);
      box-shadow: var(--blue-glow);
    }
    .part-ticker[data-state="posted"] {
      background: #7DDB8C;
      border: 1.1px solid rgba(26, 20, 40, 0.28);
      box-shadow: var(--green-glow);
    }
    .part-ticker.is-stale[data-state="ready"],
    .part-ticker.is-stale[data-state="posted"] {
      background: var(--chip-gray);
      box-shadow: none;
    }
    .part-ticker.is-stale[data-state="ready"] {
      border: 1.65px solid var(--blue-border);
    }
    .part-ticker.is-stale[data-state="posted"] {
      border: 1.1px solid rgba(26, 20, 40, 0.28);
    }
    .gcode .part-group.is-connected .part-ticker {
      border: none;
      border-radius: 0;
      background: var(--chip-gray);
      box-shadow: none;
      height: 100%;
      max-width: 198px;
    }
    .gcode .part-group.is-connected .part-ticker[data-state="ready"]:not(.is-stale) {
      background: var(--chip-gray);
      box-shadow: inset 0 0 0 1.65px var(--blue-border);
    }
    .gcode .part-group.is-connected .part-ticker[data-state="posted"]:not(.is-stale) {
      background: #7DDB8C;
      box-shadow: inset 0 0 0 2.4px rgba(0, 160, 30, 0.90);
    }
    .gcode .part-group.is-connected .part-ticker.is-stale {
      background: var(--chip-gray);
      box-shadow: none;
    }
    .part-ticker .readout {
      flex: 1 1 auto;
      min-width: 0;
      font-family: var(--font-mono);
      font-size: 12.1px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      color: var(--ink);

    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    if (!text) return '';
    return text.split('\n').map(function (line) {
      var out = '';
      var i = 0;
      while (i < line.length) {
        if (line[i] === '(') {
          var end = line.indexOf(')', i);
          if (end === -1) end = line.length - 1;
          out += '<span class="tok-c">' + escapeHtml(line.slice(i, end + 1)) + '</span>';
          i = end + 1;
          continue;
        }
        if (line[i] === ';') {
          out += '<span class="tok-c">' + escapeHtml(line.slice(i)) + '</span>';
          break;
        }
        var m = line.slice(i).match(/^([A-Za-z])([-+]?\d*\.?\d*)/);

          var letter = m[1].toUpperCase();
          var word = m[0];
          var cls = '';
          if (letter === 'G') cls = 'tok-g';
          else if (letter === 'M') cls = 'tok-m';
          else if (letter === 'F' || letter === 'S') cls = 'tok-fs';
          else if (letter === 'T') cls = 'tok-t';
          else if (letter === 'N') cls = 'tok-n';
          if (cls) out += '<span class="' + cls + '">' + escapeHtml(word) + '</span>';
          else out += escapeHtml(word);
          i += word.length;
          continue;
        }
        out += escapeHtml(line[i]);
        i += 1;
      }
      return out;
    }).join('\n');

    var stack = [el.value];
    var idx = 0;
    var quiet = false;
    el.addEventListener('input', function () {
      if (quiet) return;
      stack.length = idx + 1;

      if (stack.length > limit) stack.shift();
      idx = stack.length - 1;

      undo: function () {
        if (idx <= 0) return;
        quiet = true; idx -= 1; el.value = stack[idx];
        el.dispatchEvent(new Event('input', { bubbles: true })); quiet = false;
      },
      redo: function () {
        if (idx >= stack.length - 1) return;

      sx = e.clientX; sy = e.clientY;

        function end() {
          handle.removeEventListener('pointermove', move);
          handle.removeEventListener('pointerup', end);
          handle.removeEventListener('pointercancel', end);
          try { handle.releasePointerCapture(pid); } catch (_) {}
        }
        handle.addEventListener('pointermove', move);
        handle.addEventListener('pointerup', end);
        handle.addEventListener('pointercancel', end);
      });
    });
  })();

  unitSwitch.querySelectorAll('button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      unit = btn.getAttribute('data-unit');
      unitSwitch.setAttribute('data-unit', unit);
      unitSwitch.querySelectorAll('button').forEach(function (b) {
        var on = b === btn;
        b.classList.toggle('is-on', on);
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
    });
  });

  document.querySelectorAll('[data-rot]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      rot = parseInt(btn.getAttribute('data-rot'), 10);
      document.querySelectorAll('[data-rot]').forEach(function (b) {
        b.classList.toggle('is-on', b === btn);
      });
      if (processDone) {
        processDone = false;
        syncProcessState();
        showToast('Source changed — flip again');
      }
    });
  });

  function setTab(key) {
    ioTabs.querySelectorAll('.io-tab').forEach(function (t) {
      var on = t.getAttribute('data-tab') === key;
      t.classList.toggle('is-on', on);
      t.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    document.querySelectorAll('.io-panel').forEach(function (p) {
      var on = p.getAttribute('data-panel') === key;
      p.classList.toggle('is-on', on);
      if (on) p.removeAttribute('hidden'); else p.setAttribute('hidden', '');
    });
    panel.classList.toggle('is-source-tab', key === 'source');
  }
  ioTabs.querySelectorAll('.io-tab').forEach(function (tab) {
    tab.addEventListener('click', function () {
      setTab(tab.getAttribute('data-tab'));
    });
  });
  panel.classList.add('is-source-tab');

  var surfaceRow = document.getElementById('surface-row');
  function syncEditingBanner() {
    if (!surfaceRow) return;
    surfaceRow.classList.toggle('is-editing-banner', !!(srcEdit || outEdit));
  }
  function enterSrcEdit() {
    srcEdit = true;
    srcSnapshot = source.value;
    sourceShell.classList.remove('is-hl');
    sourceShell.classList.add('is-editing');
    source.focus();
    syncEditingBanner();
    syncProcessState();
  }
  function exitSrcEdit(commit) {
    if (commit) {
      histSrc.push(source.value);
    } else {
      source.value = srcSnapshot;
      histSrc.push(srcSnapshot);
    }
    srcEdit = false;
    sourceShell.classList.remove('is-editing');
    renderSourceHl();
    sourceShell.classList.add('is-hl');
    source.blur();
    syncEditingBanner();
    syncProcessState();
  }
  source.addEventListener('focus', function () {
    if (!sourceShell.classList.contains('is-editing')) enterSrcEdit();
  });
  sourceHl.addEventListener('click', function () { enterSrcEdit(); });
  source.addEventListener('input', function () {
    renderSourceHl();
    if (processDone) {
      processDone = false;
      showToast('Source changed — flip again');
    }
    if (sizedClean || bounds) {
      sizedClean = false;
      if (bounds) partTicker.classList.add('is-stale');
    }
    syncDetectArm();
    syncPartGroup();
    syncSourceChrome();
    syncProcessState();
  });
  document.getElementById('btn-accept-src').addEventListener('click', function (e) {
    e.stopPropagation();
    exitSrcEdit(true);
  });
  document.getElementById('btn-cancel-src').addEventListener('click', function (e) {
    e.stopPropagation();
    exitSrcEdit(false);
  });

  function setOutEdit(on) {
    outEdit = on;
    btnEditOut.classList.toggle('is-on', on);
    btnEditOut.classList.toggle('is-editing', on);
    if (on) {
      outSnapshot = output.value;
      outputShell.classList.remove('is-hl');
      outputShell.classList.add('is-editing');
      output.readOnly = false;
      output.focus();
    } else {
      outputShell.classList.remove('is-editing');
      renderOutputHl();
      outputShell.classList.add('is-hl');
      output.readOnly = true;
    }
    syncEditingBanner();
    syncProcessState();
  }
  btnEditOut.addEventListener('click', function () {
    if (!outEdit && hasOutput()) setOutEdit(true);
  });
  document.getElementById('btn-accept-out').addEventListener('click', function (e) {
    e.stopPropagation();
    var changed = output.value !== outSnapshot;
    histOut.push(output.value);
    renderOutputHl();
    setOutEdit(false);
    setOutEnabled(output.value.trim().length > 0);
    if (changed) {
      showToast('Output updated');
      if (hasOutput()) {
        processDone = true;
        syncProcessState();
      }
    }
  });
  document.getElementById('btn-cancel-out').addEventListener('click', function (e) {
    e.stopPropagation();
    output.value = outSnapshot;
    renderOutputHl();
    setOutEdit(false);
  });
  output.addEventListener('input', function () {
    if (outEdit) renderOutputHl();
  });

  function setOutEnabled(on) {
    btnCopy.disabled = !on;
    btnDl.disabled = !on;
    btnSave.disabled = !on;
    btnEditOut.disabled = !on;
  }

  stageAction.addEventListener('click', function () {
    if (srcEdit || outEdit) return;
    var state = stageAction.getAttribute('data-state');
    if (state === 'start') {
      histOut.reset('');
      renderOutputHl();
      setOutEnabled(false);
      processDone = false;
      syncProcessState();
      setTab('source');
      showToast('Output cleared');
      return;
    }
    if (state === 'process') {
      if (!hasSource()) return;
      detectPart();
      var header = '; ' + (progName.value.trim() || 'untitled') +
        ' · rotation ' + rot + '° · ' + unit + '\n';
      if (rot !== 0) header += '; (demo) rotation transform applied\n';
      histOut.push(header + source.value.trim());
      renderOutputHl();
      setOutEnabled(true);
      processDone = true;
      syncProcessState();
      setOutEdit(false);
      setTab('output');
      showToast('Output ready');
      flashGreenRing();
    }
  });

  document.getElementById('btn-undo-src').addEventListener('click', function () { histSrc.undo(); });
  document.getElementById('btn-redo-src').addEventListener('click', function () { histSrc.redo(); });
  document.getElementById('btn-undo-out').addEventListener('click', function () {
    histOut.undo(); renderOutputHl(); setOutEnabled(output.value.trim().length > 0);
  });
  document.getElementById('btn-redo-out').addEventListener('click', function () {
    histOut.redo(); renderOutputHl(); setOutEnabled(output.value.trim().length > 0);
  });

  document.getElementById('btn-clear').addEventListener('click', function () {
    histSrc.reset('');
    clearBounds();
    histOut.reset('');
    renderSourceHl();
    renderOutputHl();
    setOutEnabled(false);
    setOutEdit(false);
    exitSrcEdit(false);
    processDone = false;
    syncSourceChrome();
  });

  btnDetect.addEventListener('click', function () {
    if (detectPart()) showToast('Part sized');
    syncDetectArm();
  });

  btnPost.addEventListener('click', function () {
    if (!bounds || btnPost.disabled) return;
    posted = true;
    setStatus('posted');
    syncPartGroup();
    showToast('Part posted');
    flashGreenRing();
  });

  function downloadOut() {
    if (!output.value.trim()) return;
    var name = (progName.value.trim() || 'program').replace(/[^\w.\-]+/g, '_');
    var blob = new Blob([output.value], { type: 'text/plain' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name + '.nc';
    a.click();
    URL.revokeObjectURL(a.href);
  }
  btnCopy.addEventListener('click', function () {
    if (!btnCopy.disabled && navigator.clipboard) navigator.clipboard.writeText(output.value);
  });
  btnDl.addEventListener('click', downloadOut);
  btnSave.addEventListener('click', downloadOut);

  document.getElementById('btn-open').addEventListener('click', loadSampleProgram);

  /* toolPath buttons are no-ops in standalone */
  ['btn-toolpath-src', 'btn-toolpath-out'].forEach(function (id) {
    var b = document.getElementById(id);
    if (b) b.addEventListener('click', function (e) {
      e.stopPropagation();
      showToast('toolPath not in this extract');
    });
  });

  setExpanded(true);
  setStatus('none');
  setOutEnabled(false);
  syncSourceChrome();
  syncPartGroup();
})();
  </script>
</body>
</html>
