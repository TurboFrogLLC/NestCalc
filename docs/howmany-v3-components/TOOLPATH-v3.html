<!DOCTYPE html>
<!--
═══════════════════════════════════════════════════════════════════════════════
TOOLPATH-v3 — Individual component lock
Extracted from composition tip fb011e6b230b5f7b4d28751554257782cf9c1b51
(last completed state BEFORE R29 LaserBed surface)

Authority: pre-LaserBed toolPath card (R16 + R27)
  · dark 44px header · 15.4px radius
  · Lucide waypoints mark · tool white + Path amber wordmark
  · tp-head-btn refresh + X (white@0.22 idle · white@0.12 hover)
  · frost shell · outer ring · white viewfinder 200px
  · demo part fixture (blue-22 rect + two holes)
  · non-modal · no resize · z-index 20 family

NO bed · NO Numeric HUD · NO FLiPIT panel · NO isolator · NO child-spec
Standalone opens visible so chrome is immediately inspectable.
(Composition R27 keeps it .is-hidden until FLiPIT strip / isolator.)
═══════════════════════════════════════════════════════════════════════════════
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>HowMany V3 — toolPath (standalone · pre-LaserBed)</title>
  <style>
    :root {
      --font: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --frost: #D8D6E2;
      --frost-blue: #E8EEF8;
      --ink: #1A1428;
      --ink-50: rgba(26, 20, 40, 0.50);
      --ink-30: rgba(26, 20, 40, 0.30);
      --ink-22: rgba(26, 20, 40, 0.22);
      --ink-15: rgba(26, 20, 40, 0.15);
      --ink-08: rgba(26, 20, 40, 0.08);
      --white: #ffffff;
      --white-70: rgba(255, 255, 255, 0.70);
      --white-55: rgba(255, 255, 255, 0.55);
      --white-40: rgba(255, 255, 255, 0.40);
      --blue: #538BEC;
      --blue-22: rgba(83, 139, 236, 0.22);
      --blue-28: rgba(83, 139, 236, 0.28);
      --radius: 15.4px;
      --chip-r: 6.6px;
      --chip-h: 28.6px;
      --icon-btn: 28.6px;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: var(--font);
      color: var(--ink);
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      background: #F4F4F6;
    }
    body {
      background:
        linear-gradient(rgba(0,0,0,0.04) 1.1px, transparent 1.1px),
        linear-gradient(90deg, rgba(0,0,0,0.04) 1.1px, transparent 1.1px),
        #F4F4F6;
      background-size: 26.4px 26.4px, 26.4px 26.4px, auto;
    }
    .stage-note {
      position: fixed; left: 16px; bottom: 16px;
      font-size: 11px; font-weight: 600; color: rgba(26,20,40,0.40);
      background: rgba(216,214,226,0.72); border: 1.1px solid rgba(26,20,40,0.10);
      border-radius: 8.8px; padding: 6.6px 13.2px; pointer-events: none;
      z-index: 5; max-width: 420px; line-height: 1.4;
    }

    /* ── toolPath card (R16b) ── */
    .toolpath {
      position: absolute;
      left: 52.8px;
      top: 80px;
      width: max-content;
      min-width: 268px;
      z-index: 20;
      touch-action: none;
      border-radius: var(--radius);
      background: transparent;
    }
    .toolpath.is-hidden {
      display: none !important;
    }
    .toolpath-inner {
      width: 100%;
      min-width: 268px;
      background: var(--frost);
      border-radius: var(--radius);
      box-shadow:
        0 0 0 1.1px rgba(255, 255, 255, 0.55),
        0 0 0 1.1px rgba(83, 139, 236, 0.22);
      display: flex;
      flex-direction: column;
      overflow: visible;
      position: relative;
    }
    .toolpath-inner::after {
      content: "";
      position: absolute;
      top: -8px; right: -8px; bottom: -8px; left: -8px;
      border: 2px solid rgba(26, 20, 40, 0.22);
      border-radius: calc(var(--radius) + 8px);
      box-shadow: 0 18px 40px -12px rgba(0, 0, 0, 0.38);
      pointer-events: none;
      z-index: -1;
    }
    .toolpath-head {
      flex: 0 0 44px;
      height: 44px;
      display: flex;
      align-items: center;
      gap: 6.6px;
      padding: 0 7.7px;
      box-sizing: border-box;
      border-bottom: 1.1px solid rgba(255, 255, 255, 0.10);
      border-radius: var(--radius) var(--radius) 0 0;
      background: rgba(26, 20, 40, 0.82);
      cursor: grab;
      touch-action: none;
      position: relative;
      z-index: 1;
    }
    .toolpath.is-dragging .toolpath-head { cursor: grabbing; }
    .toolpath-head .mark {
      width: 28.6px;
      height: 28.6px;
      border-radius: var(--chip-r);
      background: rgba(255, 255, 255, 0.12);
      border: 1.1px solid rgba(255, 255, 255, 0.18);
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .toolpath-head .mark svg { display: block; pointer-events: none; }
    .toolpath-head .wordmark-slot {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding-left: 10px;
    }
    .toolpath-head .wordmark {
      font-family: var(--font);
      font-size: 19.8px;
      font-weight: 700;
      letter-spacing: -0.02em;
      white-space: nowrap;
      user-select: none;
      line-height: 1;
    }
    .toolpath-head .wordmark .label-tool {
      color: #ffffff;
      text-transform: none;
    }
    .toolpath-head .wordmark .label-path {
      color: #FFCE1B;
      font-weight: 800;
      text-transform: none;
    }
    .toolpath-head .tp-head-btn {
      width: 28.6px;
      height: 28.6px;
      min-width: 28.6px;
      min-height: 28.6px;
      margin: 0;
      padding: 0;
      border: 1.1px solid rgba(255, 255, 255, 0.22);
      border-radius: var(--chip-r);
      background: transparent;
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      box-sizing: border-box;
      line-height: 0;
      overflow: visible;
      transition: background 0.12s, border-color 0.12s, color 0.12s;
    }
    .toolpath-head .tp-head-btn:hover {
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.35);
      background: rgba(255, 255, 255, 0.12);
    }
    .toolpath-head .tp-head-btn:active {
      transform: scale(0.94);
    }
    .toolpath-head .tp-head-btn svg {
      display: block;
      flex-shrink: 0;
      margin: 0;
      overflow: visible;
      pointer-events: none;
    }
    .toolpath-body {
      padding: 11px;
      box-sizing: border-box;
      background: var(--frost);
      border-radius: 0 0 var(--radius) var(--radius);
    }
    .toolpath-canvas {
      position: relative;
      width: 100%;
      height: 200px;
      min-height: 160px;
      border: 1.1px solid rgba(26, 20, 40, 0.16);
      border-radius: 8.8px;
      overflow: hidden;
      background: #ffffff;
      box-sizing: border-box;
    }
    .toolpath-canvas .part {
      position: absolute;
      left: 18%;
      top: 28%;
      width: 64%;
      height: 44%;
      border: 1.5px solid var(--ink);
      background: var(--blue-22);
      border-radius: 2px;
    }
    .toolpath-canvas .hole {
      position: absolute;
      width: 18px;
      height: 18px;
      border: 1.5px solid var(--ink);
      border-radius: 50%;
      background: var(--white);
    }
    .toolpath-canvas .hole.a { left: 28%; top: 38%; }
    .toolpath-canvas .hole.b { left: 58%; top: 48%; }
    .toolpath-empty {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: var(--ink-30);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      pointer-events: none;
    }
    .toolpath-canvas.has-part .toolpath-empty { display: none; }

    /* Standalone re-open control (composition uses FLiPIT strip / isolator) */
    .stage-reopen {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 6;
      height: 28.6px;
      padding: 0 12px;
      border: 1.1px solid rgba(26, 20, 40, 0.18);
      border-radius: var(--chip-r);
      background: rgba(216, 214, 226, 0.92);
      color: var(--ink);
      font-family: var(--font);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.03em;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 6px;
    }
    .stage-reopen.is-on { display: inline-flex; }
    .stage-reopen:hover { background: #fff; border-color: rgba(26, 20, 40, 0.30); }
    .stage-reopen:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <div class="stage-note">toolPath · standalone · authority fb011e6b (pre-LaserBed) · X hides · Re-open restores · no FLiPIT bridge</div>
  <button type="button" class="stage-reopen" id="btn-reopen" title="Show toolPath again">Show toolPath</button>

  <div class="toolpath" id="backplot" aria-label="toolPath">
    <div class="toolpath-inner">
      <div class="toolpath-head" id="bp-drag" title="Drag toolPath">
        <div class="mark" aria-hidden="true">
          <svg width="17.6" height="17.6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="4.5" r="2.5"/>
            <path d="m10.2 6.3-3.9 3.9"/>
            <circle cx="4.5" cy="12" r="2.5"/>
            <path d="M7 12h10"/>
            <circle cx="19.5" cy="12" r="2.5"/>
            <path d="m13.8 17.7 3.9-3.9"/>
            <circle cx="12" cy="19.5" r="2.5"/>
          </svg>
        </div>
        <div class="wordmark-slot">
          <span class="wordmark"><span class="label-tool">tool</span><span class="label-path">Path</span></span>
        </div>
        <button type="button" class="tp-head-btn" id="btn-tp-refresh" title="Refresh path view" aria-label="Refresh path view">
          <svg width="15.4" height="15.4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
            <path d="M16 16h5v5"/>
          </svg>
        </button>
        <button type="button" class="tp-head-btn" id="btn-tp-close" title="Close toolPath" aria-label="Close toolPath">
          <svg width="15.4" height="15.4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
          </svg>
        </button>
      </div>
      <div class="toolpath-body">
        <div class="toolpath-canvas" id="bp-canvas">
          <div class="toolpath-empty" id="tp-empty">No path</div>
          <div class="part" id="tp-part"></div>
          <div class="hole a" id="tp-hole-a"></div>
          <div class="hole b" id="tp-hole-b"></div>
        </div>
      </div>
    </div>
  </div>

<script>
/* toolPath standalone — extracted from fb011e6b (pre-LaserBed · R16 + R27 chrome) */
(function () {
  var card = document.getElementById('backplot');
  var canvas = document.getElementById('bp-canvas');
  var dragBar = document.getElementById('bp-drag');
  var btnClose = document.getElementById('btn-tp-close');
  var btnRefresh = document.getElementById('btn-tp-refresh');
  var emptyEl = document.getElementById('tp-empty');
  var btnReopen = document.getElementById('btn-reopen');
  if (!card || !canvas || !dragBar) return;

  /* Drag header — buttons still clickable */
  (function () {
    var dragging = false, sx, sy, ol, ot, pid = null;
    dragBar.addEventListener('pointerdown', function (e) {
      if (e.button != null && e.button !== 0) return;
      if (e.target.closest && e.target.closest('button')) return;
      dragging = true;
      card.classList.add('is-dragging');
      sx = e.clientX; sy = e.clientY;
      var r = card.getBoundingClientRect();
      ol = r.left; ot = r.top;
      card.style.left = ol + 'px';
      card.style.top = ot + 'px';
      pid = e.pointerId;
      try { dragBar.setPointerCapture(e.pointerId); } catch (_) {}
      e.preventDefault();
    });
    dragBar.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      card.style.left = Math.min(window.innerWidth - 40, Math.max(-card.offsetWidth + 40, ol + e.clientX - sx)) + 'px';
      card.style.top = Math.min(window.innerHeight - 40, Math.max(0, ot + e.clientY - sy)) + 'px';
    });
    function end() {
      if (!dragging) return;
      dragging = false;
      card.classList.remove('is-dragging');
      try { if (pid != null) dragBar.releasePointerCapture(pid); } catch (_) {}
      pid = null;
    }
    dragBar.addEventListener('pointerup', end);
    dragBar.addEventListener('pointercancel', end);
  })();

  /* Demo fixture — sandbox only until real path data exists */
  var hasPart = true;
  function paint() {
    canvas.classList.toggle('has-part', hasPart);
    canvas.querySelectorAll('.part, .hole').forEach(function (el) {
      el.hidden = !hasPart;
    });
    if (emptyEl) emptyEl.textContent = hasPart ? '' : 'No path';
  }
  paint();

  function setToolpathOpen(on) {
    if (on) {
      card.classList.remove('is-hidden');
      card.style.display = '';
      if (btnReopen) btnReopen.classList.remove('is-on');
    } else {
      card.classList.add('is-hidden');
      if (btnReopen) btnReopen.classList.add('is-on');
    }
  }

  if (btnClose) {
    btnClose.addEventListener('click', function (e) {
      e.stopPropagation();
      setToolpathOpen(false);
    });
  }
  if (btnReopen) {
    btnReopen.addEventListener('click', function () {
      setToolpathOpen(true);
    });
  }
  if (btnRefresh) {
    btnRefresh.addEventListener('click', function (e) {
      e.stopPropagation();
      hasPart = true;
      paint();
    });
  }

  /* Standalone boots open (composition R27 keeps hidden until strip/isolator) */
  setToolpathOpen(true);
})();
</script>
</body>
</html>
