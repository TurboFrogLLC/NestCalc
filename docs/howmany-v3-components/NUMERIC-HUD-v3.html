<script>
/* NUMERIC-HUD standalone — extracted from fb011e6b (pre-LaserBed advanced chrome) */
(function () {
  const hud = document.getElementById('hud');
  const calcToggle = document.getElementById('calc-toggle');
  const btnChevron = document.getElementById('btn-chevron');
  const classicLcd = document.getElementById('classic-lcd');
  const classicEl = document.getElementById('classic-calc');
  const hudMode = document.getElementById('hud-mode');
  const hudBody = document.getElementById('hud-body');

  const state = {
    calc: false, collapsed: false, drag: null,
    units: 'in', blankW: 12, blankH: 8,
    partX: 80.342, partY: 40.0, partLinked: false,
    lcd: '0', acc: null, op: null, fresh: true
  };

  const paramState = {
    part: { x: 80.342, y: 40.0, linked: false },
    blank: { x: 12, y: 8, linked: false },
    gap: { x: 0.375, y: 0.125, linked: true },
    margin: { l: 0.25, r: 0.25, t: 0.25, b: 0.25 },
    open: null, snapshot: null
  };

  function fmt3(n) { return (Number.isFinite(n) ? n : 0).toFixed(3); }

  function marginSummaryParts(m) {
    const { l, r, t, b } = m;
    if (l === r && r === t && t === b) return [fmt3(l) + ' all'];
    return ['L ' + fmt3(l), 'R ' + fmt3(r), 'B ' + fmt3(b), 'T ' + fmt3(t)];
  }
  function marginSummaryHTML(m) {
    const parts = marginSummaryParts(m);
    if (parts.length === 1) return parts[0];
    if (parts.length === 2) return parts.join(' + ');
    if (parts.length === 3) return '<span class="m-line">' + parts[0] + ' + ' + parts[1] + '</span><span class="m-line">' + parts[2] + '</span>';
    return '<span class="m-line">' + parts[0] + ' + ' + parts[1] + '</span><span class="m-line">' + parts[2] + ' + ' + parts[3] + '</span>';
  }

  function refreshTickers() {
    const p = paramState.part, b = paramState.blank, g = paramState.gap, m = paramState.margin;
    const tPart = document.querySelector('[data-ticker="part"]');
    const tPartCollapsed = document.querySelector('[data-ticker="part-collapsed"]');
    const tBlank = document.querySelector('[data-ticker="blank"]');
    const tGap = document.querySelector('[data-ticker="gap"]');
    const tMar = document.querySelector('[data-ticker="margin"]');
    const partText = fmt3(p.x) + ' × ' + fmt3(p.y);
    if (tPart) tPart.textContent = partText;
    if (tPartCollapsed) tPartCollapsed.textContent = partText;
    if (tBlank) tBlank.textContent = fmt3(b.x) + ' × ' + fmt3(b.y);
    if (tGap) tGap.textContent = fmt3(g.x) + ' × ' + fmt3(g.y);
    if (tMar) tMar.innerHTML = marginSummaryHTML(m);
    state.partX = p.x; state.partY = p.y; state.partLinked = !!p.linked;
    state.blankW = b.x; state.blankH = b.y;
    updateSaveDirty();
  }

  function applyModeVisibility() {
    hudBody.style.display = '';
    if (state.collapsed) return;
    if (state.calc) { classicEl.style.display = 'flex'; hudMode.style.display = 'none'; }
    else { classicEl.style.display = 'none'; hudMode.style.display = 'flex'; }
  }

  /* Initial placement only — collapse/expand never moves left/top (position hold) */
  (function placeInitial() {
    hud.style.transform = 'none';
    hud.style.right = 'auto';
    hud.style.bottom = 'auto';
    hud.style.left = '16px';
    hud.style.top = '16px';
  })();

  function setCollapsed(on) {
    state.collapsed = on;
    hud.classList.toggle('collapsed', on);
    btnChevron.setAttribute('aria-expanded', on ? 'false' : 'true');
    btnChevron.title = on ? 'Expand' : 'Collapse';
    if (on && state.calc) {
      state.calc = false;
      hud.classList.remove('calc-mode');
      calcToggle.classList.remove('active-calc');
      calcToggle.setAttribute('aria-pressed', 'false');
    }
    if (on) {
      hudBody.style.minHeight = '';
      closeAllParamPopovers();
      /* position hold — leave left/top exactly where they are */
    } else {
      const hudH = parseFloat(hudBody.dataset.hudH || '0');
      const calcH = parseFloat(hudBody.dataset.calcH || '0');
      if (state.calc && calcH) hudBody.style.minHeight = calcH + 'px';
      else if (hudH) hudBody.style.minHeight = hudH + 'px';
      /* position hold — leave left/top exactly where they are */
    }
    applyModeVisibility();
  }

  function setCalc(on) {
    state.calc = on;
    hud.classList.toggle('calc-mode', on);
    calcToggle.classList.toggle('active-calc', on);
    calcToggle.setAttribute('aria-pressed', on ? 'true' : 'false');
    if (on && state.collapsed) setCollapsed(false);
    if (on) closeAllParamPopovers();
    applyModeVisibility();
  }

  btnChevron.addEventListener('click', function () {
    if (state.collapsed) { setCollapsed(false); setCalc(false); }
    else setCollapsed(true);
  });
  calcToggle.addEventListener('click', function () {
    if (state.calc) setCalc(false); else setCalc(true);
  });

  /* Drag */
  const hudHeader = document.getElementById('hud-header');
  function beginHudDrag(e) {
    if (e.button != null && e.button !== 0) return;
    if (e.target.closest && e.target.closest('button')) return;
    const r = hud.getBoundingClientRect();
    state.drag = { ox: e.clientX - r.left, oy: e.clientY - r.top, pid: e.pointerId };
    hud.style.transform = 'none';
    hud.style.left = r.left + 'px';
    hud.style.top = r.top + 'px';
    try { hudHeader.setPointerCapture(e.pointerId); } catch (_) {}
    e.preventDefault();
  }
  function moveHudDrag(e) {
    if (!state.drag) return;
    const x = Math.max(0, Math.min(window.innerWidth - hud.offsetWidth, e.clientX - state.drag.ox));
    const y = Math.max(0, Math.min(window.innerHeight - hud.offsetHeight, e.clientY - state.drag.oy));
    hud.style.left = x + 'px';
    hud.style.top = y + 'px';
    if (paramState.open) positionOutsideHUD();
  }
  function endHudDrag() {
    if (!state.drag) return;
    try { hudHeader.releasePointerCapture(state.drag.pid); } catch (_) {}
    state.drag = null;
  }
  hudHeader.addEventListener('pointerdown', beginHudDrag);
  hudHeader.addEventListener('pointermove', moveHudDrag);
  hudHeader.addEventListener('pointerup', endHudDrag);
  hudHeader.addEventListener('pointercancel', endHudDrag);

  function sanitizeNumericLive(el) {
    const start = el.selectionStart, old = el.value;
    let v = old.replace(/[^0-9.]/g, '');
    const firstDot = v.indexOf('.');
    if (firstDot !== -1) v = v.slice(0, firstDot + 1) + v.slice(firstDot + 1).replace(/\./g, '');
    const parts = v.split('.');
    const intPart = (parts[0] || '').slice(0, 2);
    const frac = parts.length > 1 ? parts[1].slice(0, 3) : null;
    const next = parts.length > 1 ? intPart + '.' + frac : intPart;
    if (next !== old) {
      el.value = next;
      const pos = Math.min(start - (old.length - next.length), next.length);
      try { el.setSelectionRange(Math.max(0, pos), Math.max(0, pos)); } catch (_) {}
    }
  }
  function formatPartDisplay(el, n) {
    if (!Number.isFinite(n)) { el.value = ''; return; }
    el.value = Math.min(99.999, Math.max(0, n)).toFixed(3);
  }

  function wireXyGroup(prefix, stateKey) {
    const ix = document.querySelector('[data-' + prefix + '="x"]');
    const iy = document.querySelector('[data-' + prefix + '="y"]');
    const linkBtn = document.querySelector('[data-' + prefix + '-link]');
    const swapBtn = document.querySelector('[data-' + prefix + '-swap]');
    if (!ix || !iy) return;
    function syncLinked(from) {
      const bag = paramState[stateKey];
      if (!bag || !bag.linked) return;
      if (from === 'x') { bag.y = bag.x; iy.value = ix.value; }
      else { bag.x = bag.y; ix.value = iy.value; }
    }
    [ix, iy].forEach(function (inp) {
      const axis = inp.getAttribute('data-' + prefix);
      const wrap = inp.closest('.pop-half');
      inp.addEventListener('input', function () {
        sanitizeNumericLive(inp);
        const raw = inp.value;
        const bag = paramState[stateKey];
        if (raw === '' || raw === '.') {
          bag[axis] = 0;
          if (bag.linked) {
            const other = axis === 'x' ? iy : ix;
            const otherAxis = axis === 'x' ? 'y' : 'x';
            bag[otherAxis] = 0; other.value = '';
          }
          updateSaveDirty(); return;
        }
        const n = parseFloat(raw);
        if (!Number.isFinite(n)) return;
        bag[axis] = n; syncLinked(axis); updateSaveDirty();
      });
      inp.addEventListener('focus', function () { if (wrap) wrap.classList.add('is-focused'); });
      inp.addEventListener('blur', function () {
        if (wrap) setTimeout(function () { wrap.classList.remove('is-focused'); }, 120);
        const raw = inp.value.trim();
        const bag = paramState[stateKey];
        if (raw === '' || raw === '.') {
          bag[axis] = 0; inp.value = '';
          if (bag.linked) {
            const other = axis === 'x' ? iy : ix;
            const otherAxis = axis === 'x' ? 'y' : 'x';
            bag[otherAxis] = 0; other.value = '';
          }
          updateSaveDirty(); return;
        }
        const n = parseFloat(raw);
        if (Number.isFinite(n)) {
          bag[axis] = n; formatPartDisplay(inp, n);
          if (bag.linked) {
            const other = axis === 'x' ? iy : ix;
            const otherAxis = axis === 'x' ? 'y' : 'x';
            bag[otherAxis] = n; formatPartDisplay(other, n);
          }
        }
        updateSaveDirty();
      });
    });
    if (linkBtn) {
      linkBtn.addEventListener('click', function () {
        const bag = paramState[stateKey];
        bag.linked = !bag.linked;
        linkBtn.classList.toggle('active', bag.linked);
        linkBtn.setAttribute('aria-pressed', bag.linked ? 'true' : 'false');
        if (bag.linked) { bag.y = bag.x; iy.value = ix.value || fmt3(bag.x); }
        updateSaveDirty();
      });
    }
    if (swapBtn) {
      swapBtn.addEventListener('click', function () {
        const bag = paramState[stateKey];
        const tx = bag.x; bag.x = bag.y; bag.y = tx;
        formatPartDisplay(ix, bag.x); formatPartDisplay(iy, bag.y);
        updateSaveDirty();
      });
    }
  }
  wireXyGroup('part', 'part');
  wireXyGroup('blank', 'blank');

  function closeAllParamPopovers() {
    paramState.open = null;
    document.querySelectorAll('.param-row').forEach(function (row) {
      row.classList.remove('is-open', 'show-hover');
    });
  }

  document.addEventListener('click', function (e) {
    const closeBtn = e.target.closest('[data-pop-close]');
    if (closeBtn) {
      e.preventDefault(); e.stopPropagation();
      if (paramState.open && paramState.snapshot) {
        const key = paramState.open, s = paramState.snapshot;
        if (key === 'part') {
          paramState.part.x = s.x; paramState.part.y = s.y; paramState.part.linked = s.linked;
          const ix = document.querySelector('[data-part="x"]'), iy = document.querySelector('[data-part="y"]');
          if (ix) ix.value = fmt3(s.x); if (iy) iy.value = fmt3(s.y);
          const pl = document.querySelector('[data-part-link]');
          if (pl) { pl.classList.toggle('active', s.linked); pl.setAttribute('aria-pressed', s.linked ? 'true' : 'false'); }
        } else if (key === 'blank') {
          paramState.blank.x = s.x; paramState.blank.y = s.y; paramState.blank.linked = s.linked;
          const ix = document.querySelector('[data-blank="x"]'), iy = document.querySelector('[data-blank="y"]');
          if (ix) ix.value = fmt3(s.x); if (iy) iy.value = fmt3(s.y);
        } else if (key === 'gap') {
          paramState.gap.x = s.x; paramState.gap.y = s.y; paramState.gap.linked = s.linked;
          const ix = document.querySelector('[data-gap="x"]'), iy = document.querySelector('[data-gap="y"]');
          if (ix) ix.value = fmt3(s.x); if (iy) iy.value = fmt3(s.y);
          const gl = document.querySelector('[data-gap-link]');
          if (gl) { gl.classList.toggle('active', s.linked); gl.setAttribute('aria-pressed', s.linked ? 'true' : 'false'); }
        } else if (key === 'margin') {
          paramState.margin.l = s.l; paramState.margin.r = s.r; paramState.margin.t = s.t; paramState.margin.b = s.b;
          ['l','r','t','b'].forEach(function (k) {
            const el = document.querySelector('[data-m="' + k + '"]');
            if (el) el.value = fmt3(s[k]);
          });
        }
        refreshTickers();
      }
      closeAllParamPopovers();
      return;
    }
    const saveBtn = e.target.closest('[data-pop-save]');
    if (saveBtn) {
      e.preventDefault(); e.stopPropagation();
      if (paramState.open) {
        paramState.snapshot = takeSnapshot(paramState.open);
        refreshTickers();
        closeAllParamPopovers();
      }
    }
  });

  function positionOutsideHUD() {
    const hudRect = hud.getBoundingClientRect();
    const openRow = document.querySelector('.param-row.is-open');
    if (!openRow) return;
    const rowRect = openRow.getBoundingClientRect();
    const pop = openRow.querySelector('.param-popover');
    if (!pop) return;
    const gap = 11, edge = 8, vw = window.innerWidth, vh = window.innerHeight;
    pop.style.position = 'fixed';
    pop.style.right = 'auto'; pop.style.bottom = 'auto';
    const pw = pop.offsetWidth || 286, ph = pop.offsetHeight || 140;
    let left = hudRect.right + gap;
    let top = Math.max(edge, Math.min(rowRect.top, vh - edge - ph));
    if (left + pw > vw - edge) left = Math.max(edge, hudRect.left - gap - pw);
    pop.style.left = Math.round(left) + 'px';
    pop.style.top = Math.round(top) + 'px';
  }

  function takeSnapshot(key) {
    if (key === 'part') return { x: paramState.part.x, y: paramState.part.y, linked: paramState.part.linked };
    if (key === 'blank') return { x: paramState.blank.x, y: paramState.blank.y, linked: paramState.blank.linked };
    if (key === 'gap') return { x: paramState.gap.x, y: paramState.gap.y, linked: paramState.gap.linked };
    if (key === 'margin') return { l: paramState.margin.l, r: paramState.margin.r, t: paramState.margin.t, b: paramState.margin.b };
    return null;
  }
  function isDirty(key) {
    const s = paramState.snapshot;
    if (!s || !key) return false;
    if (key === 'part') return s.x !== paramState.part.x || s.y !== paramState.part.y || s.linked !== paramState.part.linked;
    if (key === 'blank') return s.x !== paramState.blank.x || s.y !== paramState.blank.y || s.linked !== paramState.blank.linked;
    if (key === 'gap') return s.x !== paramState.gap.x || s.y !== paramState.gap.y || s.linked !== paramState.gap.linked;
    if (key === 'margin') return s.l !== paramState.margin.l || s.r !== paramState.margin.r || s.t !== paramState.margin.t || s.b !== paramState.margin.b;
    return false;
  }
  function updateSaveDirty() {
    const key = paramState.open;
    document.querySelectorAll('.pop-save').forEach(function (btn) {
      const row = btn.closest('.param-row');
      const rowKey = row && row.getAttribute('data-param');
      btn.classList.toggle('is-dirty', rowKey === key && isDirty(key));
    });
  }

  function openParamPopover(key) {
    closeAllParamPopovers();
    paramState.open = key;
    if (key === 'part') {
      const ix = document.querySelector('[data-part="x"]'), iy = document.querySelector('[data-part="y"]');
      if (ix) ix.value = fmt3(paramState.part.x); if (iy) iy.value = fmt3(paramState.part.y);
      const pl = document.querySelector('[data-part-link]');
      if (pl) { pl.classList.toggle('active', !!paramState.part.linked); pl.setAttribute('aria-pressed', paramState.part.linked ? 'true' : 'false'); }
    } else if (key === 'blank') {
      const ix = document.querySelector('[data-blank="x"]'), iy = document.querySelector('[data-blank="y"]');
      if (ix) ix.value = fmt3(paramState.blank.x); if (iy) iy.value = fmt3(paramState.blank.y);
    } else if (key === 'gap') {
      const ix = document.querySelector('[data-gap="x"]'), iy = document.querySelector('[data-gap="y"]');
      if (ix) ix.value = fmt3(paramState.gap.x); if (iy) iy.value = fmt3(paramState.gap.y);
    } else if (key === 'margin') {
      ['l','r','t','b'].forEach(function (k) {
        const el = document.querySelector('[data-m="' + k + '"]');
        if (el) el.value = fmt3(paramState.margin[k]);
      });
    }
    paramState.snapshot = takeSnapshot(key);
    const row = document.querySelector('.param-row[data-param="' + key + '"]');
    if (!row) return;
    row.classList.add('is-open');
    updateSaveDirty();
    requestAnimationFrame(function () { positionOutsideHUD(); positionOutsideHUD(); });
  }

  hud.addEventListener('click', function (e) {
    const tick = e.target.closest && e.target.closest('.param-ticker[data-open]');
    if (!tick || !hud.contains(tick)) return;
    if (tick.classList.contains('header-part-ticker')) return;
    e.preventDefault(); e.stopPropagation();
    const key = tick.getAttribute('data-open');
    if (!key) return;
    if (paramState.open === key) closeAllParamPopovers();
    else openParamPopover(key);
  });

  document.addEventListener('pointerdown', function (e) {
    if (!paramState.open) return;
    const openRow = document.querySelector('.param-row.is-open');
    if (!openRow) return;
    const pop = openRow.querySelector('.param-popover');
    const tick = openRow.querySelector('.param-ticker');
    const inPop = pop && pop.contains(e.target);
    const inTick = tick && tick.contains(e.target);
    if (!inPop && !inTick) closeAllParamPopovers();
  });

  /* Gap */
  const gapLink = document.querySelector('[data-gap-link]');
  if (gapLink) {
    gapLink.addEventListener('click', function () {
      paramState.gap.linked = !paramState.gap.linked;
      gapLink.classList.toggle('active', paramState.gap.linked);
      gapLink.setAttribute('aria-pressed', paramState.gap.linked ? 'true' : 'false');
      if (paramState.gap.linked) {
        paramState.gap.y = paramState.gap.x;
        const iy = document.querySelector('[data-gap="y"]');
        if (iy) iy.value = fmt3(paramState.gap.y);
        refreshTickers();
      }
    });
  }
  document.querySelectorAll('[data-gap]').forEach(function (inp) {
    inp.addEventListener('input', function () {
      sanitizeNumericLive(inp);
      const raw = inp.value;
      const n = raw === '' || raw === '.' ? 0 : parseFloat(raw);
      if (!Number.isFinite(n)) return;
      const axis = inp.getAttribute('data-gap');
      if (axis === 'x') {
        paramState.gap.x = n;
        if (paramState.gap.linked) {
          paramState.gap.y = n;
          const iy = document.querySelector('[data-gap="y"]');
          if (iy && iy !== inp) iy.value = raw === '' ? '' : inp.value;
        }
      } else {
        paramState.gap.y = n;
        if (paramState.gap.linked) {
          paramState.gap.x = n;
          const ix = document.querySelector('[data-gap="x"]');
          if (ix && ix !== inp) ix.value = raw === '' ? '' : inp.value;
        }
      }
      refreshTickers(); updateSaveDirty();
    });
    inp.addEventListener('blur', function () {
      const raw = inp.value.trim();
      const axis = inp.getAttribute('data-gap');
      if (raw === '' || raw === '.') {
        if (axis === 'x') paramState.gap.x = 0; else paramState.gap.y = 0;
        inp.value = '';
        refreshTickers(); return;
      }
      const n = parseFloat(raw);
      if (!Number.isFinite(n)) return;
      if (axis === 'x') paramState.gap.x = n; else paramState.gap.y = n;
      inp.value = fmt3(n);
      refreshTickers();
    });
  });

  /* Margin */
  document.querySelectorAll('[data-m]').forEach(function (inp) {
    inp.addEventListener('input', function () {
      sanitizeNumericLive(inp);
      const raw = inp.value;
      const n = raw === '' || raw === '.' ? 0 : parseFloat(raw);
      if (!Number.isFinite(n)) return;
      paramState.margin[inp.getAttribute('data-m')] = n;
      refreshTickers(); updateSaveDirty();
    });
    inp.addEventListener('blur', function () {
      const raw = inp.value.trim();
      if (raw === '' || raw === '.') {
        paramState.margin[inp.getAttribute('data-m')] = 0;
        inp.value = '';
        refreshTickers(); return;
      }
      const n = parseFloat(raw);
      if (!Number.isFinite(n)) return;
      paramState.margin[inp.getAttribute('data-m')] = n;
      inp.value = fmt3(n);
      refreshTickers();
    });
  });

  /* Calculator */
  function setLcd(v) { state.lcd = v; if (classicLcd) classicLcd.textContent = v; }
  function calcInput(k) {
    if (k === 'C' || k === 'bk') {
      if (k === 'bk' && !state.fresh && state.lcd.length > 1) { setLcd(state.lcd.slice(0, -1)); return; }
      state.acc = null; state.op = null; state.fresh = true; setLcd('0'); return;
    }
    if (k === '±') {
      if (state.lcd === '0') return;
      setLcd(state.lcd.startsWith('-') ? state.lcd.slice(1) : '-' + state.lcd); return;
    }
    if (k === '%') { setLcd(String(parseFloat(state.lcd) / 100)); state.fresh = true; return; }
    if (k === '=' || k === 'enter') {
      if (state.op == null || state.acc == null) return;
      const b = parseFloat(state.lcd);
      let r = state.acc;
      if (state.op === '+') r += b;
      if (state.op === '-') r -= b;
      if (state.op === '*') r *= b;
      if (state.op === '/') r = b === 0 ? NaN : r / b;
      setLcd(Number.isFinite(r) ? String(parseFloat(r.toPrecision(10))) : 'Err');
      state.acc = null; state.op = null; state.fresh = true; return;
    }
    if ('+-*/'.includes(k)) { state.acc = parseFloat(state.lcd); state.op = k; state.fresh = true; return; }
    if (state.fresh) { setLcd(k === '.' ? '0.' : k); state.fresh = false; return; }
    if (k === '.' && state.lcd.includes('.')) return;
    if (state.lcd === '0' && k !== '.') setLcd(k); else setLcd(state.lcd + k);
  }
  document.querySelectorAll('.ckey').forEach(function (btn) {
    btn.addEventListener('click', function () { calcInput(btn.dataset.k); });
  });

  document.querySelectorAll('.pop-half, .pop-m-field').forEach(function (wrap) {
    const input = wrap.querySelector('input');
    const clear = wrap.querySelector('.pop-clear');
    if (!input || !clear) return;
    input.addEventListener('focus', function () { wrap.classList.add('is-focused'); });
    input.addEventListener('blur', function () { setTimeout(function () { wrap.classList.remove('is-focused'); }, 120); });
    clear.addEventListener('mousedown', function (e) {
      e.preventDefault();
      input.value = '';
      input.dispatchEvent(new Event('input', { bubbles: true }));
      updateSaveDirty();
      input.focus();
    });
  });

  document.querySelectorAll('.param-popover input[type="text"]').forEach(function (inp) {
    function selectAll() {
      try { inp.select(); var len = (inp.value || '').length; if (len) inp.setSelectionRange(0, len); } catch (_) {}
    }
    inp.addEventListener('focus', function () { setTimeout(selectAll, 0); });
    inp.addEventListener('mouseup', function (e) { e.preventDefault(); selectAll(); });
  });

  function lockBodyHeight() {
    const wasCollapsed = state.collapsed, wasCalc = state.calc;
    hud.classList.remove('collapsed');
    classicEl.style.display = 'flex';
    hudMode.style.display = 'none';
    hudBody.style.display = 'flex';
    hudBody.style.minHeight = '';
    requestAnimationFrame(function () {
      const calcH = classicEl.offsetHeight;
      classicEl.style.display = 'none';
      hudMode.style.display = 'flex';
      const hudH = hudMode.offsetHeight;
      hudBody.style.transition = 'none';
      hudBody.dataset.hudH = String(hudH);
      hudBody.dataset.calcH = String(calcH);
      hudBody.style.minHeight = (wasCalc ? calcH : hudH) + 'px';
      state.calc = wasCalc; state.collapsed = wasCollapsed;
      applyModeVisibility();
    });
  }

  /* Footer chips are no-ops in standalone (FLiPIT is a separate component) */
  document.getElementById('btn-auto-size').addEventListener('click', function () {
    /* no-op — FLiPIT lives in its own component package */
  });
  document.getElementById('btn-gcode').addEventListener('click', function () {
    /* no-op — FLiPIT lives in its own component package */
  });

  setCalc(false);
  refreshTickers();
  lockBodyHeight();
  window.addEventListener('resize', function () {
    if (paramState.open) positionOutsideHUD();
  });
})();
</script>
</body>
</html>
