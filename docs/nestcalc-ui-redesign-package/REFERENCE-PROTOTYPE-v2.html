<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HowMany — Preview-first Prototype</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            ink: {
              950: '#0B0814',
              900: '#120E1C',
              850: '#1A1428',
              800: '#221A32',
              700: '#2A2238',
              600: '#3D3554',
            },
            violet: {
              500: '#8B5CF6',
              400: '#A78BFA',
              300: '#C4B5FD',
              200: '#DDD6FE',
            },
            magenta: {
              500: '#C13CD1',
              400: '#E879F9',
              300: '#F0ABFC',
            },
            hot: {
              500: '#EC4899',
              400: '#F472B6',
            }
          }
        }
      }
    }
  </script>
  <style>
    :root {
      /* Soft ease — slight open bounce; uniform collapse rate (~25% faster) */
      --spring: cubic-bezier(0.25, 1.08, 0.35, 1);
      --smooth: cubic-bezier(0.33, 0.1, 0.25, 1);
      --sheet-ease: cubic-bezier(0.4, 0, 0.2, 1);
      --collapse-dur: 0.41s; /* was 0.55s */
      --sheet-dur: 0.71s;   /* was 0.95s — still slow smooth slide */
      --view-dur: 0.68s;    /* was 0.9s */
      --morph-dur: 0.3s;    /* was 0.4s */
      --bg: #08060D;
      --panel: #0E0C14;
      --surface: #16121F;
      --raised: #1E1A2A;
      --muted: #2A2438;
      --violet: #8B5CF6;
      --violet-bright: #A78BFA;
      --violet-soft: #C8CDD8;
      --magenta: #C13CD1;
      --magenta-bright: #E879F9;
      --hot: #EC4899;
      --text: #F5F3FF;
      --text-muted: #C8CDD8;
    }
    html, body {
      overflow-x: auto;
    }
    body {
      font-family: "SF Pro Text", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    input[type="number"] { -moz-appearance: textfield; }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input:focus {
      outline: none;
      box-shadow: 0 0 0 2px rgba(83, 139, 236, 0.55);
      border-color: rgba(83, 139, 236, 0.65) !important;
    }

    /* High-contrast panel: pink→purple gradient edge + soft light outer */
    .glow {
      position: relative;
      background: var(--panel);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.12),
        0 0 0 1px rgba(83, 139, 236, 0.25),
        0 8px 28px -12px rgba(0, 0, 0, 0.8);
    }
    .glow::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1px;
      /* soft white → blue only — no pink */
      background: linear-gradient(135deg,
        rgba(255, 255, 255, 0.5) 0%,
        rgba(180, 200, 230, 0.45) 35%,
        rgba(83, 139, 236, 0.75) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: 1;
    }
    .glow-soft {
      background: #16121F;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.12),
        0 0 0 1px rgba(83, 139, 236, 0.18),
        0 6px 18px -8px rgba(0, 0, 0, 0.6);
      overflow: hidden;
    }

    /* Horizontal button group */
    .btn-group-h {
      display: flex;
      flex-direction: row;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(83, 139, 236, 0.4);
      background: var(--raised);
      flex-shrink: 0;
      height: 36px;
    }
    .btn-group-h button {
      width: 32px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #C8CDD8;
      background: transparent;
      border: none;
      transition: background 0.15s, color 0.15s;
    }
    .btn-group-h button + button {
      border-left: 1px solid rgba(83, 139, 236, 0.25);
    }
    .btn-group-h button:hover {
      background: rgba(83, 139, 236, 0.32);
      color: #fff;
    }
    .btn-group-h button.active {
      background: #538BEC;
      color: #fff;
    }

    .sheet {
      --calc-sheet-w: 500px;
      --gcode-sheet-w: 620px;
      transition:
        transform var(--sheet-dur) var(--sheet-ease),
        opacity 0.34s var(--smooth),
        left var(--sheet-dur) var(--sheet-ease),
        right var(--sheet-dur) var(--sheet-ease),
        width var(--sheet-dur) var(--sheet-ease);
      will-change: transform, left, right, width;
      left: 0.75rem;
      right: auto;
      width: 500px;
    }
    /* Calculator mode only: hard min 300 / max 500; default max; locked density at 300 */
    .sheet:not(.side-right) {
      width: var(--calc-sheet-w, 500px);
      min-width: 300px;
      max-width: 500px;
      container-type: inline-size;
      container-name: calc-sheet;
    }
    .sheet.is-resizing {
      transition: none;
      user-select: none;
    }
    .stage.is-resizing {
      transition: none !important;
    }
    /* Free-edge resize only — narrow rim hit target; does not cover sheet controls */
    .sheet-resize {
      position: absolute;
      top: 0;
      right: 0;
      left: auto;
      width: 6px;
      height: 100%;
      cursor: col-resize;
      z-index: 50;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      box-sizing: content-box;
      border-right: 4px solid transparent; /* outside-leaning hit area */
      border-left: none;
      background: transparent;
    }
    .sheet-resize::after {
      content: '';
      position: absolute;
      right: 1px;
      left: auto;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 52px;
      border-radius: 3px;
      background: rgba(83, 139, 236, 0.45);
      box-shadow: 0 0 0 1px rgba(83, 139, 236, 0.15);
      transition: height 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
      pointer-events: none;
    }
    /* G-code: free edge is the inner (left) rim */
    .sheet.side-right .sheet-resize {
      right: auto;
      left: 0;
      justify-content: flex-start;
      border-right: none;
      border-left: 4px solid transparent;
    }
    .sheet.side-right .sheet-resize::after {
      right: auto;
      left: 1px;
      background: rgba(238, 140, 60, 0.5);
      box-shadow: 0 0 0 1px rgba(238, 140, 60, 0.18);
    }
    .sheet-resize:hover::after,
    .sheet.is-resizing .sheet-resize::after {
      height: 72px;
      background: rgba(83, 139, 236, 0.95);
      box-shadow: 0 0 8px rgba(83, 139, 236, 0.45);
    }
    .sheet.side-right .sheet-resize:hover::after,
    .sheet.side-right.is-resizing .sheet-resize::after {
      background: rgba(238, 140, 60, 0.95);
      box-shadow: 0 0 8px rgba(238, 140, 60, 0.45);
    }
    /* Hide handle when closed or full-bleed (calc or gcode) */
    .sheet.closed .sheet-resize,
    .sheet.panel-full .sheet-resize {
      display: none;
      pointer-events: none;
    }
    /*
      Interior flex when wider than 300px: expand spacing only.
      At 300cqi clamp floors match main locked density (no tighten).
    */
    .sheet:not(.side-right) .xy-row {
      gap: clamp(8px, calc(8px + (100cqi - 300px) * 0.06), 22px);
    }
    .sheet:not(.side-right) .xy-row .xy-field {
      gap: clamp(6px, calc(6px + (100cqi - 300px) * 0.02), 10px);
    }
    /*
      Adaptive input width: locked 4.1rem at 300cqi; grows equally to ~6.75rem at 500cqi
      so values like 13.125 / 10.125 stay fully visible. Coefficient is px→px (not rem).
    */
    .sheet:not(.side-right) .num-input-wrap {
      width: clamp(4.1rem, calc(4.1rem + (100cqi - 300px) * 0.212), 6.75rem);
    }
    .sheet:not(.side-right) .m-field .num-input-wrap {
      width: 100%;
      max-width: clamp(4.1rem, calc(4.1rem + (100cqi - 300px) * 0.212), 6.75rem);
    }
    .sheet:not(.side-right) .margins-row {
      gap: clamp(6px, calc(6px + (100cqi - 300px) * 0.05), 18px);
      justify-content: space-between;
    }
    .sheet:not(.side-right) #sections-stack {
      padding-left: clamp(12px, calc(12px + (100cqi - 300px) * 0.04), 20px);
      padding-right: clamp(12px, calc(12px + (100cqi - 300px) * 0.04), 20px);
    }
    .sheet:not(.side-right) .xy-row .xy-actions {
      gap: clamp(8px, calc(8px + (100cqi - 300px) * 0.04), 16px);
    }
    .sheet.closed {
      transform: translateX(calc(-100% - 16px));
      opacity: 0;
      pointer-events: none;
    }
    .sheet.side-right {
      left: auto;
      right: 0.75rem;
      width: var(--gcode-sheet-w, 620px);
      min-width: 420px;
      max-width: 620px; /* default = max = 420 + 200 */
      container-type: normal;
    }
    /* Full expand: slow width morph (explicit calc — never width:auto snap) */
    .sheet.side-right.panel-full {
      left: 0.75rem !important;
      right: 0.75rem !important;
      width: calc(100% - 1.5rem) !important;
      min-width: 0;
      max-width: none;
    }
    .gcode-mid-row {
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
      align-items: stretch;
      transition: gap var(--morph-dur) var(--smooth), flex-direction 0.01s;
    }
    .sheet.panel-full .gcode-mid-row {
      flex-direction: row;
      align-items: stretch;
      gap: 0.75rem;
    }
    .gcode-card-body {
      min-height: 5.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
      box-sizing: border-box;
    }
    /* Output code surface: user-resizable height; hard max so it cannot runaway */
    .gcode-output-surface {
      min-height: 72px;
      height: 160px;
      max-height: min(420px, 55vh);
      resize: vertical;
      box-sizing: border-box;
    }
    .gcode-card-body > div:first-child {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 2.25rem;
    }
    .gcode-card-body > button {
      flex-shrink: 0;
      margin-top: auto;
    }
    .sheet.panel-full .gcode-mid-row > section {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      height: 100%;
      transition: flex var(--sheet-dur) var(--sheet-ease), transform var(--sheet-dur) var(--sheet-ease);
    }
    .sheet.panel-full .gcode-mid-row > section .gcode-card-body {
      flex: 1 1 auto;
    }

    .sheet.panel-full .gcode-mid-row > section {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      transition: flex var(--collapse-dur) var(--smooth), transform var(--collapse-dur) var(--smooth);
    }
    .sheet.panel-full .gcode-mid-row > section > .section-header,
    .sheet.panel-full .gcode-mid-row > section > .section-header-gcode {
      flex-shrink: 0;
    }
    .sheet.panel-full .gcode-mid-row > section > div:last-child {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    /* viewer fades via opacity — see unified rule */
    .sheet.side-right.closed {
      transform: translateX(calc(100% + 16px));
    }
    #calc-view, #gcode-view {
      transition: opacity var(--view-dur) var(--sheet-ease), transform var(--view-dur) var(--sheet-ease);
    }
    .stage.viewer-collapsed #calc-view,
    .stage.viewer-collapsed #gcode-view {
      opacity: 0;
      transform: scale(0.96);
      pointer-events: none;
    }
    #viewer-expand {
      display: none;
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 20;
    }
    .stage.viewer-collapsed #viewer-expand {
      display: flex;
    }
    .stage {
      min-width: 320px;
    }
    .sheet.side-right:not(.panel-full) {
      /* keep fixed width; stage padding reserves gap — no bleed */
    }
    .stage {
      transition: padding-left var(--sheet-dur) var(--sheet-ease), padding-right var(--sheet-dur) var(--sheet-ease);
    }

    /* Dark section bodies — uniform open/close rate; slight bounce on open via --spring in JS */
    .section-body {
      transition: max-height var(--collapse-dur) var(--smooth), opacity 0.24s ease;
      overflow: hidden;
    }
    .section-body.is-opening {
      transition: max-height var(--collapse-dur) var(--spring), opacity 0.24s ease;
    }
    .section-body.closed {
      max-height: 0 !important;
      opacity: 0;
    }
    /* Icon buttons: light glass on frosted pad; dark shell override for presets */
    .lift-icon {
      width: 28px;
      height: 28px;
      padding: 0;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(0, 0, 0, 0.14);
      color: #2a2a36;
      cursor: pointer;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.75) inset,
        0 1px 2px rgba(0, 0, 0, 0.12);
      flex-shrink: 0;
    }
    .lift-icon:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.9);
      color: #111;
    }
    .lift-icon:disabled {
      opacity: 0.35;
      cursor: default;
      box-shadow: none;
    }
    .lift-icon--danger {
      color: #8a3030;
      border-color: rgba(180, 60, 60, 0.35);
    }
    .lift-icon--danger:hover:not(:disabled) {
      background: rgba(220, 80, 80, 0.15);
      color: #a02020;
    }
    /* Dark-shell manage icons (presets) */
    .presets-manage .lift-icon {
      background: var(--raised);
      border: 1px solid rgba(83, 139, 236, 0.4);
      color: #C8CDD8;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
    }
    .presets-manage .lift-icon:hover:not(:disabled) {
      color: #fff;
      border-color: rgba(83, 139, 236, 0.7);
      background: rgba(83, 139, 236, 0.18);
    }
    .presets-manage .lift-icon--danger {
      border-color: rgba(236, 90, 90, 0.45);
      color: #E8B4B4;
    }
    .presets-manage .lift-icon--danger:hover:not(:disabled) {
      background: rgba(220, 70, 70, 0.18);
      border-color: rgba(236, 90, 90, 0.7);
      color: #ffd0d0;
    }
    .chevron {
      transition: transform 0.34s var(--smooth);
    }
    .chevron.rotated { transform: rotate(180deg); }

    .section-card {
      transition: transform 0.38s var(--smooth);
      border-radius: 8px;
    }
    @keyframes hydrateFlash {
      0% { box-shadow: 0 0 0 0 rgba(83,139,236,0.0); }
      40% { box-shadow: 0 0 0 3px rgba(83,139,236,0.55); }
      100% { box-shadow: 0 0 0 0 rgba(83,139,236,0.0); }
    }
    .hydrate-flash {
      animation: hydrateFlash 0.49s ease;
    }
    .mode-morph {
      transition: opacity var(--morph-dur) var(--smooth), transform 0.38s var(--smooth);
    }
    .mode-morph.out {
      opacity: 0;
      transform: translateY(5px) scale(0.99);
      pointer-events: none;
    }
    .section-card.settle {
      animation: settleBounce 0.41s var(--smooth);
    }
    @keyframes settleBounce {
      0%   { transform: translateY(0); }
      40%  { transform: translateY(1.5px); }
      100% { transform: translateY(0); }
    }

    .press {
      transition: transform 0.18s var(--smooth);
    }
    .press:active { transform: scale(0.97); }

    /* Frosted light-gray glass pad — soft depth (subtle pop, not heavy) */
    .numpad {
      position: fixed;
      z-index: 40;
      touch-action: none;
      transition: opacity 0.17s ease, transform 0.3s var(--spring), width 0.21s var(--smooth);
      user-select: none;
      width: 230px;
      background: rgba(232, 234, 240, 0.82);
      backdrop-filter: blur(22px) saturate(1.25);
      -webkit-backdrop-filter: blur(22px) saturate(1.25);
      /* soft outer edge + thin dark hairline for stage separation */
      border: 1px solid rgba(255, 255, 255, 0.72);
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.14),
        0 2px 4px rgba(0, 0, 0, 0.12),
        0 12px 28px -8px rgba(0, 0, 0, 0.42),
        inset 0 1px 0 rgba(255, 255, 255, 0.78),
        inset 0 -1px 0 rgba(0, 0, 0, 0.04);
      color: #1a1a24;
    }
    .numpad.numpad--calc {
      width: 292px;
    }
    .numpad.hidden-pad {
      opacity: 0;
      pointer-events: none;
      /* keep last translate from drag; only scale/fade when hiding */
      transform: translate(var(--pad-x, 0px), var(--pad-y, 0px)) scale(0.96);
    }
    .numpad:not(.hidden-pad) {
      transform: translate(var(--pad-x, 0px), var(--pad-y, 0px)) scale(1);
    }
    .numpad.is-dragging {
      transition: none;
      cursor: grabbing;
    }
    .numpad-chrome {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      min-height: 28px;
    }
    /* ENTRY: Add + Edit sit centered in the drag strip (above chips) */
    .numpad-chrome .quick-manage {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      flex-shrink: 0;
      pointer-events: auto;
    }
    .numpad.numpad--calc .numpad-chrome .quick-manage {
      display: none;
    }
    .numpad-chrome .quick-manage .lift-icon {
      width: 26px;
      height: 26px;
      background: rgba(255, 255, 255, 0.62);
    }
    .numpad-mode-btn {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(0, 0, 0, 0.1);
      color: #3a3a48;
      cursor: pointer;
    }
    .numpad-mode-btn:hover {
      background: rgba(255, 255, 255, 0.85);
      color: #111;
    }
    .numpad-mode-btn.is-active {
      background: rgba(83, 139, 236, 0.2);
      border-color: rgba(83, 139, 236, 0.55);
      color: #2a5db0;
    }
    .numpad-drag-handle {
      flex: 1 1 auto;
      min-width: 0;
      height: 28px;
      border-radius: 8px;
      cursor: grab;
      touch-action: none;
      background: rgba(255, 255, 255, 0.28);
      border: 1px solid rgba(0, 0, 0, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 0 4px;
    }
    .numpad.is-dragging .numpad-drag-handle {
      cursor: grabbing;
    }
    .numpad-close {
      flex-shrink: 0;
      position: static;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(0, 0, 0, 0.1);
      color: #3a3a48;
      cursor: pointer;
    }
    .numpad-close:hover {
      color: #111;
      background: rgba(255, 255, 255, 0.9);
      border-color: rgba(0, 0, 0, 0.16);
    }
    /* LCD: calculator mode only (math expression) */
    .numpad-lcd {
      display: none;
      align-items: center;
      justify-content: flex-end;
      min-height: 36px;
      margin-bottom: 8px;
      padding: 6px 10px;
      border-radius: 10px;
      background: rgba(18, 16, 28, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #F5F3FF;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.02em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.35);
    }
    .numpad.numpad--calc .numpad-lcd {
      display: flex;
    }
    .numpad-quick {
      display: flex;
      align-items: center;
      gap: 0;
      margin-bottom: 8px;
      width: 100%;
    }
    .numpad.numpad--calc .numpad-quick {
      display: none;
    }
    .quick-carousel {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 1 1 auto;
      width: 100%;
      min-width: 0;
    }
    /* Arrows only when >4 values (JS toggles .is-scrollable) */
    .quick-carousel:not(.is-scrollable) .quick-carousel__btn {
      display: none;
    }
    .quick-carousel__btn {
      flex-shrink: 0;
      width: 22px;
      height: 26px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(0, 0, 0, 0.12);
      color: #2a2a36;
      cursor: pointer;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.8) inset,
        0 1px 1px rgba(0, 0, 0, 0.1);
      padding: 0;
    }
    .quick-carousel__btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.92);
    }
    .quick-carousel__btn:disabled {
      opacity: 0.3;
      cursor: default;
      box-shadow: none;
    }
    .quick-carousel__viewport {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      container-type: inline-size;
      container-name: quick-viewport;
    }
    .quick-carousel__track {
      display: flex;

  <script>
    const sheet = document.getElementById('sheet');
    const sheetOpen = document.getElementById('sheet-open');
    const sheetClose = document.getElementById('sheet-close');
    const stage = document.getElementById('stage');
    const sheetResize = document.getElementById('sheet-resize');

    /*
      TDZ-safe: declare currentMode BEFORE any resize/layout init that reads it.
      typeof currentMode on a later let throws ReferenceError and aborts all handlers.
    */
    let currentMode = 'calc';

    /* Calculator left sheet: hard 300–500px; default = max 500. Stage gap: width + 24 (524 @ 500). */
    const CALC_SHEET_MIN = 300;
    const CALC_SHEET_MAX = 500;
    const CALC_SHEET_EDGE_GAP = 24; /* left-3 (12px) + stage gap (12px) */
    let calcSheetWidth = 500;
    /* G-code right sheet: hard min 420, default = max 620. Padding tracks width + 28. */
    const GCODE_SHEET_MIN = 420;
    const GCODE_SHEET_MAX = 620;
    const GCODE_SHEET_EDGE_GAP = 28; /* right 12 + stage gap ≈ 16 → 648 @ 620 */
    let gcodeSheetWidth = 620;

    function isGcodeMode() {
      return currentMode === 'gcode';
    }

    function calcStagePaddingLeft(open) {
      if (!open) return '16px';
      return (calcSheetWidth + CALC_SHEET_EDGE_GAP) + 'px';
    }

    function gcodeStagePaddingRight(splitOpen) {
      if (!splitOpen) return '16px';
      return (gcodeSheetWidth + GCODE_SHEET_EDGE_GAP) + 'px';
    }

    function syncResizeAria() {
      if (!sheetResize) return;
      if (isGcodeMode()) {
        sheetResize.setAttribute('aria-valuemin', String(GCODE_SHEET_MIN));
        sheetResize.setAttribute('aria-valuemax', String(GCODE_SHEET_MAX));
        sheetResize.setAttribute('aria-valuenow', String(gcodeSheetWidth));
        sheetResize.setAttribute('aria-label', 'Resize G-code panel');
      } else {
        sheetResize.setAttribute('aria-valuemin', String(CALC_SHEET_MIN));
        sheetResize.setAttribute('aria-valuemax', String(CALC_SHEET_MAX));
        sheetResize.setAttribute('aria-valuenow', String(calcSheetWidth));
        sheetResize.setAttribute('aria-label', 'Resize calculator panel');
      }
    }

    function applyCalcSheetWidth(w, opts) {
      const open = opts && typeof opts.open === 'boolean' ? opts.open : !sheet.classList.contains('closed');
      calcSheetWidth = Math.min(CALC_SHEET_MAX, Math.max(CALC_SHEET_MIN, Math.round(w)));
      sheet.style.setProperty('--calc-sheet-w', calcSheetWidth + 'px');
      sheet.style.width = calcSheetWidth + 'px';
      syncResizeAria();
      if (!isGcodeMode() && open) {
        stage.style.paddingLeft = calcStagePaddingLeft(true);
        stage.style.paddingRight = '16px';
      }
      /* adaptive presets 3↔2 when sheet crosses narrow threshold */
      if (typeof window.__nestPresetsSync === 'function') {
        requestAnimationFrame(function () { window.__nestPresetsSync(); });
      }
      return calcSheetWidth;
    }

    function applyGcodeSheetWidth(w, opts) {
      const split = opts && typeof opts.split === 'boolean'
        ? opts.split
        : (isGcodeMode() && !sheet.classList.contains('panel-full') && !sheet.classList.contains('closed'));
      gcodeSheetWidth = Math.min(GCODE_SHEET_MAX, Math.max(GCODE_SHEET_MIN, Math.round(w)));
      sheet.style.setProperty('--gcode-sheet-w', gcodeSheetWidth + 'px');
      if (isGcodeMode() && !sheet.classList.contains('panel-full')) {
        sheet.style.width = gcodeSheetWidth + 'px';
      }
      syncResizeAria();
      if (isGcodeMode() && split) {
        stage.style.paddingRight = gcodeStagePaddingRight(true);
        stage.style.paddingLeft = '16px';
      }
      return gcodeSheetWidth;
    }

    function clearCalcSheetInlineWidth() {
      sheet.style.removeProperty('width');
      sheet.style.removeProperty('--calc-sheet-w');
    }

    function clearGcodeSheetInlineWidth() {
      sheet.style.removeProperty('width');
      /* keep --gcode-sheet-w so restore lands on last width */
    }

    function setSheet(open) {
      const vex = document.getElementById('viewer-expand');
      if (vex) vex.style.display = 'none';

      if (isGcodeMode()) {
        // G-code: "close" = hide VIEWER, expand PANEL to full width (slow slide)
        // "open" = restore split (viewer left + panel right at last width)
        if (!open) {
          // Panel full-bleed: arrow points RIGHT
          stage.classList.add('viewer-collapsed');
          sheet.classList.remove('closed');
          sheet.classList.add('panel-full');
          clearGcodeSheetInlineWidth();
          stage.style.paddingLeft = '16px';
          stage.style.paddingRight = '16px';
          sheetOpen.classList.add('hidden');
          sheetOpen.style.cssText = '';
          const closeBtn = document.getElementById('sheet-close');
          if (closeBtn) closeBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 18l6-6-6-6"/></svg>';
        } else {
          // Split restored: arrow points LEFT — width + stage padding in sync
          stage.classList.remove('viewer-collapsed');
          sheet.classList.remove('closed');
          sheet.classList.remove('panel-full');
          applyGcodeSheetWidth(gcodeSheetWidth, { split: true });
          sheetOpen.classList.add('hidden');
          sheetOpen.style.cssText = '';
          const closeBtn = document.getElementById('sheet-close');
          if (closeBtn) closeBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg>';
        }
        return;
      }

      // Calculator: close hides panel, nest view full
      sheet.classList.toggle('closed', !open);
      sheet.classList.remove('panel-full');
      stage.classList.remove('viewer-collapsed');
      applyCalcSheetWidth(calcSheetWidth, { open: open });
      if (!open) {
        stage.style.paddingLeft = '16px';
        stage.style.paddingRight = '16px';
      }
      sheetOpen.style.cssText = '';
      sheetOpen.classList.toggle('hidden', open);
      if (!open) {
        sheetOpen.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 18l6-6-6-6"/></svg>';
      }
    }

    /* Drag free edge: calc right rim 300–500; gcode left rim 420–620. Hidden when full/closed. */
    (function initSheetResize() {
      if (!sheetResize) return;
      let dragging = false;
      let startX = 0;
      let startW = 500;
      let dragMode = 'calc'; /* 'calc' | 'gcode' */

      function onMove(e) {
        if (!dragging) return;
        if (sheet.classList.contains('panel-full') || sheet.classList.contains('closed')) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const dx = clientX - startX;
        if (dragMode === 'gcode') {
          /* free edge on left: drag left (neg dx) widens panel */
          applyGcodeSheetWidth(startW - dx, { split: true });
        } else {
          applyCalcSheetWidth(startW + dx, { open: true });
        }
        e.preventDefault();
      }
      function onUp() {
        if (!dragging) return;
        dragging = false;
        sheet.classList.remove('is-resizing');
        stage.classList.remove('is-resizing');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
        window.removeEventListener('pointercancel', onUp);
        window.removeEventListener('touchmove', onMove);
        window.removeEventListener('touchend', onUp);
      }
      function onDown(e) {
        if (sheet.classList.contains('closed') || sheet.classList.contains('panel-full')) return;
        if (isGcodeMode()) {
          if (!sheet.classList.contains('side-right')) return;
          dragMode = 'gcode';
          startW = gcodeSheetWidth;
        } else {
          if (sheet.classList.contains('side-right')) return;
          dragMode = 'calc';
          startW = calcSheetWidth;
        }
        dragging = true;
        startX = e.touches ? e.touches[0].clientX : e.clientX;
        sheet.classList.add('is-resizing');
        stage.classList.add('is-resizing');
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
        window.addEventListener('pointercancel', onUp);
        window.addEventListener('touchmove', onMove, { passive: false });
        window.addEventListener('touchend', onUp);
        e.preventDefault();
      }
      sheetResize.addEventListener('pointerdown', onDown);
      sheetResize.addEventListener('touchstart', onDown, { passive: false });
      sheetResize.tabIndex = 0;
      sheetResize.addEventListener('keydown', (e) => {
        if (sheet.classList.contains('closed') || sheet.classList.contains('panel-full')) return;
        const step = e.shiftKey ? 20 : 10;
        if (isGcodeMode()) {
          if (e.key === 'ArrowLeft') {
            applyGcodeSheetWidth(gcodeSheetWidth + step, { split: true });
            e.preventDefault();
          } else if (e.key === 'ArrowRight') {
            applyGcodeSheetWidth(gcodeSheetWidth - step, { split: true });
            e.preventDefault();
          } else if (e.key === 'Home') {
            applyGcodeSheetWidth(GCODE_SHEET_MIN, { split: true });
            e.preventDefault();
          } else if (e.key === 'End') {
            applyGcodeSheetWidth(GCODE_SHEET_MAX, { split: true });
            e.preventDefault();
          }
          return;
        }
        if (e.key === 'ArrowLeft') {
          applyCalcSheetWidth(calcSheetWidth - step, { open: true });
          e.preventDefault();
        } else if (e.key === 'ArrowRight') {
          applyCalcSheetWidth(calcSheetWidth + step, { open: true });
          e.preventDefault();
        } else if (e.key === 'Home') {
          applyCalcSheetWidth(CALC_SHEET_MIN, { open: true });
          e.preventDefault();
        } else if (e.key === 'End') {
          applyCalcSheetWidth(CALC_SHEET_MAX, { open: true });
          e.preventDefault();
        }
      });
      applyCalcSheetWidth(CALC_SHEET_MAX, { open: true });
      sheet.style.setProperty('--gcode-sheet-w', gcodeSheetWidth + 'px');
      syncResizeAria();
    })();
    // Toggle semantics for G-code: click close when split → expand panel; click again → restore
    sheetClose.addEventListener('click', () => {
      if (isGcodeMode()) {
        const expanded = sheet.classList.contains('panel-full');
        setSheet(expanded); // if expanded, restore (open=true); if split, expand (open=false)
      } else {
        setSheet(false);
      }
    });
    sheetOpen.addEventListener('click', () => setSheet(true));

    function updateBadges() {

      set('part-badge', (document.getElementById('part-x')?.value || '—') + ' × ' + (document.getElementById('part-y')?.value || '—'));

      set('gap-badge', (document.getElementById('gap-x')?.value || '—') + ' × ' + (document.getElementById('gap-y')?.value || '—'));
      set('margins-badge', 'L' + (document.getElementById('m-left')?.value || '—') + ' R' + (document.getElementById('m-right')?.value || '—') + ' B' + (document.getElementById('m-bottom')?.value || '—') + ' T' + (document.getElementById('m-top')?.value || '—'));
    }
    function syncNumInputClear(inp) {
      const wrap = inp && inp.closest ? inp.closest('.num-input-wrap') : null;

    document.querySelectorAll('[data-field]').forEach(inp => {

    document.querySelectorAll('.num-input-clear').forEach(btn => {

    const cards = Array.from(document.querySelectorAll('.section-card'));
    function cascadeSettle(fromIndex) {
      for (let i = fromIndex + 1; i < cards.length; i++) {
        const card = cards[i];
        card.classList.remove('settle');
        void card.offsetWidth;
        card.classList.add('settle');
        setTimeout(() => card.classList.remove('settle'), 390);
      }
    }

    function syncPresetsActions(open) {
      const actions = document.getElementById('presets-header-actions');
      if (actions) actions.style.display = open ? 'flex' : 'none';
    }
    function openSection(body, chev, badge) {
      /* Same duration open/close; slight bounce only on open via --spring */
      body.classList.add('is-opening');
      body.classList.remove('closed');
      body.style.maxHeight = '0px';
      body.offsetHeight; /* force reflow at 0 before expand */
      const h = body.scrollHeight;
      body.style.maxHeight = h + 'px';
      if (chev) chev.classList.add('rotated');
      if (badge) badge.classList.add('hidden');
      const clearOpen = function () {
        body.classList.remove('is-opening');
        if (!body.classList.contains('closed')) {
          /* none after settle: allows textarea resize + nested growth; close pins height first */
          body.style.maxHeight = 'none';
        }
      };
      body.addEventListener('transitionend', function te(e) {
        if (e.propertyName && e.propertyName !== 'max-height') return;
        body.removeEventListener('transitionend', te);
        clearOpen();
      });
      setTimeout(clearOpen, 430);
      if (body.id === 'presets-body') {
        syncPresetsActions(true);
        /* remeasure after collapse animation — not mid-open (avoids pop) */
        setTimeout(function () {
          if (typeof window.__nestPresetsSync === 'function') window.__nestPresetsSync();
        }, 420);
      }
    }
    function closeSection(body, chev, badge) {
      body.classList.remove('is-opening');
      body.style.maxHeight = body.scrollHeight + 'px';
      body.offsetHeight;
      body.classList.add('closed');
      body.style.maxHeight = '0px';
      if (chev) chev.classList.remove('rotated');
      if (badge) badge.classList.remove('hidden');
      if (body.id === 'presets-body') syncPresetsActions(false);
    }

    document.querySelectorAll('.section-trigger').forEach(btn => {
      btn.addEventListener('click', () => {
        const body = document.getElementById(btn.dataset.target);
        if (!body) return;
        const card = btn.closest('.section-card');
        const chev = card ? card.querySelector('.chevron') : btn.querySelector('.chevron');
        const badgeId = btn.dataset.badge;
        const badge = badgeId ? document.getElementById(badgeId) : null;
        const idx = cards.indexOf(card);
        if (body.classList.contains('closed')) openSection(body, chev, badge);
        else closeSection(body, chev, badge);
        cascadeSettle(idx);
      });
    });

    // Calc: only Part starts open. G-code: Source + Part size open; Output closed.
    ['presets-body', 'rem-body', 'gap-body', 'margins-body', 'output-body'].forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      el.classList.add('closed');
      el.style.maxHeight = '0px';
      const card = el.closest('.section-card');
      if (card) {
        const chev = card.querySelector('.chevron');
        if (chev) chev.classList.remove('rotated');
        // show badges on closed value sections
        const badge = card.querySelector('.value-badge');
        if (badge) badge.classList.remove('hidden');
      }
    });
    function mountOpenSection(id) {
      const el = document.getElementById(id);
      if (!el) return;
      el.classList.remove('closed');
      el.style.maxHeight = 'none';
      el.style.maxHeight = el.scrollHeight + 'px';
      const card = el.closest('.section-card');
      if (card) {
        const chev = card.querySelector('.chevron');
        if (chev) chev.classList.add('rotated');
        const badge = card.querySelector('.value-badge');
        if (badge) badge.classList.add('hidden');
      }
    }
    mountOpenSection('part-body');
    mountOpenSection('source-body');
    mountOpenSection('partsize-body');
    syncPresetsActions(false);

    document.querySelectorAll('[data-link]').forEach(btn => {
      btn.addEventListener('click', () => btn.classList.toggle('active'));
    });

    /* Seamless sliding segment switches — shared thumb layout (pad 2px tracks) */
    function syncSegThumb(track, activeBtn, accent) {
      if (!track || !activeBtn) return;
      const thumb = track.querySelector('.seg-switch__thumb');
      if (!thumb) return;
      const pad = 2;
      if (accent) thumb.style.background = accent;
      thumb.style.width = activeBtn.offsetWidth + 'px';
      thumb.style.transform = 'translateX(' + Math.max(0, activeBtn.offsetLeft - pad) + 'px)';
    }
    function bindSegResize(track, syncFn) {
      if (!track || typeof ResizeObserver === 'undefined') return;
      new ResizeObserver(syncFn).observe(track);
    }

    // ---- Mode switch: Calculator ↔ G-code ----
    /* State declared up-front so thumb syncs never hit TDZ during init/resize */
    let progUnit = 'in';
    let partUnit = 'in';
    let currentAngle = 0;
    let derivedXY = null;
    let baseXY = null; // always stored in program units
    window.calcUnitMode = 'in';
    function headerAccent() {
      return isGcodeMode() ? '#EE8C3C' : '#538BEC';
    }

    /* AutoNest | Manual — same isAuto semantics as prior control */
    const nestModeSwitch = document.getElementById('autonest-switch');
    const modeAutoBtn = document.getElementById('mode-autonest');
    const modeManualBtn = document.getElementById('mode-manual');
    let isAuto = false;
    function syncNestModeThumb() {
      const active = isAuto ? modeAutoBtn : modeManualBtn;
      syncSegThumb(nestModeSwitch, active, '#538BEC');
    }
    function setNestMode(auto) {
      isAuto = !!auto;

      if (modeManualBtn) modeManualBtn.setAttribute('aria-pressed', isAuto ? 'false' : 'true');

    }
    if (modeAutoBtn) modeAutoBtn.addEventListener('click', () => setNestMode(true));
    if (modeManualBtn) modeManualBtn.addEventListener('click', () => setNestMode(false));

    const unitSwitch = document.getElementById('unit-switch');
    const unitInBtn = document.getElementById('unit-in');
    const unitMmBtn = document.getElementById('unit-mm');
    function syncHeaderUnitThumb() {

      syncSegThumb(unitSwitch, active, headerAccent());

    function setCalcUnit(u) {

    const progUnitSwitch = document.getElementById('prog-unit-switch');

      if (progUnitMm) progUnitMm.setAttribute('aria-pressed', progUnit === 'mm' ? 'true' : 'false');

    if (progUnitIn) progUnitIn.addEventListener('click', () => setProgUnit('in'));

    const partUnitSwitch = document.getElementById('part-unit-switch');

    function setPartUnit(u) {

      if (partUnitMm) partUnitMm.setAttribute('aria-pressed', partUnit === 'mm' ? 'true' : 'false');

      syncProgUnitThumb();

    /* Calculator | G-code — seamless sliding track (not hard-swap buttons) */
    const modeSwitch = document.getElementById('mode-switch');
    const tabCalc = document.getElementById('tab-calc');
    const tabGcode = document.getElementById('tab-gcode');
    function syncModeThumb() {
      if (!modeSwitch) return;

      const accent = currentMode === 'gcode' ? '#EE8C3C' : '#538BEC';

    function setTabStyles(mode) {

    function setCalcOnlyVisible(show) {

    /*

    function layoutForMode(mode, opts) {

      const sheetEl = document.getElementById('sheet');
      const stageEl = document.getElementById('stage');
      const openBtn = document.getElementById('sheet-open');

        clearCalcSheetInlineWidth();

        if (closeBtn) closeBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg>';

        } else {
          sheetEl.classList.add('closed');

        }
      } else {
        sheetEl.classList.remove('side-right');
        sheetEl.style.setProperty('--gcode-sheet-w', gcodeSheetWidth + 'px');
        sheetEl.style.setProperty('--calc-sheet-w', calcSheetWidth + 'px');
        sheetEl.style.width = calcSheetWidth + 'px';
        if (closeBtn) closeBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg>';
        if (open) {
          sheetEl.classList.remove('closed');
          applyCalcSheetWidth(calcSheetWidth, { open: true });

    /* Safe evaluate for calculator LCD only — digits, ops, decimal */
    function evalCalcExpr(raw) {
      if (!raw || typeof raw !== 'string') return null;
      let s = raw.trim()
        .replace(/×/g, '*')
        .replace(/÷/g, '/')
        .replace(/−/g, '-')
        .replace(/\s+/g, '');
      if (!s) return null;
      if (/[+\-*/.]$/.test(s)) s = s.slice(0, -1);
      if (!s || !/^[\d.+\-*/]+$/.test(s)) return null;
      if (!/\d/.test(s)) return null;
      try {
        const n = Function('"use strict"; return (' + s + ')')();
        if (typeof n !== 'number' || !isFinite(n)) return null;
        const t = Math.round(n * 1e10) / 1e10;
        return String(t);
      } catch (_) {
        return null;
      }
    }

    function appendCalcToken(token) {
      if (calcJustEvaluated && /[0-9.]/.test(token)) {
        calcExpr = '';
        calcJustEvaluated = false;
      }
      if (calcJustEvaluated && /[+\-×÷−]/.test(token)) {
        calcJustEvaluated = false;
      }
      const ops = '+−×÷';
      if (ops.indexOf(token) !== -1) {
        if (!calcExpr) return;
        const last = calcExpr.slice(-1);
        if (ops.indexOf(last) !== -1) {
          calcExpr = calcExpr.slice(0, -1) + token;
        } else {
          calcExpr += token;
        }
      } else if (token === '.') {
        const parts = calcExpr.split(/[+\-×÷−]/);
        const cur = parts[parts.length - 1] || '';
        if (cur.indexOf('.') !== -1) return;
        calcExpr += (cur === '' ? '0.' : '.');
      } else {
        calcExpr += token;
      }
      syncLcd();
    }

      if (!calcExpr) return;
      calcExpr = calcExpr.slice(0, -1);
      calcJustEvaluated = false;
      syncLcd();

    /* Free drag via top chrome bar (no grip graphic); keys stay clickable */
    (function initNumpadDrag() {
      if (!numpad) return;
      const handle = numpad.querySelector('.numpad-drag-handle');
      let dragging = false;
      let startX = 0, startY = 0;
      let originLeft = 0, originTop = 0;

      function pinPadPosition() {
        const r = numpad.getBoundingClientRect();
        numpad.style.left = r.left + 'px';
        numpad.style.top = r.top + 'px';
        numpad.style.right = 'auto';
        numpad.style.bottom = 'auto';
        numpad.style.setProperty('--pad-x', '0px');
        numpad.style.setProperty('--pad-y', '0px');
      }

      function onMove(e) {
        if (!dragging) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        let nx = originLeft + (clientX - startX);
        let ny = originTop + (clientY - startY);
        const w = numpad.offsetWidth;
        const h = numpad.offsetHeight;
        const maxX = Math.max(0, window.innerWidth - w);
        const maxY = Math.max(0, window.innerHeight - h);
        nx = Math.min(maxX, Math.max(0, nx));
        ny = Math.min(maxY, Math.max(0, ny));
        numpad.style.left = nx + 'px';
        numpad.style.top = ny + 'px';
        numpad.style.right = 'auto';
        numpad.style.bottom = 'auto';
        numpad.style.setProperty('--pad-x', '0px');
        numpad.style.setProperty('--pad-y', '0px');
        e.preventDefault();
      }
      function onUp() {
        if (!dragging) return;
        dragging = false;
        numpad.classList.remove('is-dragging');
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
        window.removeEventListener('pointercancel', onUp);
        window.removeEventListener('touchmove', onMove);
        window.removeEventListener('touchend', onUp);
      }
      function onDown(e) {
        if (e.target.closest && (
          e.target.closest('button[data-key]') ||
          e.target.closest('button[data-quick]') ||
          e.target.closest('button[data-op]') ||
          e.target.closest('#numpad-close') ||
          e.target.closest('#numpad-mode-btn') ||
          e.target.closest('.quick-manage') ||
          e.target.closest('#quick-add') ||
          e.target.closest('#quick-edit')
        )) return;
        const fromHandle = handle && (e.target === handle || (handle.contains(e.target) && !e.target.closest('.quick-manage')));
        const fromChrome = e.target === numpad || (e.target.classList && e.target.classList.contains('numpad-chrome'));

        }

        dragging = true;
        numpad.classList.add('is-dragging');
        startX = e.touches ? e.touches[0].clientX : e.clientX;
        startY = e.touches ? e.touches[0].clientY : e.clientY;

        function writeAtCaret(chunk) {
          if (typingFresh) {
            activeField.value = chunk;
            typingFresh = false;
            try { activeField.setSelectionRange(chunk.length, chunk.length); } catch (_) {}
            return;
          }
          if (canSel) {
            const next = val.slice(0, start) + chunk + val.slice(end);
            activeField.value = next;
            const caret = start + chunk.length;
            try { activeField.setSelectionRange(caret, caret); } catch (_) {}
          } else {
            activeField.value = val + chunk;
          }
          typingFresh = false;
        }
        if (key === 'back') {
          if (canSel && start !== end) {
            activeField.value = val.slice(0, start) + val.slice(end);
            try { activeField.setSelectionRange(start, start); } catch (_) {}
          } else if (canSel && start > 0) {
            activeField.value = val.slice(0, start - 1) + val.slice(end);
            try { activeField.setSelectionRange(start - 1, start - 1); } catch (_) {}
          } else {
            activeField.value = val.slice(0, -1);
          }
          typingFresh = false;
        } else if (key === 'enter') {
          /* Confirm field only — do NOT auto-close pad (X / sheet icon only) */

        } else if (key === '.') {

            const next = val.slice(0, start) + '.' + val.slice(end);

      let visibleCount = VISIBLE_WIDE;

      function chips() {
        return Array.from(track.querySelectorAll('.preset-chip'));
      }
      function resolveVisible() {
        /* Prefer live sheet width (calc mode); fall back to viewport */
        let w = typeof calcSheetWidth === 'number' ? calcSheetWidth : 0;
        if (!w && sheet) w = sheet.getBoundingClientRect().width;
        return (w > 0 && w <= NARROW_SHEET) ? VISIBLE_NARROW : VISIBLE_WIDE;
      }
      function maxPage() {
        return Math.max(0, Math.ceil(chips().length / visibleCount) - 1);
      }
      function chipStep() {
        const list = chips();
        if (!list.length) return 0;
        const w = list[0].offsetWidth;
        if (w > 0) return w + GAP;
        const vw = viewport.clientWidth;
        if (vw > 0) return (vw - GAP * (visibleCount - 1)) / visibleCount + GAP;
        return 0;
      }
      function remountOpenHeight() {
        const body = document.getElementById('presets-body');
        if (body && !body.classList.contains('closed') && !body.classList.contains('is-opening')) {
          body.style.maxHeight = 'none';
          body.style.maxHeight = body.scrollHeight + 'px';
        }
      }
      function syncCarousel() {
        const nextVis = resolveVisible();
        if (nextVis !== visibleCount) {
          visibleCount = nextVis;
          page = 0;
        }
        const carousel = document.getElementById('presets-carousel');
        if (carousel) carousel.setAttribute('data-visible', String(visibleCount));
        const list = chips();
        const mp = maxPage();
        if (page > mp) page = mp;
        if (page < 0) page = 0;
        const step = chipStep() * visibleCount;
        track.style.transform = step > 0 ? ('translateX(' + (-page * step) + 'px)') : 'translateX(0px)';
        if (prevBtn) prevBtn.disabled = page <= 0;
        if (nextBtn) nextBtn.disabled = page >= mp || list.length <= visibleCount;
        if (deleteBtn) deleteBtn.disabled = list.length <= 1 || !selectedPreset;
        if (editBtn) editBtn.disabled = !selectedPreset || list.length === 0;
        list.forEach(chip => {
          const name = chip.dataset.preset || chip.textContent.trim();
          chip.title = name;
          const on = name === selectedPreset;
          chip.classList.toggle('is-selected', on);
          chip.setAttribute('aria-pressed', on ? 'true' : 'false');
          /* clear inline styles from older stub */
          chip.style.background = '';
          chip.style.border = '';
          chip.style.color = '';
        });
      }
      function bindChip(chip) {
        chip.addEventListener('click', () => {
          selectedPreset = chip.dataset.preset || chip.textContent.trim();
          syncCarousel();
        });
      }
      chips().forEach(bindChip);

      if (prevBtn) prevBtn.addEventListener('click', () => { page -= 1; syncCarousel(); });
      if (nextBtn) nextBtn.addEventListener('click', () => { page += 1; syncCarousel(); });

      if (addBtn) {
        addBtn.addEventListener('click', () => {
          const name = 'Preset ' + (chips().length + 1);
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'preset-chip press';
          btn.setAttribute('role', 'listitem');
          btn.dataset.preset = name;
          btn.title = name;
          btn.textContent = name;
          track.appendChild(btn);
          bindChip(btn);
          selectedPreset = name;
          page = maxPage();
          syncCarousel();
          remountOpenHeight();
        });
      }

      if (editBtn) {
        editBtn.addEventListener('click', () => {
          if (!selectedPreset) return;
          const chip = chips().find(c => (c.dataset.preset || c.textContent.trim()) === selectedPreset);
          if (!chip) return;
          const next = window.prompt('Rename preset', selectedPreset);
          if (next == null) return;
          const name = String(next).trim();
          if (!name) return;
          if (chips().some(c => c !== chip && (c.dataset.preset || c.textContent.trim()) === name)) return;
          chip.dataset.preset = name;
          chip.title = name;
          chip.textContent = name;
          selectedPreset = name;
          syncCarousel();
        });
      }

      if (deleteBtn) {
        deleteBtn.addEventListener('click', () => {
          const list = chips();
          if (list.length <= 1) return;
          const chip = list.find(c => (c.dataset.preset || c.textContent.trim()) === selectedPreset);
          if (!chip) return;
          const idx = list.indexOf(chip);
          chip.remove();
          const remaining = chips();
          const pick = remaining[Math.max(0, Math.min(idx, remaining.length - 1))];
          selectedPreset = pick ? (pick.dataset.preset || pick.textContent.trim()) : '';
          if (page > maxPage()) page = maxPage();
          syncCarousel();
          remountOpenHeight();
        });
      }

      window.__nestPresetsSync = function () {
        requestAnimationFrame(function () {
          syncCarousel();
          remountOpenHeight();
        });
      };

      if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(function () { syncCarousel(); }).observe(viewport);
      }
      window.addEventListener('resize', syncCarousel);
      requestAnimationFrame(syncCarousel);
    })();

    /* ---- Keypad quick-value carousel: 4-up, add + edit(with delete) ---- */
    (function initQuickCarousel() {
      const track = document.getElementById('quick-track');
      const viewport = document.getElementById('quick-viewport');
      const prevBtn = document.getElementById('quick-prev');
      const nextBtn = document.getElementById('quick-next');
      const addBtn = document.getElementById('quick-add');
      const editBtn = document.getElementById('quick-edit');
      if (!track || !viewport) return;

      const VISIBLE = 4;
      const GAP = 4;
      let page = 0;
      let selectedQuick = null;

      function chips() {
        return Array.from(track.querySelectorAll('.quick-chip'));
      }
      function maxPage() {
        return Math.max(0, Math.ceil(chips().length / VISIBLE) - 1);
      }
      function chipStep() {
        const list = chips();
        if (!list.length) return 0;
        const w = list[0].offsetWidth;
        if (w > 0) return w + GAP;
        const vw = viewport.clientWidth;
        if (vw > 0) return (vw - GAP * (VISIBLE - 1)) / VISIBLE + GAP;
        return 0;
      }
      function formatQuick(v) {
        const n = parseFloat(v);
        if (!isFinite(n)) return String(v);
        if (Math.abs(n) >= 1) {
          const s = n.toFixed(2);
          return s.replace(/\.?0+$/, '');
        }
        const s = n.toFixed(3);
        return s.replace(/^0/, '');
      }
      /**
       * Quick chip insert: at caret when no selection; replace selection when selected.
       * Uses chip label form (e.g. ".125") so "10" + chip → "10.125".
       * Falls back to append when selection API is unavailable (rare on text fields).
       */
      function applyQuickChipToField(field, quickVal) {
        if (!field) return;
        const insert = formatQuick(quickVal);
        const val = String(field.value ?? '');
        let start = field.selectionStart;
        let end = field.selectionEnd;
        const canSel = typeof start === 'number' && typeof end === 'number';
        if (canSel) {
          const next = val.slice(0, start) + insert + val.slice(end);
          field.value = next;
          const caret = start + insert.length;
          try {
            field.focus();
            field.setSelectionRange(caret, caret);
          } catch (_) {}
        } else if (typingFresh) {
          field.value = insert;
        } else {
          field.value = val + insert;
        }
        typingFresh = false;
        field.dispatchEvent(new Event('input'));
        if (typeof syncNumInputClear === 'function') syncNumInputClear(field);
      }
      function sync() {
        const list = chips();
        const mp = maxPage();
        if (page > mp) page = mp;
        if (page < 0) page = 0;
        const scrollable = list.length > VISIBLE;
        const carousel = document.getElementById('quick-carousel');
        if (carousel) carousel.classList.toggle('is-scrollable', scrollable);
        if (!scrollable) page = 0;
        const step = chipStep() * VISIBLE;
        track.style.transform = step > 0 ? ('translateX(' + (-page * step) + 'px)') : 'translateX(0px)';
        if (prevBtn) prevBtn.disabled = page <= 0;
        if (nextBtn) nextBtn.disabled = page >= mp || !scrollable;
        if (editBtn) editBtn.disabled = !selectedQuick || list.length === 0;
        list.forEach(chip => {
          chip.classList.toggle('is-selected', chip.dataset.quick === selectedQuick);
        });
      }
      function bindChip(chip) {
        chip.addEventListener('mousedown', e => e.preventDefault());
        chip.addEventListener('click', () => {
          selectedQuick = chip.dataset.quick;
          sync();
          if (padMode !== 'entry' || !activeField) return;
          applyQuickChipToField(activeField, chip.dataset.quick);
        });
      }
      chips().forEach(bindChip);

      if (prevBtn) prevBtn.addEventListener('click', () => { page -= 1; sync(); });
      if (nextBtn) nextBtn.addEventListener('click', () => { page += 1; sync(); });

      if (addBtn) {
        addBtn.addEventListener('mousedown', e => e.preventDefault());
        addBtn.addEventListener('click', () => {
          const raw = window.prompt('New quick value (e.g. 0.062)', '0.062');
          if (raw == null) return;
          const n = parseFloat(String(raw).trim());
          if (!isFinite(n) || n < 0) return;
          const val = String(n);
          if (chips().some(c => c.dataset.quick === val)) return;
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'quick-chip press';
          btn.setAttribute('role', 'listitem');
          btn.dataset.quick = val;
          btn.title = val;
          btn.textContent = formatQuick(val);
          track.appendChild(btn);
          bindChip(btn);
          selectedQuick = val;
          page = maxPage();
          sync();
        });
      }

      if (editBtn) {
        editBtn.addEventListener('mousedown', e => e.preventDefault());
        editBtn.addEventListener('click', () => {
          if (!selectedQuick) return;
          const chip = chips().find(c => c.dataset.quick === selectedQuick);
          if (!chip) return;
          const action = window.prompt(
            'Edit quick value "' + selectedQuick + '"\nEnter new number to rename, or type DELETE to remove.',
            selectedQuick
          );
          if (action == null) return;
          const t = String(action).trim();
          if (!t) return;
          if (/^delete$/i.test(t)) {
            if (chips().length <= 1) return;
            const idx = chips().indexOf(chip);
            chip.remove();
            const rem = chips();
            const pick = rem[Math.max(0, Math.min(idx, rem.length - 1))];
            selectedQuick = pick ? pick.dataset.quick : null;
            if (page > maxPage()) page = maxPage();
            sync();
            return;
          }
          const n = parseFloat(t);
          if (!isFinite(n) || n < 0) return;
          const val = String(n);
          if (chips().some(c => c !== chip && c.dataset.quick === val)) return;
          chip.dataset.quick = val;
          chip.title = val;
          chip.textContent = formatQuick(val);
          selectedQuick = val;
          sync();
        });
      }

      if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(sync).observe(viewport);
      }
      window.addEventListener('resize', sync);
      requestAnimationFrame(sync);
    })();
  </script>
</body>
