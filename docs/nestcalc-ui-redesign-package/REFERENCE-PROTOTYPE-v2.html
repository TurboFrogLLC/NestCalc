<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NestCalc — Preview-first Prototype</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            ink: {
              950: '#0B0814',
              900: '#120E1C',
              850: '#1A1428',
              800: '#221A32',
              700: '#2A2238',
              600: '#3D3554',
            },
            violet: {
              500: '#8B5CF6',
              400: '#A78BFA',
              300: '#C4B5FD',
              200: '#DDD6FE',
            },
            magenta: {
              500: '#C13CD1',
              400: '#E879F9',
              300: '#F0ABFC',
            },
            hot: {
              500: '#EC4899',
              400: '#F472B6',
            }
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --smooth: cubic-bezier(0.22, 1, 0.36, 1);
      --bg: #08060D;
      --panel: #0E0C14;
      --surface: #16121F;
      --raised: #1E1A2A;
      --muted: #2A2438;
      --violet: #8B5CF6;
      --violet-bright: #A78BFA;
      --violet-soft: #C8CDD8;
      --magenta: #C13CD1;
      --magenta-bright: #E879F9;
      --hot: #EC4899;
      --text: #F5F3FF;
      --text-muted: #C8CDD8;
    }
    html, body {
      overflow-x: auto;
    }
    body {
      font-family: "SF Pro Text", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    input[type="number"] { -moz-appearance: textfield; }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input:focus {
      outline: none;
      box-shadow: 0 0 0 2px rgba(83, 139, 236, 0.55);
      border-color: rgba(83, 139, 236, 0.65) !important;
    }

    /* High-contrast panel: pink→purple gradient edge + soft light outer */
    .glow {
      position: relative;
      background: var(--panel);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.12),
        0 0 0 1px rgba(83, 139, 236, 0.25),
        0 8px 28px -12px rgba(0, 0, 0, 0.8);
    }
    .glow::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1px;
      /* soft white → blue only — no pink */
      background: linear-gradient(135deg,
        rgba(255, 255, 255, 0.5) 0%,
        rgba(180, 200, 230, 0.45) 35%,
        rgba(83, 139, 236, 0.75) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: 1;
    }
    .glow-soft {
      background: #16121F;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.12),
        0 0 0 1px rgba(83, 139, 236, 0.18),
        0 6px 18px -8px rgba(0, 0, 0, 0.6);
      overflow: hidden;
    }

    /* Horizontal button group */
    .btn-group-h {
      display: flex;
      flex-direction: row;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(83, 139, 236, 0.4);
      background: var(--raised);
      flex-shrink: 0;
      height: 36px;
    }
    .btn-group-h button {
      width: 32px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #C8CDD8;
      background: transparent;
      border: none;
      transition: background 0.15s, color 0.15s;
    }
    .btn-group-h button + button {
      border-left: 1px solid rgba(83, 139, 236, 0.25);
    }
    .btn-group-h button:hover {
      background: rgba(83, 139, 236, 0.32);
      color: #fff;
    }
    .btn-group-h button.active {
      background: #538BEC;
      color: #fff;
    }

    .sheet {
      --calc-sheet-w: 300px;
      transition:
        transform 0.72s cubic-bezier(0.34, 1.45, 0.64, 1),
        opacity 0.35s var(--smooth),
        left 0.72s cubic-bezier(0.34, 1.45, 0.64, 1),
        right 0.72s cubic-bezier(0.34, 1.45, 0.64, 1),
        width 0.72s cubic-bezier(0.34, 1.45, 0.64, 1);
      will-change: transform, left, right, width;
      left: 0.75rem;
      right: auto;
      width: 300px;
    }
    /* Calculator mode only: hard min 300 / max 500; locked density at 300 */
    .sheet:not(.side-right) {
      width: var(--calc-sheet-w, 300px);
      min-width: 300px;
      max-width: 500px;
      container-type: inline-size;
      container-name: calc-sheet;
    }
    .sheet.is-resizing {
      transition: none;
      user-select: none;
    }
    .stage.is-resizing {
      transition: none !important;
    }
    /* Free-edge resize only — narrow rim hit target; does not cover sheet controls */
    .sheet-resize {
      position: absolute;
      top: 0;
      right: 0;
      width: 6px;
      height: 100%;
      cursor: col-resize;
      z-index: 50;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      box-sizing: content-box;
      border-right: 4px solid transparent; /* outside-leaning hit area */
      background: transparent;
    }
    .sheet-resize::after {
      content: '';
      position: absolute;
      right: 1px;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 52px;
      border-radius: 3px;
      background: rgba(83, 139, 236, 0.45);
      box-shadow: 0 0 0 1px rgba(83, 139, 236, 0.15);
      transition: height 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
      pointer-events: none;
    }
    .sheet-resize:hover::after,
    .sheet.is-resizing .sheet-resize::after {
      height: 72px;
      background: rgba(83, 139, 236, 0.95);
      box-shadow: 0 0 8px rgba(83, 139, 236, 0.45);
    }
    .sheet.side-right .sheet-resize,
    .sheet.closed .sheet-resize,
    .sheet.panel-full .sheet-resize {
      display: none;
      pointer-events: none;
    }
    /*
      Interior flex when wider than 300px: expand spacing only.
      At 300cqi clamp floors match main locked density (no tighten).
    */
    .sheet:not(.side-right) .xy-row {
      gap: clamp(8px, calc(8px + (100cqi - 300px) * 0.06), 22px);
    }
    .sheet:not(.side-right) .xy-row .xy-field {
      gap: clamp(6px, calc(6px + (100cqi - 300px) * 0.02), 10px);
    }
    .sheet:not(.side-right) .num-input {
      width: clamp(4.1rem, calc(4.1rem + (100cqi - 300px) * 0.012), 5.75rem);
    }
    .sheet:not(.side-right) .m-field .num-input {
      width: 100%;
      max-width: clamp(4.1rem, calc(4.1rem + (100cqi - 300px) * 0.01), 5.75rem);
    }
    .sheet:not(.side-right) .margins-row {
      gap: clamp(6px, calc(6px + (100cqi - 300px) * 0.05), 18px);
      justify-content: space-between;
    }
    .sheet:not(.side-right) #sections-stack {
      padding-left: clamp(12px, calc(12px + (100cqi - 300px) * 0.04), 20px);
      padding-right: clamp(12px, calc(12px + (100cqi - 300px) * 0.04), 20px);
    }
    .sheet:not(.side-right) .xy-sep {
      margin-left: clamp(2px, calc(2px + (100cqi - 300px) * 0.02), 8px);
      margin-right: clamp(4px, calc(4px + (100cqi - 300px) * 0.03), 12px);
    }
    .sheet.closed {
      transform: translateX(calc(-100% - 16px));
      opacity: 0;
      pointer-events: none;
    }
    .sheet.side-right {
      left: auto;
      right: 0.75rem;
      width: 420px;
      min-width: 0;
      max-width: none;
      container-type: normal;
    }
    /* Full expand: animate width from 420px → calc(100% - 1.5rem); avoid width:auto snap */
    .sheet.side-right.panel-full {
      left: 0.75rem;
      right: auto;
      width: calc(100% - 1.5rem);
    }
    .gcode-mid-row {
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
      align-items: stretch;
      transition: gap 0.4s var(--smooth), flex-direction 0.01s;
    }
    .sheet.panel-full .gcode-mid-row {
      flex-direction: row;
      align-items: stretch;
      gap: 0.75rem;
    }
    .gcode-card-body {
      min-height: 5.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
      box-sizing: border-box;
    }
    .gcode-card-body > div:first-child {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 2.25rem;
    }
    .gcode-card-body > button {
      flex-shrink: 0;
      margin-top: auto;
    }
    .sheet.panel-full .gcode-mid-row > section {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      height: 100%;
      transition: flex 0.72s cubic-bezier(0.34, 1.45, 0.64, 1), transform 0.72s cubic-bezier(0.34, 1.45, 0.64, 1);
    }
    .sheet.panel-full .gcode-mid-row > section .gcode-card-body {
      flex: 1 1 auto;
    }

    .sheet.panel-full .gcode-mid-row > section {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      transition: flex 0.32s var(--spring), transform 0.32s var(--spring);
    }
    .sheet.panel-full .gcode-mid-row > section > .section-header,
    .sheet.panel-full .gcode-mid-row > section > .section-header-gcode {
      flex-shrink: 0;
    }
    .sheet.panel-full .gcode-mid-row > section > div:last-child {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .sheet.panel-full {

      left: 0.75rem !important;
      right: 0.75rem !important;
      width: auto !important;
      max-width: none;
    }
    /* viewer fades via opacity — see unified rule */
    .sheet.side-right.closed {
      transform: translateX(calc(100% + 16px));
    }
    #calc-view, #gcode-view {
      transition: opacity 0.72s cubic-bezier(0.34, 1.45, 0.64, 1), transform 0.72s cubic-bezier(0.34, 1.45, 0.64, 1);
    }
    .stage.viewer-collapsed #calc-view,
    .stage.viewer-collapsed #gcode-view {
      opacity: 0;
      transform: scale(0.96);
      pointer-events: none;
    }
    #viewer-expand {
      display: none;
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 20;
    }
    .stage.viewer-collapsed #viewer-expand {
      display: flex;
    }
    .stage {
      min-width: 320px;
    }
    .sheet.side-right:not(.panel-full) {
      /* keep fixed width; stage padding reserves gap — no bleed */
    }
    .stage {
      transition: padding-left 0.72s cubic-bezier(0.34, 1.45, 0.64, 1), padding-right 0.72s cubic-bezier(0.34, 1.45, 0.64, 1);
    }

    .section-html, body {
      overflow-x: auto;
    }
    body {
      transition: max-height 0.42s var(--spring), opacity 0.22s ease;
      overflow: hidden;
    }
    .section-body.closed {
      max-height: 0 !important;
      opacity: 0;
    }
    .chevron {
      transition: transform 0.35s var(--spring);
    }
    .chevron.rotated { transform: rotate(180deg); }

    .section-card {
      transition: transform 0.4s var(--spring);
      border-radius: 8px;
    }
    @keyframes hydrateFlash {
      0% { box-shadow: 0 0 0 0 rgba(83,139,236,0.0); }
      40% { box-shadow: 0 0 0 3px rgba(83,139,236,0.55); }
      100% { box-shadow: 0 0 0 0 rgba(83,139,236,0.0); }
    }
    .hydrate-flash {
      animation: hydrateFlash 0.55s ease;
    }
    .mode-morph {
      transition: opacity 0.28s var(--smooth), transform 0.36s var(--spring);
    }
    .mode-morph.out {
      opacity: 0;
      transform: translateY(6px) scale(0.985);
      pointer-events: none;
    }
    .section-card.settle {
      animation: settleBounce 0.5s var(--spring);
    }
    @keyframes settleBounce {
      0%   { transform: translateY(0); }
      30%  { transform: translateY(4px); }
      55%  { transform: translateY(-2px); }
      100% { transform: translateY(0); }
    }

    .press {
      transition: transform 0.15s var(--spring);
    }
    .press:active { transform: scale(0.96); }

    .numpad {
      transition: transform 0.4s var(--spring), opacity 0.22s ease;
    }
    .numpad.hidden-pad {
      transform: translateY(18px) scale(0.96);
      opacity: 0;
      pointer-events: none;
    }

    .value-badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 10px;
      line-height: 1.2;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(83, 139, 236, 0.2);
      border: 1px solid rgba(83, 139, 236, 0.35);
      color: #C8CDD8;
      white-space: nowrap;
    }

    .num-input {
      width: 4.1rem;
      min-width: 0;
      text-align: center;
      background: var(--raised);
      border: 1px solid rgba(200, 205, 216, 0.2);
      color: var(--text);
    }

    .axis-count {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      color: #C8CDD8;
      text-shadow: none;
      user-select: none;
    }

    .xy-row {
      display: flex;
      align-items: center;
      width: 100%;
      gap: 8px;
      justify-content: flex-start;
    }
    .xy-row .xy-field {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .xy-row .btn-group-h {
      margin-left: 0;
    }
    .xy-sep {
      width: 1px;
      height: 28px;
      background: rgba(255, 255, 255, 0.12);
      margin: 0 4px 0 2px;
      flex-shrink: 0;
    }
    .margins-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      width: 100%;
    }
    .m-field {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex: 1;
      min-width: 0;
    }
    .m-field .num-input {
      width: 100%;
      max-width: 4.1rem;
    }
    .m-label {
      font-size: 10px;
      font-weight: 600;
      color: #C8CDD8;
      letter-spacing: 0.02em;
    }

    /* Calculator keys matching reference */
    .key-num {
      background: #222230;
      color: #E8E4F0;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .key-num:hover { background: #2E2E40; }
    .key-op {
      background: #538BEC;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .key-op:hover { filter: brightness(1.1); }
    .key-eq {
      background: #538BEC;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .key-eq:hover { filter: brightness(1.1); }
    .key-util {
      background: #2A2238;
      color: #C8CDD8;
      border: 1px solid rgba(83, 139, 236, 0.25);
    }
    .key-util:hover { background: #3D3554; color: #fff; }
    .section-label {
      color: #ffffff;
    }
    /* Section header bar */
    .section-header-gcode {
      background: #D97830 !important;
    }
    body.mode-gcode {
      --mode-accent: #EE8C3C;
    }
    .section-header,
    .section-header-gcode {
      min-height: 36px;
      height: 36px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
    }
    .section-header {
      background: rgba(83, 139, 236, 0.75);
      color: #ffffff;
    }
    .section-header .chevron,
    .section-header button,
    .section-header span {
      color: #ffffff !important;
    }
    .section-header .save-btn,
    .section-header #presets-header-actions button {
      background: rgba(0, 0, 0, 0.18) !important;
      border-color: rgba(255, 255, 255, 0.25) !important;
      color: #fff !important;
    }
    .section-header .save-btn:hover {
      background: rgba(0, 0, 0, 0.32) !important;
      border-color: rgba(255, 255, 255, 0.4) !important;
    }
    .section-header input {
      background: rgba(0, 0, 0, 0.2) !important;
      border-color: rgba(255, 255, 255, 0.25) !important;
      color: #fff !important;
    }
    .section-header input::placeholder {
      color: rgba(255, 255, 255, 0.55);
    }
    .section-header .value-badge {
      background: rgba(0, 0, 0, 0.22);
      border-color: rgba(255, 255, 255, 0.28);
      color: #fff;
    }
    .save-btn:hover {
      background: rgba(83, 139, 236, 0.55) !important;
      border-color: rgba(83, 139, 236, 0.7) !important;
      color: #fff !important;
    }
  </style>
</head>
<body class="min-h-screen antialiased overflow-hidden" style="background: var(--bg);">

  <header class="h-12 border-b border-white/5 flex items-center justify-between px-4 relative z-50" style="background: rgba(18,14,28,0.85); backdrop-filter: blur(12px);">
    <div class="flex items-center gap-2.5">
      <div class="w-7 h-7 rounded-lg flex items-center justify-center" style="background: linear-gradient(135deg, #8B5CF6, #C13CD1); box-shadow: 0 0 14px -2px rgba(193,60,209,0.55);">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.4">
          <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
        </svg>
      </div>
      <span class="font-semibold tracking-tight text-[15px]">
        <span style="color: #FFFFFF;">Nest</span><span style="color: #538BEC; font-style: italic; font-weight: 600;">Calc</span>
      </span>
    </div>

    <nav class="flex items-center gap-0.5 p-0.5 rounded-xl border border-white/10" style="background: rgba(11,8,20,0.7);">
      <button id="tab-calc" class="px-3.5 py-1.5 rounded-lg text-[13px] font-semibold text-white" style="background: #538BEC;">Calculator</button>
      <button id="tab-gcode" class="px-3.5 py-1.5 rounded-lg text-[13px] font-semibold transition hover:text-white" style="color: #C8CDD8;">G-code</button>
    </nav>

    <div class="flex items-center gap-1.5">
      <div class="flex items-center gap-0.5 p-0.5 rounded-lg" style="background: var(--raised); border: 1px solid rgba(200,205,216,0.15);" id="unit-switch">
          <button type="button" id="unit-in" class="h-7 px-2.5 rounded-md text-[11px] font-bold transition" style="background: #538BEC; color: #fff;">IN</button>
          <button type="button" id="unit-mm" class="h-7 px-2.5 rounded-md text-[11px] font-bold transition" style="background: transparent; color: #C8CDD8;">MM</button>
        </div>
      <button class="h-8 w-8 rounded-lg flex items-center justify-center press transition" style="background: var(--raised); border: 1px solid rgba(83,139,236,0.3); color: #C8CDD8;" title="Clear">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
      <button class="h-8 w-8 rounded-lg flex items-center justify-center press transition" style="background: var(--raised); border: 1px solid rgba(83,139,236,0.3); color: #C8CDD8;" title="Theme">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button class="h-8 w-8 rounded-lg flex items-center justify-center press transition" style="background: var(--raised); border: 1px solid rgba(83,139,236,0.3); color: #C8CDD8;" title="Settings">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
      <button class="h-8 w-8 rounded-full flex items-center justify-center text-[10px] font-bold text-white press" style="background: #538BEC; box-shadow: 0 0 12px -2px rgba(83,139,236,0.4);" title="Clerk (stub)">RT</button>
    </div>
  </header>

  <div class="relative h-[calc(100vh-3rem)] flex overflow-hidden">

    <aside id="sheet" class="sheet absolute left-3 top-3 bottom-3 z-30 flex flex-col glow rounded-2xl overflow-hidden" style="background: #0E0C14; --calc-sheet-w: 300px; width: 300px;">
      <div class="px-3 py-2.5 flex items-center justify-between shrink-0" style="border-bottom: 1px solid rgba(255,255,255,0.06);">
        <button id="sheet-close" class="h-7 w-7 rounded-lg flex items-center justify-center press transition shrink-0" style="border: 1px solid rgba(83,139,236,0.3); color: #C8CDD8;" title="Collapse panel">
          <svg id="sheet-close-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="flex items-center gap-2 ml-auto">

  <!-- Calculator — matching reference contrast -->
  <div id="numpad" class="numpad hidden-pad fixed bottom-5 right-5 z-40 glow rounded-2xl p-3 w-[230px]">
    <div class="flex flex-wrap gap-1 mb-2.5">

      <button data-quick="0.375" class="h-6 px-1.5 rounded-md text-[10px] font-mono font-medium transition press key-util">.375</button>
      <button data-quick="0.500" class="h-6 px-1.5 rounded-md text-[10px] font-mono font-medium transition press key-util">.500</button>

      <button data-key="7" class="h-11 rounded-xl text-sm font-medium transition press key-num">7</button>
      <button data-key="8" class="h-11 rounded-xl text-sm font-medium transition press key-num">8</button>
      <button data-key="9" class="h-11 rounded-xl text-sm font-medium transition press key-num">9</button>
      <button data-key="4" class="h-11 rounded-xl text-sm font-medium transition press key-num">4</button>
      <button data-key="5" class="h-11 rounded-xl text-sm font-medium transition press key-num">5</button>
      <button data-key="6" class="h-11 rounded-xl text-sm font-medium transition press key-num">6</button>
      <button data-key="1" class="h-11 rounded-xl text-sm font-medium transition press key-num">1</button>
      <button data-key="2" class="h-11 rounded-xl text-sm font-medium transition press key-num">2</button>
      <button data-key="3" class="h-11 rounded-xl text-sm font-medium transition press key-num">3</button>

      <button data-key="enter" class="h-11 rounded-xl text-sm font-semibold transition press key-eq col-span-3">↵ Enter</button>

  <script>
    const sheet = document.getElementById('sheet');
    const sheetOpen = document.getElementById('sheet-open');
    const sheetClose = document.getElementById('sheet-close');
    const stage = document.getElementById('stage');
    const sheetResize = document.getElementById('sheet-resize');

    /*
      TDZ-safe: declare currentMode BEFORE any resize/layout init that reads it.
      typeof currentMode on a later let throws ReferenceError and aborts all handlers.
    */
    let currentMode = 'calc';

    /* Calculator left sheet: hard 300–500px. Stage gap: left 12 + sheet + 12 = width + 24 (324 @ 300). */
    const CALC_SHEET_MIN = 300;
    const CALC_SHEET_MAX = 500;
    const CALC_SHEET_EDGE_GAP = 24; /* left-3 (12px) + stage gap (12px) */
    let calcSheetWidth = 300;

    function isGcodeMode() {
      return currentMode === 'gcode';
    }

    function calcStagePaddingLeft(open) {
      if (!open) return '16px';
      return (calcSheetWidth + CALC_SHEET_EDGE_GAP) + 'px';
    }

    function applyCalcSheetWidth(w, opts) {
      const open = opts && typeof opts.open === 'boolean' ? opts.open : !sheet.classList.contains('closed');
      calcSheetWidth = Math.min(CALC_SHEET_MAX, Math.max(CALC_SHEET_MIN, Math.round(w)));
      sheet.style.setProperty('--calc-sheet-w', calcSheetWidth + 'px');
      sheet.style.width = calcSheetWidth + 'px';
      if (sheetResize) sheetResize.setAttribute('aria-valuenow', String(calcSheetWidth));
      if (!isGcodeMode() && open) {
        stage.style.paddingLeft = calcStagePaddingLeft(true);
        stage.style.paddingRight = '16px';
      }
      return calcSheetWidth;
    }

    function clearCalcSheetInlineWidth() {
      sheet.style.removeProperty('width');
      sheet.style.removeProperty('--calc-sheet-w');
    }

    function setSheet(open) {
      const vex = document.getElementById('viewer-expand');
      if (vex) vex.style.display = 'none';

      if (isGcodeMode()) {
        // G-code: "close" = hide VIEWER, expand PANEL to full width
        // "open" = restore split (viewer left + panel right)
        if (!open) {
          // Panel full-bleed: arrow points RIGHT
          stage.classList.add('viewer-collapsed');
          sheet.classList.remove('closed');
          sheet.classList.add('panel-full');
          stage.style.paddingLeft = '16px';
          stage.style.paddingRight = '16px';
          sheetOpen.classList.add('hidden');
          sheetOpen.style.cssText = '';
          const closeBtn = document.getElementById('sheet-close');
          if (closeBtn) closeBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 18l6-6-6-6"/></svg>';
        } else {
          // Split restored: arrow points LEFT — geometry unchanged (420 / 448)
          stage.classList.remove('viewer-collapsed');
          sheet.classList.remove('closed');
          sheet.classList.remove('panel-full');
          stage.style.paddingLeft = '16px';
          stage.style.paddingRight = '448px';
          sheetOpen.classList.add('hidden');
          sheetOpen.style.cssText = '';
          const closeBtn = document.getElementById('sheet-close');
          if (closeBtn) closeBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg>';
        }
        return;
      }

      // Calculator: close hides panel, nest view full
      sheet.classList.toggle('closed', !open);
      sheet.classList.remove('panel-full');
      stage.classList.remove('viewer-collapsed');
      applyCalcSheetWidth(calcSheetWidth, { open: open });
      if (!open) {
        stage.style.paddingLeft = '16px';
        stage.style.paddingRight = '16px';
      }
      sheetOpen.style.cssText = '';
      sheetOpen.classList.toggle('hidden', open);
      if (!open) {
        sheetOpen.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 18l6-6-6-6"/></svg>';
      }
    }

    /* Drag free edge to resize calculator sheet (300–500). G-code: no-op. */
    (function initCalcSheetResize() {
      if (!sheetResize) return;
      let dragging = false;
      let startX = 0;
      let startW = 300;

      function onMove(e) {
        if (!dragging) return;
        if (isGcodeMode()) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const dx = clientX - startX;
        applyCalcSheetWidth(startW + dx, { open: true });
        e.preventDefault();
      }
      function onUp() {
        if (!dragging) return;
        dragging = false;
        sheet.classList.remove('is-resizing');
        stage.classList.remove('is-resizing');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
        window.removeEventListener('pointercancel', onUp);
        window.removeEventListener('touchmove', onMove);
        window.removeEventListener('touchend', onUp);
      }
      function onDown(e) {
        if (isGcodeMode()) return;
        if (sheet.classList.contains('closed') || sheet.classList.contains('side-right')) return;
        dragging = true;
        startX = e.touches ? e.touches[0].clientX : e.clientX;
        startW = calcSheetWidth;
        sheet.classList.add('is-resizing');
        stage.classList.add('is-resizing');
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
        window.addEventListener('pointercancel', onUp);
        window.addEventListener('touchmove', onMove, { passive: false });
        window.addEventListener('touchend', onUp);
        e.preventDefault();
      }
      sheetResize.addEventListener('pointerdown', onDown);
      sheetResize.addEventListener('touchstart', onDown, { passive: false });
      sheetResize.tabIndex = 0;
      sheetResize.addEventListener('keydown', (e) => {
        if (isGcodeMode()) return;
        if (sheet.classList.contains('closed')) return;
        const step = e.shiftKey ? 20 : 10;
        if (e.key === 'ArrowLeft') {
          applyCalcSheetWidth(calcSheetWidth - step, { open: true });
          e.preventDefault();
        } else if (e.key === 'ArrowRight') {
          applyCalcSheetWidth(calcSheetWidth + step, { open: true });
          e.preventDefault();
        } else if (e.key === 'Home') {
          applyCalcSheetWidth(CALC_SHEET_MIN, { open: true });
          e.preventDefault();
        } else if (e.key === 'End') {
          applyCalcSheetWidth(CALC_SHEET_MAX, { open: true });
          e.preventDefault();
        }
      });
      applyCalcSheetWidth(CALC_SHEET_MIN, { open: true });
    })();
    // Toggle semantics for G-code: click close when split → expand panel; click again → restore
    sheetClose.addEventListener('click', () => {
      if (isGcodeMode()) {
        const expanded = sheet.classList.contains('panel-full');
        setSheet(expanded); // if expanded, restore (open=true); if split, expand (open=false)
      } else {
        setSheet(false);
      }
    });
    sheetOpen.addEventListener('click', () => setSheet(true));

    function updateBadges() {
      const set = (id, text) => { const el = document.getElementById(id); if (el) el.textContent = text; };
      set('part-badge', (document.getElementById('part-x')?.value || '—') + ' × ' + (document.getElementById('part-y')?.value || '—'));
      set('rem-badge', (document.getElementById('rem-x')?.value || '—') + ' × ' + (document.getElementById('rem-y')?.value || '—'));
      set('gap-badge', (document.getElementById('gap-x')?.value || '—') + ' × ' + (document.getElementById('gap-y')?.value || '—'));
      set('margins-badge', 'L' + (document.getElementById('m-left')?.value || '—') + ' R' + (document.getElementById('m-right')?.value || '—') + ' B' + (document.getElementById('m-bottom')?.value || '—') + ' T' + (document.getElementById('m-top')?.value || '—'));
    }
    document.querySelectorAll('[data-field]').forEach(inp => inp.addEventListener('input', updateBadges));
    updateBadges();

    const cards = Array.from(document.querySelectorAll('.section-card'));
    function cascadeSettle(fromIndex) {
      for (let i = fromIndex + 1; i < cards.length; i++) {
        const card = cards[i];
        card.classList.remove('settle');
        void card.offsetWidth;
        card.classList.add('settle');
        setTimeout(() => card.classList.remove('settle'), 520);
      }
    }

    function syncPresetsActions(open) {
      const actions = document.getElementById('presets-header-actions');
      if (actions) actions.style.display = open ? 'flex' : 'none';
    }
    function openSection(body, chev, badge) {
      body.classList.remove('closed');
      body.style.maxHeight = 'none';
      const h = body.scrollHeight;
      body.style.maxHeight = '0px';
      body.offsetHeight;
      body.style.maxHeight = h + 'px';
      if (chev) chev.classList.add('rotated');
      if (badge) badge.classList.add('hidden');
      if (body.id === 'presets-body') syncPresetsActions(true);
    }
    function closeSection(body, chev, badge) {
      body.style.maxHeight = body.scrollHeight + 'px';
      body.offsetHeight;
      body.classList.add('closed');
      body.style.maxHeight = '0px';
      if (chev) chev.classList.remove('rotated');
      if (badge) badge.classList.remove('hidden');
      if (body.id === 'presets-body') syncPresetsActions(false);
    }

    document.querySelectorAll('.section-trigger').forEach(btn => {
      btn.addEventListener('click', () => {
        const body = document.getElementById(btn.dataset.target);
        if (!body) return;
        const card = btn.closest('.section-card');
        const chev = card ? card.querySelector('.chevron') : btn.querySelector('.chevron');
        const badgeId = btn.dataset.badge;
        const badge = badgeId ? document.getElementById(badgeId) : null;
        const idx = cards.indexOf(card);
        if (body.classList.contains('closed')) openSection(body, chev, badge);
        else closeSection(body, chev, badge);
        cascadeSettle(idx);
      });
    });

    // Only Part starts open
    ['presets-body', 'rem-body', 'gap-body', 'margins-body'].forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      el.classList.add('closed');
      el.style.maxHeight = '0px';
      const card = el.closest('.section-card');
      if (card) {
        const chev = card.querySelector('.chevron');
        if (chev) chev.classList.remove('rotated');
        // show badges on closed value sections
        const badge = card.querySelector('.value-badge');
        if (badge) badge.classList.remove('hidden');
      }
    });
    const partBody = document.getElementById('part-body');
    if (partBody) {
      partBody.classList.remove('closed');
      partBody.style.maxHeight = 'none';
      partBody.style.maxHeight = partBody.scrollHeight + 'px';
      const card = partBody.closest('.section-card');
      if (card) {
        const chev = card.querySelector('.chevron');
        if (chev) chev.classList.add('rotated');
        const badge = card.querySelector('.value-badge');
        if (badge) badge.classList.add('hidden');
      }
    }
    syncPresetsActions(false);

    document.querySelectorAll('[data-link]').forEach(btn => {
      btn.addEventListener('click', () => btn.classList.toggle('active'));
    });

    const autoBtn = document.getElementById('autonest-btn');
    const modeLabel = document.getElementById('mode-label');
    let isAuto = false;
    autoBtn.addEventListener('click', () => {
      isAuto = !isAuto;
      autoBtn.setAttribute('aria-pressed', isAuto);
      if (isAuto) {
        autoBtn.style.background = '#538BEC';
        autoBtn.style.borderColor = 'transparent';
        autoBtn.style.color = '#fff';
        modeLabel.textContent = 'AutoNest';
      } else {
        autoBtn.style.background = 'var(--raised)';
        autoBtn.style.borderColor = 'rgba(83,139,236,0.35)';
        autoBtn.style.color = '#C8CDD8';
        modeLabel.textContent = 'Manual';
      }
    });


    // ---- Mode switch: Calculator ↔ G-code ----
    /* currentMode declared at script top (before resize init) — TDZ-safe */
    let progUnit = 'in';
    let currentAngle = 0;
    let derivedXY = null;

    window.calcUnitMode = 'in';
    function headerAccent() {
      return isGcodeMode() ? '#EE8C3C' : '#538BEC';
    }
    function setCalcUnit(u) {
      window.calcUnitMode = u;
      const inn = document.getElementById('unit-in');
      const mm = document.getElementById('unit-mm');
      if (!inn || !mm) return;
      const acc = headerAccent();
      if (u === 'in') {
        inn.style.background = acc;
        inn.style.color = '#fff';
        mm.style.background = 'transparent';
        mm.style.color = '#C8CDD8';
      } else {
        mm.style.background = acc;
        mm.style.color = '#fff';
        inn.style.background = 'transparent';
        inn.style.color = '#C8CDD8';
      }
    }
    (function () {
      const a = document.getElementById('unit-in');
      const b = document.getElementById('unit-mm');
      if (a) a.addEventListener('click', function () { setCalcUnit('in'); });
      if (b) b.addEventListener('click', function () { setCalcUnit('mm'); });
    })();

    function setTabStyles(mode) {
      const tc = document.getElementById('tab-calc');
      const tg = document.getElementById('tab-gcode');
      if (!tc || !tg) return;
      document.body.classList.toggle('mode-gcode', mode === 'gcode');
      if (mode === 'calc') {
        tc.style.background = '#538BEC';
        tc.style.color = '#fff';
        tg.style.background = 'transparent';
        tg.style.color = '#C8CDD8';
      } else {
        tg.style.background = '#EE8C3C';
        tg.style.color = '#fff';
        tc.style.background = 'transparent';
        tc.style.color = '#C8CDD8';
      }
      // Header IN|MM follows mode accent
      if (typeof setCalcUnit === 'function') setCalcUnit(window.calcUnitMode || 'in');
    }

    function setCalcOnlyVisible(show) {
      document.querySelectorAll('[data-calc-only]').forEach(el => {
        el.style.display = show ? '' : 'none';
      });
      // Rotate buttons in preview chrome (no data attr) - hide by scanning
      document.querySelectorAll('#stage button').forEach(btn => {
        const t = (btn.textContent || '').trim();
        if (t.indexOf('Part 90') >= 0 || t.indexOf('Rem 90') >= 0) {
          btn.style.display = show ? '' : 'none';
        }
      });
    }

    function layoutForMode(mode) {
      const sheetEl = document.getElementById('sheet');
      const stageEl = document.getElementById('stage');
      const openBtn = document.getElementById('sheet-open');
      const closeBtn = document.getElementById('sheet-close');
      sheetEl.classList.remove('closed', 'panel-full');
      stageEl.classList.remove('viewer-collapsed');
      openBtn.classList.add('hidden');
      openBtn.style.cssText = '';
      if (mode === 'gcode') {
        sheetEl.classList.add('side-right');
        clearCalcSheetInlineWidth();
        stageEl.style.paddingLeft = '16px';
        stageEl.style.paddingRight = '448px';
        // Split: arrow points LEFT — 420px panel / 448 padding unchanged
        if (closeBtn) closeBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg>';
      } else {
        sheetEl.classList.remove('side-right');
        applyCalcSheetWidth(calcSheetWidth, { open: true });
        stageEl.style.paddingRight = '16px';
        if (closeBtn) closeBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg>';
      }
    }

    
    function switchMode(mode) {
      if (mode === currentMode) return;
      currentMode = mode;
      setTabStyles(mode);
      setCalcOnlyVisible(mode === 'calc');

      const calcPanel = document.getElementById('calc-panel');
      const gcodePanel = document.getElementById('gcode-panel');
      const calcView = document.getElementById('calc-view');
      const gcodeView = document.getElementById('gcode-view');
      const calcFooter = document.getElementById('calc-footer');

      [calcPanel, gcodePanel, calcView, gcodeView].forEach(el => {
        if (el) el.classList.add('mode-morph');
      });

      // Side swap + content morph together
      layoutForMode(mode);

      if (mode === 'gcode') {
        if (calcPanel) calcPanel.classList.add('out');
        if (calcView) calcView.classList.add('out');
        setTimeout(() => {
          if (calcPanel) { calcPanel.classList.add('hidden'); calcPanel.classList.remove('out'); }
          if (calcView) { calcView.classList.add('hidden'); calcView.classList.remove('out'); }
          if (calcFooter) calcFooter.classList.add('hidden');
          if (gcodePanel) { gcodePanel.classList.remove('hidden'); gcodePanel.classList.add('out'); }
          if (gcodeView) { gcodeView.classList.remove('hidden'); gcodeView.classList.add('out'); }
          requestAnimationFrame(() => {
            if (gcodePanel) gcodePanel.classList.remove('out');
            if (gcodeView) gcodeView.classList.remove('out');
          });
        }, 180);
      } else {
        if (gcodePanel) gcodePanel.classList.add('out');
        if (gcodeView) gcodeView.classList.add('out');
        setTimeout(() => {
          if (gcodePanel) { gcodePanel.classList.add('hidden'); gcodePanel.classList.remove('out'); }
          if (gcodeView) { gcodeView.classList.add('hidden'); gcodeView.classList.remove('out'); }
          if (calcPanel) { calcPanel.classList.remove('hidden'); calcPanel.classList.add('out'); }
          if (calcView) { calcView.classList.remove('hidden'); calcView.classList.add('out'); }
          if (calcFooter) calcFooter.classList.remove('hidden');
          requestAnimationFrame(() => {
            if (calcPanel) calcPanel.classList.remove('out');
            if (calcView) calcView.classList.remove('out');
          });
        }, 180);
      }
    }

    document.getElementById('tab-calc').addEventListener('click', () => switchMode('calc'));
    document.getElementById('tab-gcode').addEventListener('click', () => switchMode('gcode'));

    function setProgUnit(u) {
      progUnit = u;
      const inn = document.getElementById('prog-unit-in');
      const mm = document.getElementById('prog-unit-mm');
      if (!inn) return;
      if (u === 'in') {
        inn.style.background = '#EE8C3C'; inn.style.color = '#fff';
        mm.style.background = 'transparent'; mm.style.color = '#fff';
      } else {
        mm.style.background = '#EE8C3C'; mm.style.color = '#fff';
        inn.style.background = 'transparent'; inn.style.color = '#fff';
      }
      refreshPartDisplay();
    }
    document.getElementById('prog-unit-in').addEventListener('click', () => setProgUnit('in'));
    document.getElementById('prog-unit-mm').addEventListener('click', () => setProgUnit('mm'));

    let partUnit = 'in';
    let baseXY = null; // always stored in program units
    function setPartUnit(u) {
      partUnit = u;
      const inn = document.getElementById('part-unit-in');
      const mm = document.getElementById('part-unit-mm');
      if (!inn) return;
      if (u === 'in') {
        inn.style.background = '#EE8C3C'; inn.style.color = '#fff';
        mm.style.background = 'transparent'; mm.style.color = '#fff';
      } else {
        mm.style.background = '#EE8C3C'; mm.style.color = '#fff';
        inn.style.background = 'transparent'; inn.style.color = '#fff';
      }
      refreshPartDisplay();
    }
    document.getElementById('part-unit-in').addEventListener('click', () => setPartUnit('in'));
    document.getElementById('part-unit-mm').addEventListener('click', () => setPartUnit('mm'));

    function refreshPartDisplay() {
      if (!baseXY) return;
      let x = baseXY.x, y = baseXY.y;
      if (progUnit === 'in' && partUnit === 'mm') { x *= 25.4; y *= 25.4; }
      if (progUnit === 'mm' && partUnit === 'in') { x /= 25.4; y /= 25.4; }
      const xEl = document.getElementById('gcode-part-x');
      const yEl = document.getElementById('gcode-part-y');
      xEl.value = x.toFixed(3);
      yEl.value = y.toFixed(3);
      derivedXY = { x: x, y: y };
      document.getElementById('gcode-preview-label').textContent = x.toFixed(3) + ' × ' + y.toFixed(3);
      const prev = document.getElementById('gcode-part-preview');
      if (prev && x > 0 && y > 0) prev.style.aspectRatio = (x / y).toFixed(4);
    }

    function openOutput() {
      const body = document.getElementById('output-body');
      const chev = document.getElementById('output-chevron');
      if (body) body.style.display = 'block';
      if (chev) chev.style.transform = 'rotate(180deg)';
    }
    function toggleOutput() {
      const body = document.getElementById('output-body');
      const chev = document.getElementById('output-chevron');
      if (!body) return;
      const open = body.style.display !== 'none';
      body.style.display = open ? 'none' : 'block';
      if (chev) chev.style.transform = open ? 'rotate(0deg)' : 'rotate(180deg)';
    }
    document.getElementById('output-toggle').addEventListener('click', toggleOutput);

    // Single primary action: Generate = analyze + rotate + output (matches product)
    document.getElementById('gcode-generate').addEventListener('click', () => {
      const src = document.getElementById('gcode-input').value || '';
      if (!src.trim()) {
        document.getElementById('gcode-output').textContent = '—';
        baseXY = null; derivedXY = null;
        document.getElementById('gcode-part-x').value = '—';
        document.getElementById('gcode-part-y').value = '—';
        document.getElementById('fill-part-size').disabled = true;
        document.getElementById('gcode-preview-label').textContent = '— × —';
        return;
      }
      // Stub bounds (product uses AABB from analyzeGCode)
      const x0 = progUnit === 'in' ? 4.250 : 107.95;
      const y0 = progUnit === 'in' ? 2.875 : 73.025;
      // Rotation of rectangle extents (stub)
      let x = x0, y = y0;
      const a = Math.abs(currentAngle) % 180;
      if (a === 90) { x = y0; y = x0; }
      baseXY = { x: x, y: y };
      refreshPartDisplay();
      const xEl = document.getElementById('gcode-part-x');
      const yEl = document.getElementById('gcode-part-y');
      xEl.classList.remove('hydrate-flash'); yEl.classList.remove('hydrate-flash');
      void xEl.offsetWidth; void yEl.offsetWidth;
      xEl.classList.add('hydrate-flash'); yEl.classList.add('hydrate-flash');
      document.getElementById('fill-part-size').disabled = false;

      document.getElementById('gcode-output').textContent =
        '; rotated ' + currentAngle + '°\n' + src.split('\n').slice(0, 8).join('\n') + '\n; …';
      openOutput();
    });

    document.getElementById('fill-part-size').addEventListener('click', () => {
      if (!derivedXY) return;
      let x = derivedXY.x, y = derivedXY.y;
      const fillUnit = (typeof window.calcUnitMode === 'string' ? window.calcUnitMode : 'in');
      if (partUnit === 'in' && fillUnit === 'mm') { x *= 25.4; y *= 25.4; }
      if (partUnit === 'mm' && fillUnit === 'in') { x /= 25.4; y /= 25.4; }
      document.getElementById('part-x').value = Number(x.toFixed(3));
      document.getElementById('part-y').value = Number(y.toFixed(3));
      document.getElementById('part-x').dispatchEvent(new Event('input'));
      document.getElementById('part-y').dispatchEvent(new Event('input'));
      const btn = document.getElementById('fill-part-size');
      btn.textContent = 'Filled ✓';
      // Morph back to Calculator so the bridge is visible
      setTimeout(() => {
        btn.textContent = 'Fill part size → Calculator';
        switchMode('calc');
      }, 450);
    });

    document.querySelectorAll('.gcode-angle').forEach(btn => {
      btn.addEventListener('click', () => {
        currentAngle = parseInt(btn.dataset.angle, 10);
        document.getElementById('gcode-angle-label').textContent = currentAngle + '°';
        document.querySelectorAll('.gcode-angle').forEach(b => {
          b.style.background = 'var(--raised)';
          b.style.border = '1px solid rgba(200,205,216,0.2)';
          b.style.color = '#C8CDD8';
        });
        btn.style.background = '#EE8C3C';
        btn.style.border = 'none';
        btn.style.color = '#fff';
      });
    });

    document.getElementById('gcode-copy').addEventListener('click', () => {
      const t = document.getElementById('gcode-output').textContent;
      if (t && t !== '—') navigator.clipboard && navigator.clipboard.writeText(t);
    });
    document.getElementById('gcode-download').addEventListener('click', () => {
      const t = document.getElementById('gcode-output').textContent;
      if (!t || t === '—') return;
      const blob = new Blob([t], { type: 'text/plain' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'rotated.nc';
      a.click();
    });


    let activeField = null;
    let entryMode = false;
    document.querySelectorAll('[data-field]').forEach(input => {
      input.addEventListener('focus', () => {
        activeField = input;
        entryMode = false;
        document.getElementById('numpad').classList.remove('hidden-pad');
      });
      input.addEventListener('blur', () => {
        setTimeout(() => {
          if (document.activeElement && document.activeElement.closest && document.activeElement.closest('#numpad')) return;
          document.getElementById('numpad').classList.add('hidden-pad');
        }, 180);
      });
    });
    document.querySelectorAll('[data-quick]').forEach(btn => {
      btn.addEventListener('mousedown', e => e.preventDefault());
      btn.addEventListener('click', () => {
        if (!activeField) return;
        activeField.value = btn.dataset.quick;
        activeField.dispatchEvent(new Event('input'));
        entryMode = false;
      });
    });
    document.querySelectorAll('#numpad [data-key]').forEach(btn => {
      btn.addEventListener('mousedown', e => e.preventDefault());
      btn.addEventListener('click', () => {
        if (!activeField) return;
        const key = btn.dataset.key;
        let val = activeField.value || '';
        if (key === 'back') {
          activeField.value = val.slice(0, -1);
          entryMode = true;
        } else if (key === 'enter') {
          activeField.blur();
          document.getElementById('numpad').classList.add('hidden-pad');
          return;
        } else if (key === '.') {
          if (!entryMode) { activeField.value = '0.'; entryMode = true; }
          else if (val.indexOf('.') === -1) activeField.value = val + '.';
        } else {
          if (!entryMode) { activeField.value = key; entryMode = true; }
          else activeField.value = val + key;
        }
        activeField.dispatchEvent(new Event('input'));
      });
    });
  </script>
</body>
</html>
