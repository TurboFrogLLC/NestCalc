<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NestCalc — Preview-first Prototype</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            ink: {
              950: '#0B0814',
              900: '#120E1C',
              850: '#1A1428',
              800: '#221A32',
              700: '#2A2238',
              600: '#3D3554',
            },
            violet: {
              500: '#8B5CF6',
              400: '#A78BFA',
              300: '#C4B5FD',
              200: '#DDD6FE',
            },
            magenta: {
              500: '#C13CD1',
              400: '#E879F9',
              300: '#F0ABFC',
            },
            hot: {
              500: '#EC4899',
              400: '#F472B6',
            }
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --smooth: cubic-bezier(0.22, 1, 0.36, 1);
      --bg: #08060D;
      --panel: #0E0C14;
      --surface: #16121F;
      --raised: #1E1A2A;
      --muted: #2A2438;
      --violet: #8B5CF6;
      --violet-bright: #A78BFA;
      --violet-soft: #C8CDD8;
      --magenta: #C13CD1;
      --magenta-bright: #E879F9;
      --hot: #EC4899;
      --text: #F5F3FF;
      --text-muted: #C8CDD8;
    }
    html, body {
      overflow-x: auto;
    }
    body {
      font-family: "SF Pro Text", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    input[type="number"] { -moz-appearance: textfield; }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input:focus {
      outline: none;
      box-shadow: 0 0 0 2px rgba(83, 139, 236, 0.55);
      border-color: rgba(83, 139, 236, 0.65) !important;
    }

    /* High-contrast panel: pink→purple gradient edge + soft light outer */
    .glow {
      position: relative;
      background: var(--panel);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.12),
        0 0 0 1px rgba(83, 139, 236, 0.25),
        0 8px 28px -12px rgba(0, 0, 0, 0.8);
    }
    .glow::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1px;
      /* soft white → blue only — no pink */
      background: linear-gradient(135deg,
        rgba(255, 255, 255, 0.5) 0%,
        rgba(180, 200, 230, 0.45) 35%,
        rgba(83, 139, 236, 0.75) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: 1;
    }
    .glow-soft {
      background: #16121F;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.12),
        0 0 0 1px rgba(83, 139, 236, 0.18),
        0 6px 18px -8px rgba(0, 0, 0, 0.6);
      overflow: hidden;
    }

    /* Horizontal button group */
    .btn-group-h {
      display: flex;
      flex-direction: row;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(83, 139, 236, 0.4);
      background: var(--raised);
      flex-shrink: 0;
      height: 36px;
    }
    .btn-group-h button {
      width: 32px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #C8CDD8;
      background: transparent;
      border: none;
      transition: background 0.15s, color 0.15s;
    }
    .btn-group-h button + button {
      border-left: 1px solid rgba(83, 139, 236, 0.25);
    }
    .btn-group-h button:hover {
      background: rgba(83, 139, 236, 0.32);
      color: #fff;
    }
    .btn-group-h button.active {
      background: #538BEC;
      color: #fff;
    }

    .sheet {
      --calc-sheet-w: 300px;
      transition:
        transform 0.72s cubic-bezier(0.34, 1.45, 0.64, 1),
        opacity 0.35s var(--smooth),
        left 0.72s cubic-bezier(0.34, 1.45, 0.64, 1),
        right 0.72s cubic-bezier(0.34, 1.45, 0.64, 1),
        width 0.72s cubic-bezier(0.34, 1.45, 0.64, 1);
      will-change: transform, left, right, width;
      left: 0.75rem;
      right: auto;
      width: 300px;
    }
    /* Calculator mode only: hard min 300 / max 500; locked density at 300 */
    .sheet:not(.side-right) {
      width: var(--calc-sheet-w, 300px);
      min-width: 300px;
      max-width: 500px;
      container-type: inline-size;
      container-name: calc-sheet;
    }
    .sheet.is-resizing {
      transition: none;
      user-select: none;
    }
    .stage.is-resizing {
      transition: none !important;
    }
    /* Free-edge resize only — narrow rim hit target; does not cover sheet controls */
    .sheet-resize {
      position: absolute;
      top: 0;
      right: 0;
      width: 6px;
      height: 100%;
      cursor: col-resize;
      z-index: 50;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      box-sizing: content-box;
      border-right: 4px solid transparent; /* outside-leaning hit area */
      background: transparent;
    }
    .sheet-resize::after {
      content: '';
      position: absolute;
      right: 1px;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 52px;
      border-radius: 3px;
      background: rgba(83, 139, 236, 0.45);
      box-shadow: 0 0 0 1px rgba(83, 139, 236, 0.15);
      transition: height 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
      pointer-events: none;
    }
    .sheet-resize:hover::after,
    .sheet.is-resizing .sheet-resize::after {
      height: 72px;
      background: rgba(83, 139, 236, 0.95);
      box-shadow: 0 0 8px rgba(83, 139, 236, 0.45);
    }
    .sheet.side-right .sheet-resize,
    .sheet.closed .sheet-resize,
    .sheet.panel-full .sheet-resize {
      display: none;
      pointer-events: none;
    }
    /*
      Interior flex when wider than 300px: expand spacing only.
      At 300cqi clamp floors match main locked density (no tighten).
    */
    .sheet:not(.side-right) .xy-row {
      gap: clamp(8px, calc(8px + (100cqi - 300px) * 0.06), 22px);
    }
    .sheet:not(.side-right) .xy-row .xy-field {
      gap: clamp(6px, calc(6px + (100cqi - 300px) * 0.02), 10px);
    }
    .sheet:not(.side-right) .num-input {
      width: clamp(4.1rem, calc(4.1rem + (100cqi - 300px) * 0.012), 5.75rem);
    }
    .sheet:not(.side-right) .m-field .num-input {
      width: 100%;
      max-width: clamp(4.1rem, calc(4.1rem + (100cqi - 300px) * 0.01), 5.75rem);
    }
    .sheet:not(.side-right) .margins-row {
      gap: clamp(6px, calc(6px + (100cqi - 300px) * 0.05), 18px);
      justify-content: space-between;
    }
    .sheet:not(.side-right) #sections-stack {
      padding-left: clamp(12px, calc(12px + (100cqi - 300px) * 0.04), 20px);
      padding-right: clamp(12px, calc(12px + (100cqi - 300px) * 0.04), 20px);
    }
    .sheet:not(.side-right) .xy-row .xy-actions {
      gap: clamp(8px, calc(8px + (100cqi - 300px) * 0.04), 16px);
    }
    .sheet.closed {
      transform: translateX(calc(-100% - 16px));
      opacity: 0;
      pointer-events: none;
    }
    .sheet.side-right {
      left: auto;
      right: 0.75rem;
      width: 420px;
      min-width: 0;
      max-width: none;
      container-type: normal;
    }
    /* Full expand: animate width from 420px → calc(100% - 1.5rem); avoid width:auto snap */
    .sheet.side-right.panel-full {
      left: 0.75rem;
      right: auto;
      width: calc(100% - 1.5rem);
    }
    .gcode-mid-row {
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
      align-items: stretch;
      transition: gap 0.4s var(--smooth), flex-direction 0.01s;
    }
    .sheet.panel-full .gcode-mid-row {
      flex-direction: row;
      align-items: stretch;
      gap: 0.75rem;
    }
    .gcode-card-body {
      min-height: 5.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
      box-sizing: border-box;
    }
    .gcode-card-body > div:first-child {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 2.25rem;
    }
    .gcode-card-body > button {
      flex-shrink: 0;
      margin-top: auto;
    }
    .sheet.panel-full .gcode-mid-row > section {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      height: 100%;
      transition: flex 0.72s cubic-bezier(0.34, 1.45, 0.64, 1), transform 0.72s cubic-bezier(0.34, 1.45, 0.64, 1);
    }
    .sheet.panel-full .gcode-mid-row > section .gcode-card-body {
      flex: 1 1 auto;
    }

    .sheet.panel-full .gcode-mid-row > section {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      transition: flex 0.32s var(--spring), transform 0.32s var(--spring);
    }
    .sheet.panel-full .gcode-mid-row > section > .section-header,
    .sheet.panel-full .gcode-mid-row > section > .section-header-gcode {
      flex-shrink: 0;
    }
    .sheet.panel-full .gcode-mid-row > section > div:last-child {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .sheet.panel-full {

      left: 0.75rem !important;
      right: 0.75rem !important;
      width: auto !important;
      max-width: none;
    }
    /* viewer fades via opacity — see unified rule */
    .sheet.side-right.closed {
      transform: translateX(calc(100% + 16px));
    }
    #calc-view, #gcode-view {
      transition: opacity 0.72s cubic-bezier(0.34, 1.45, 0.64, 1), transform 0.72s cubic-bezier(0.34, 1.45, 0.64, 1);
    }
    .stage.viewer-collapsed #calc-view,
    .stage.viewer-collapsed #gcode-view {
      opacity: 0;
      transform: scale(0.96);
      pointer-events: none;
    }
    #viewer-expand {
      display: none;
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 20;
    }
    .stage.viewer-collapsed #viewer-expand {
      display: flex;
    }
    .stage {
      min-width: 320px;
    }
    .sheet.side-right:not(.panel-full) {
      /* keep fixed width; stage padding reserves gap — no bleed */
    }
    .stage {
      transition: padding-left 0.72s cubic-bezier(0.34, 1.45, 0.64, 1), padding-right 0.72s cubic-bezier(0.34, 1.45, 0.64, 1);
    }

    .section-html, body {
      overflow-x: auto;
    }
    body {
      transition: max-height 0.42s var(--spring), opacity 0.22s ease;
      overflow: hidden;
    }
    .section-body.closed {
      max-height: 0 !important;
      opacity: 0;
    }
    .chevron {
      transition: transform 0.35s var(--spring);
    }
    .chevron.rotated { transform: rotate(180deg); }

    .section-card {
      transition: transform 0.4s var(--spring);
      border-radius: 8px;
    }
    @keyframes hydrateFlash {
      0% { box-shadow: 0 0 0 0 rgba(83,139,236,0.0); }
      40% { box-shadow: 0 0 0 3px rgba(83,139,236,0.55); }
      100% { box-shadow: 0 0 0 0 rgba(83,139,236,0.0); }
    }
    .hydrate-flash {
      animation: hydrateFlash 0.55s ease;
    }
    .mode-morph {
      transition: opacity 0.28s var(--smooth), transform 0.36s var(--spring);
    }
    .mode-morph.out {
      opacity: 0;
      transform: translateY(6px) scale(0.985);
      pointer-events: none;
    }
    .section-card.settle {
      animation: settleBounce 0.5s var(--spring);
    }
    @keyframes settleBounce {
      0%   { transform: translateY(0); }
      30%  { transform: translateY(4px); }
      55%  { transform: translateY(-2px); }
      100% { transform: translateY(0); }
    }

    .press {
      transition: transform 0.15s var(--spring);
    }
    .press:active { transform: scale(0.96); }

    .numpad {
      position: fixed;
      z-index: 40;
      touch-action: none;
      transition: opacity 0.22s ease, transform 0.4s var(--spring);
      user-select: none;
    }
    .numpad.hidden-pad {
      opacity: 0;
      pointer-events: none;
      /* keep last translate from drag; only scale/fade when hiding */
      transform: translate(var(--pad-x, 0px), var(--pad-y, 0px)) scale(0.96);
    }
    .numpad:not(.hidden-pad) {
      transform: translate(var(--pad-x, 0px), var(--pad-y, 0px)) scale(1);
    }
    .numpad.is-dragging {
      transition: none;
      cursor: grabbing;
    }
    .numpad-drag-handle {
      cursor: grab;
      touch-action: none;
    }
    .numpad.is-dragging .numpad-drag-handle {
      cursor: grabbing;
    }
    .numpad-close {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 2;
      width: 26px;
      height: 26px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--raised);
      border: 1px solid rgba(83, 139, 236, 0.35);
      color: #C8CDD8;
      cursor: pointer;
    }
    .numpad-close:hover {
      color: #fff;
      border-color: rgba(83, 139, 236, 0.55);
    }
    /* Press-held only: logo gradient; glyph stays white (not a selected state) */
    .key-num:active,
    .key-op:active,
    .key-eq:active,
    .key-util:active,
    #numpad button[data-key]:active,
    #numpad button[data-quick]:active {
      background: linear-gradient(135deg, #8B5CF6, #C13CD1) !important;
      color: #fff !important;
      border-color: rgba(255, 255, 255, 0.18) !important;
      filter: none !important;
    }

    /* Presets carousel: at most 4 chips in the visible window */
    .presets-carousel {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
    }
    .presets-carousel__btn {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--raised);
      border: 1px solid rgba(83, 139, 236, 0.35);
      color: #C8CDD8;
      cursor: pointer;
    }
    .presets-carousel__btn:hover:not(:disabled) {
      color: #fff;
      border-color: rgba(83, 139, 236, 0.55);
    }
    .presets-carousel__btn:disabled {
      opacity: 0.35;
      cursor: default;
    }
    .presets-carousel__viewport {
      flex: 1 1 auto;
      min-width: 0;
      overflow: hidden;
      container-type: inline-size;
      container-name: presets-viewport;
    }
    .presets-carousel__track {
      display: flex;
      gap: 6px;
      transition: transform 0.22s var(--smooth);
      will-change: transform;
    }
    /* Exactly 4 chips fit the viewport (3 gaps × 6px = 18px) */
    .presets-carousel__track .preset-chip {
      flex: 0 0 calc((100cqi - 18px) / 4);
      width: calc((100cqi - 18px) / 4);
      min-width: 0;
      box-sizing: border-box;
      height: 32px;
      padding: 0 6px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: transform 0.15s var(--spring), background 0.15s ease;
    }
    .presets-add-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
    }
    .presets-add-btn {
      height: 28px;
      padding: 0 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      background: var(--raised);
      border: 1px dashed rgba(83, 139, 236, 0.45);
      color: #C8CDD8;
      cursor: pointer;
    }
    .presets-add-btn:hover {
      color: #fff;
      border-color: rgba(83, 139, 236, 0.7);
      background: rgba(83, 139, 236, 0.15);
    }

    .value-badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 10px;
      line-height: 1.2;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(83, 139, 236, 0.2);
      border: 1px solid rgba(83, 139, 236, 0.35);
      color: #C8CDD8;
      white-space: nowrap;
    }

    .num-input {
      width: 4.1rem;
      min-width: 0;
      text-align: center;
      background: var(--raised);
      border: 1px solid rgba(200, 205, 216, 0.2);
      color: var(--text);
    }

    .axis-count {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      color: #C8CDD8;
      text-shadow: none;
      user-select: none;
    }

    /* Part / Rem / Gap: whole cluster (X|Y|sep|swap-link) centered as one unit */
    .xy-row {
      display: flex;
      align-items: center;
      width: 100%;
      gap: 8px;
      justify-content: center;
    }
    .xy-row .xy-field {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    /* Keep sep + button group tight to XY — do not flex-grow or center alone */
    .xy-row .xy-actions {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
    }
    .xy-row .btn-group-h {
      margin-left: 0;
      flex-shrink: 0;
    }
    .xy-sep {
      width: 1px;
      height: 28px;
      background: rgba(255, 255, 255, 0.12);
      margin: 0;
      flex-shrink: 0;
    }
    .xy-row .xy-actions .xy-sep {
      margin: 0;
    }
    /* Part # — longer field, no blue focus ring/glow */
    .part-num-input {
      width: 8.75rem;
      min-width: 8.75rem;
      max-width: 11rem;
      background: var(--raised);
      border: 1px solid rgba(200, 205, 216, 0.28);
      color: var(--text);
      outline: none;
      box-shadow: none;
    }
    .part-num-input:hover {
      border-color: rgba(200, 205, 216, 0.4);
    }
    .part-num-input:focus,
    .part-num-input:focus-visible {
      outline: none !important;
      box-shadow: none !important;
      border-color: rgba(200, 205, 216, 0.5);
    }
    /*
      Seamless sliding segment switches (one continuous track + thumb).
      Variants:
        --sm   G-code Source/Part-size + AutoNest|Manual
               track h28, pad 2, gap 2, r8, bg rgba(0,0,0,0.2), border none
               segment h24, px 8, r6, 10px/700
        --header  Header IN|MM
               track pad 2, gap 2, r8, bg var(--raised), border 1px solid rgba(200,205,216,0.15)
               segment h28, px 10, r6, 11px/700
    */
    .seg-switch {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 2px;
      border-radius: 8px;
      border: none;
      flex-shrink: 0;
      box-sizing: border-box;
    }
    .seg-switch__thumb {
      position: absolute;
      top: 2px;
      bottom: 2px;
      left: 2px;
      width: 0;
      border-radius: 6px;
      background: #538BEC;
      pointer-events: none;
      z-index: 0;
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1),
                  width 0.2s cubic-bezier(0.4, 0, 0.2, 1),
                  background-color 0.2s ease;
      will-change: transform, width;
    }
    .seg-switch > button {
      position: relative;
      z-index: 1;
      margin: 0;
      border: none;
      background: transparent !important;
      color: #fff;
      border-radius: 6px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.01em;
      white-space: nowrap;
      cursor: pointer;
      outline: none;
      box-shadow: none;
      -webkit-tap-highlight-color: transparent;
    }
    .seg-switch > button:hover,
    .seg-switch > button:focus,
    .seg-switch > button:focus-visible,
    .seg-switch > button[aria-pressed="true"],
    .seg-switch > button[aria-pressed="false"] {
      background: transparent !important;
      outline: none;
      box-shadow: none;
      color: #fff;
    }
    /* G-code unit + nest mode (locked sm specs) */
    .seg-switch--sm {
      height: 28px;
      background: rgba(0, 0, 0, 0.2);
      border: none;
    }
    .seg-switch--sm > button {
      height: 24px;
      padding: 0 8px;
      font-size: 10px;
    }
    /* Header IN|MM (locked header specs) */
    .seg-switch--header {
      height: 32px; /* 2 + 28 + 2 */
      background: var(--raised);
      border: 1px solid rgba(200, 205, 216, 0.15);
    }
    .seg-switch--header > button {
      height: 28px;
      padding: 0 10px;
      font-size: 11px;
    }
    /* Calculator | G-code mode tabs — same seamless track + thumb (~200ms) */
    .seg-switch--mode {
      height: 36px;
      padding: 2px;
      gap: 2px;
      border-radius: 12px;
      background: rgba(11, 8, 20, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .seg-switch--mode > .seg-switch__thumb {
      border-radius: 8px;
      top: 2px;
      bottom: 2px;
      left: 2px;
    }
    .seg-switch--mode > button {
      height: 32px;
      padding: 0 14px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      color: #C8CDD8;
      transition: color 0.2s ease, opacity 0.2s ease;
    }
    .seg-switch--mode > button:hover,
    .seg-switch--mode > button:focus,
    .seg-switch--mode > button:focus-visible,
    .seg-switch--mode > button[aria-pressed="true"],
    .seg-switch--mode > button[aria-pressed="false"] {
      color: inherit;
      background: transparent !important;
    }
    /* Active segment: white on colored thumb */
    .seg-switch--mode > button[aria-pressed="true"] {
      color: #fff !important;
      opacity: 1;
    }
    /* Unselected Calculator side → muted blue (readable, not selected) */
    .seg-switch--mode[data-mode="gcode"] > #tab-calc {
      color: rgba(83, 139, 236, 0.72) !important;
      opacity: 1;
    }
    /* Unselected G-code side → muted orange (readable, not selected) */
    .seg-switch--mode[data-mode="calc"] > #tab-gcode {
      color: rgba(238, 140, 60, 0.72) !important;
      opacity: 1;
    }
    /* AutoNest | Manual: soft Calculator-blue opacity behind the track */
    #autonest-switch.seg-switch--sm {
      background: rgba(83, 139, 236, 0.18);
      box-shadow: inset 0 0 0 1px rgba(83, 139, 236, 0.12);
    }
    /* Sheet chrome icon buttons (match top-header h-8 w-8 raised + blue-tint border) */

      border-color: rgba(83, 139, 236, 0.5);
    }
    /* Calculator nest part rectangles — 1.5px white stroke (beat Tailwind preflight) */
    #calc-view .nest-part {
      background: transparent !important;
      border: 1.5px solid #FFFFFF !important;
      border-radius: 4px;
      box-shadow: none !important;
    }
    .margins-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      width: 100%;
    }
    /* Stay right at 300px and 500px — no center/left drift on resize */
    .margins-rotate-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin-left: auto;
      margin-right: 0;
    }

      font-weight: 600;

      letter-spacing: 0.02em;
    }

    /* Calculator keys matching reference */
    .key-num {
      background: #222230;
      color: #E8E4F0;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .key-num:hover { background: #2E2E40; }

    }
    .key-eq:hover { filter: brightness(1.1); }

    }
    .key-util:hover { background: #3D3554; color: #fff; }
    .section-label {
      color: #ffffff;

    /* Section header bar */

      background: #D97830 !important;
    }
    body.mode-gcode {
      --mode-accent: #EE8C3C;
    }

    .section-header-gcode {
      min-height: 36px;

    }

  <script>
    const sheet = document.getElementById('sheet');
    const sheetOpen = document.getElementById('sheet-open');
    const sheetClose = document.getElementById('sheet-close');
    const stage = document.getElementById('stage');
    const sheetResize = document.getElementById('sheet-resize');

    /*
      TDZ-safe: declare currentMode BEFORE any resize/layout init that reads it.
      typeof currentMode on a later let throws ReferenceError and aborts all handlers.
    */
    let currentMode = 'calc';

    /* Calculator left sheet: hard 300–500px. Stage gap: left 12 + sheet + 12 = width + 24 (324 @ 300). */
    const CALC_SHEET_MIN = 300;
    const CALC_SHEET_MAX = 500;
    const CALC_SHEET_EDGE_GAP = 24; /* left-3 (12px) + stage gap (12px) */
    let calcSheetWidth = 300;

    function isGcodeMode() {
      return currentMode === 'gcode';
    }

    function calcStagePaddingLeft(open) {
      if (!open) return '16px';
      return (calcSheetWidth + CALC_SHEET_EDGE_GAP) + 'px';
    }

    function applyCalcSheetWidth(w, opts) {
      const open = opts && typeof opts.open === 'boolean' ? opts.open : !sheet.classList.contains('closed');
      calcSheetWidth = Math.min(CALC_SHEET_MAX, Math.max(CALC_SHEET_MIN, Math.round(w)));
      sheet.style.setProperty('--calc-sheet-w', calcSheetWidth + 'px');
      sheet.style.width = calcSheetWidth + 'px';
      if (sheetResize) sheetResize.setAttribute('aria-valuenow', String(calcSheetWidth));
      if (!isGcodeMode() && open) {
        stage.style.paddingLeft = calcStagePaddingLeft(true);
        stage.style.paddingRight = '16px';
      }
      return calcSheetWidth;
    }

    function clearCalcSheetInlineWidth() {
      sheet.style.removeProperty('width');
      sheet.style.removeProperty('--calc-sheet-w');
    }

    function setSheet(open) {
      const vex = document.getElementById('viewer-expand');
      if (vex) vex.style.display = 'none';

      if (isGcodeMode()) {
        // G-code: "close" = hide VIEWER, expand PANEL to full width
        // "open" = restore split (viewer left + panel right)
        if (!open) {
          // Panel full-bleed: arrow points RIGHT
          stage.classList.add('viewer-collapsed');
          sheet.classList.remove('closed');
          sheet.classList.add('panel-full');
          stage.style.paddingLeft = '16px';
          stage.style.paddingRight = '16px';
          sheetOpen.classList.add('hidden');
          sheetOpen.style.cssText = '';
          const closeBtn = document.getElementById('sheet-close');
          if (closeBtn) closeBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 18l6-6-6-6"/></svg>';
        } else {
          // Split restored: arrow points LEFT — geometry unchanged (420 / 448)
          stage.classList.remove('viewer-collapsed');
          sheet.classList.remove('closed');
          sheet.classList.remove('panel-full');
          stage.style.paddingLeft = '16px';
          stage.style.paddingRight = '448px';
          sheetOpen.classList.add('hidden');
          sheetOpen.style.cssText = '';
          const closeBtn = document.getElementById('sheet-close');
          if (closeBtn) closeBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg>';
        }
        return;
      }

      // Calculator: close hides panel, nest view full
      sheet.classList.toggle('closed', !open);
      sheet.classList.remove('panel-full');
      stage.classList.remove('viewer-collapsed');
      applyCalcSheetWidth(calcSheetWidth, { open: open });
      if (!open) {
        stage.style.paddingLeft = '16px';
        stage.style.paddingRight = '16px';
      }
      sheetOpen.style.cssText = '';
      sheetOpen.classList.toggle('hidden', open);
      if (!open) {

    /* Drag free edge to resize calculator sheet (300–500). G-code: no-op. */
    (function initCalcSheetResize() {
      if (!sheetResize) return;
      let dragging = false;
      let startX = 0;
      let startW = 300;

      function onMove(e) {
        if (!dragging) return;
        if (isGcodeMode()) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const dx = clientX - startX;
        applyCalcSheetWidth(startW + dx, { open: true });
        e.preventDefault();
      }
      function onUp() {
        if (!dragging) return;
        dragging = false;
        sheet.classList.remove('is-resizing');
        stage.classList.remove('is-resizing');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
        window.removeEventListener('pointercancel', onUp);
        window.removeEventListener('touchmove', onMove);
        window.removeEventListener('touchend', onUp);
      }
      function onDown(e) {
        if (isGcodeMode()) return;
        if (sheet.classList.contains('closed') || sheet.classList.contains('side-right')) return;
        dragging = true;
        startX = e.touches ? e.touches[0].clientX : e.clientX;
        startW = calcSheetWidth;
        sheet.classList.add('is-resizing');
        stage.classList.add('is-resizing');
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
        window.addEventListener('pointercancel', onUp);
        window.addEventListener('touchmove', onMove, { passive: false });
        window.addEventListener('touchend', onUp);
        e.preventDefault();
      }
      sheetResize.addEventListener('pointerdown', onDown);
      sheetResize.addEventListener('touchstart', onDown, { passive: false });
      sheetResize.tabIndex = 0;
      sheetResize.addEventListener('keydown', (e) => {
        if (isGcodeMode()) return;
        if (sheet.classList.contains('closed')) return;
        const step = e.shiftKey ? 20 : 10;
        if (e.key === 'ArrowLeft') {
          applyCalcSheetWidth(calcSheetWidth - step, { open: true });
          e.preventDefault();
        } else if (e.key === 'ArrowRight') {
          applyCalcSheetWidth(calcSheetWidth + step, { open: true });
          e.preventDefault();
        } else if (e.key === 'Home') {
          applyCalcSheetWidth(CALC_SHEET_MIN, { open: true });
          e.preventDefault();
        } else if (e.key === 'End') {
          applyCalcSheetWidth(CALC_SHEET_MAX, { open: true });
          e.preventDefault();
        }
      });
      applyCalcSheetWidth(CALC_SHEET_MIN, { open: true });
    })();
    // Toggle semantics for G-code: click close when split → expand panel; click again → restore
    sheetClose.addEventListener('click', () => {

    }

    function showNumpad() {
      if (!numpad) return;
      if (blurHideTimer) { clearTimeout(blurHideTimer); blurHideTimer = null; }
      numpadOpen = true;
      numpad.classList.remove('hidden-pad');
      numpad.setAttribute('aria-hidden', 'false');
    }
    function hideNumpad() {
      if (!numpad) return;
      if (blurHideTimer) { clearTimeout(blurHideTimer); blurHideTimer = null; }
      numpadOpen = false;
      numpad.classList.add('hidden-pad');
      numpad.setAttribute('aria-hidden', 'true');
    }

    if (numpad) {
      numpad.addEventListener('pointerenter', () => { pointerInNumpad = true; });
      numpad.addEventListener('pointerleave', () => { pointerInNumpad = false; });
      /* Keep field focus when interacting with pad chrome/keys */
      numpad.addEventListener('mousedown', (e) => {
        if (e.target && e.target.closest && e.target.closest('#numpad-close')) return;
        e.preventDefault();
      });
    }

    document.querySelectorAll('[data-field]').forEach(input => {
      input.addEventListener('focus', () => {
        activeField = input;
        entryMode = false;
        showNumpad();
      });
      input.addEventListener('blur', () => {
        /* Field-to-field focus must keep pad usable — only hide when leaving fields + pad */
        if (blurHideTimer) clearTimeout(blurHideTimer);
        blurHideTimer = setTimeout(() => {
          blurHideTimer = null;
          const ae = document.activeElement;
          if (isNumpadRelated(ae) || pointerInNumpad) return;
          /* Pad opened via sheet calc (no field) stays until X / toggle */
          if (!activeField) return;
          hideNumpad();
          activeField = null;
        }, 180);
      });
    });

    if (sheetCalcBtn) {
      sheetCalcBtn.addEventListener('mousedown', e => e.preventDefault());
      sheetCalcBtn.addEventListener('click', () => {
        if (numpad && !numpad.classList.contains('hidden-pad') && numpadOpen) {
          hideNumpad();
        } else {
          /* Reopen without requiring a focused field */
          activeField = activeField && document.contains(activeField) ? activeField : null;
          showNumpad();
        }
      });
    }
    if (numpadClose) {
      numpadClose.addEventListener('mousedown', e => e.preventDefault());
      numpadClose.addEventListener('click', () => {
        hideNumpad();
        if (activeField && typeof activeField.blur === 'function') activeField.blur();
      });
    }

    /* Free drag anywhere in viewport (handle + pad chrome; keys still clickable) */
    (function initNumpadDrag() {
      if (!numpad) return;
      const handle = numpad.querySelector('.numpad-drag-handle');
      let dragging = false;
      let startX = 0, startY = 0;
      let originLeft = 0, originTop = 0;

      function padRectToCssVars() {
        /* After first drag we pin left/top and zero --pad-x/y for clean re-drags */
        const r = numpad.getBoundingClientRect();
        numpad.style.left = r.left + 'px';
        numpad.style.top = r.top + 'px';
        numpad.style.right = 'auto';
        numpad.style.bottom = 'auto';
        numpad.style.setProperty('--pad-x', '0px');
        numpad.style.setProperty('--pad-y', '0px');
      }

      function onMove(e) {
        if (!dragging) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        let nx = originLeft + (clientX - startX);
        let ny = originTop + (clientY - startY);
        const w = numpad.offsetWidth;
        const h = numpad.offsetHeight;
        const maxX = Math.max(0, window.innerWidth - w);
        const maxY = Math.max(0, window.innerHeight - h);
        nx = Math.min(maxX, Math.max(0, nx));
        ny = Math.min(maxY, Math.max(0, ny));
        numpad.style.left = nx + 'px';
        numpad.style.top = ny + 'px';
        numpad.style.right = 'auto';
        numpad.style.bottom = 'auto';
        numpad.style.setProperty('--pad-x', '0px');
        numpad.style.setProperty('--pad-y', '0px');
        e.preventDefault();
      }
      function onUp() {
        if (!dragging) return;
        dragging = false;
        numpad.classList.remove('is-dragging');
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
        window.removeEventListener('pointercancel', onUp);
        window.removeEventListener('touchmove', onMove);
        window.removeEventListener('touchend', onUp);
      }
      function onDown(e) {
        if (e.target.closest && (e.target.closest('button[data-key]') || e.target.closest('button[data-quick]') || e.target.closest('#numpad-close'))) return;
        /* Allow drag from handle or empty pad chrome */
        const fromHandle = handle && handle.contains(e.target);
        const fromChrome = e.target === numpad || (e.target.classList && e.target.classList.contains('numpad-drag-handle'));
        if (!fromHandle && !fromChrome && !(handle && (e.target === handle || handle.contains(e.target)))) {
          /* still allow drag from the pad panel background */
          if (!numpad.contains(e.target)) return;
          if (e.target.closest('button')) return;
        }
        padRectToCssVars();
        dragging = true;
        numpad.classList.add('is-dragging');
        startX = e.touches ? e.touches[0].clientX : e.clientX;
        startY = e.touches ? e.touches[0].clientY : e.clientY;
        originLeft = parseFloat(numpad.style.left) || numpad.getBoundingClientRect().left;
        originTop = parseFloat(numpad.style.top) || numpad.getBoundingClientRect().top;
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
        window.addEventListener('pointercancel', onUp);
        window.addEventListener('touchmove', onMove, { passive: false });
        window.addEventListener('touchend', onUp);
        e.preventDefault();
      }
      if (handle) {
        handle.addEventListener('pointerdown', onDown);
        handle.addEventListener('touchstart', onDown, { passive: false });
      }
      numpad.addEventListener('pointerdown', function (e) {
        if (e.target.closest && e.target.closest('button')) return;
        onDown(e);
      });
    })();

    document.querySelectorAll('[data-quick]').forEach(btn => {
      btn.addEventListener('mousedown', e => e.preventDefault());
      btn.addEventListener('click', () => {
        if (!activeField) return;
        activeField.value = btn.dataset.quick;
        activeField.dispatchEvent(new Event('input'));
        entryMode = false;
      });
    });
    document.querySelectorAll('#numpad [data-key]').forEach(btn => {
      btn.addEventListener('mousedown', e => e.preventDefault());
      btn.addEventListener('click', () => {
        if (!activeField) return;
        const key = btn.dataset.key;
        let val = activeField.value || '';
        if (key === 'back') {
          activeField.value = val.slice(0, -1);
          entryMode = true;
        } else if (key === 'enter') {
          activeField.blur();
          hideNumpad();
          return;
        } else if (key === '.') {
          if (!entryMode) { activeField.value = '0.'; entryMode = true; }
          else if (val.indexOf('.') === -1) activeField.value = val + '.';
        } else {
          if (!entryMode) { activeField.value = key; entryMode = true; }
          else activeField.value = val + key;
        }
        activeField.dispatchEvent(new Event('input'));
      });
    });

    /* ---- Presets carousel: max 4 visible, arrows, add stub ---- */
    (function initPresetsCarousel() {
      const track = document.getElementById('presets-track');
      const viewport = document.getElementById('presets-viewport');
      const prevBtn = document.getElementById('presets-prev');
      const nextBtn = document.getElementById('presets-next');
      const addBtn = document.getElementById('presets-add');
      const editBtn = document.getElementById('presets-edit');
      if (!track || !viewport) return;

      const VISIBLE = 4;
      let page = 0;
      let selectedPreset = 'Default';

      function chips() {
        return Array.from(track.querySelectorAll('.preset-chip'));
      }
      function maxPage() {
        const n = chips().length;
        return Math.max(0, Math.ceil(n / VISIBLE) - 1);
      }
      function chipStep() {
        const list = chips();
        if (!list.length) return 0;
        const gap = 6;
        return list[0].offsetWidth + gap;
      }
      function syncCarousel() {
        const list = chips();
        const mp = maxPage();
        if (page > mp) page = mp;
        if (page < 0) page = 0;
        const step = chipStep() * VISIBLE;
        track.style.transform = 'translateX(' + (-page * step) + 'px)';
        if (prevBtn) prevBtn.disabled = page <= 0;
        if (nextBtn) nextBtn.disabled = page >= mp || list.length <= VISIBLE;
        list.forEach(chip => {
          const on = chip.dataset.preset === selectedPreset;
          if (on) {
            chip.style.background = '#538BEC';
            chip.style.border = '1px solid #538BEC';
            chip.style.color = '#fff';
          } else {
            chip.style.background = 'var(--raised)';
            chip.style.border = '1px solid rgba(83,139,236,0.35)';
            chip.style.color = '#C8CDD8';
          }
        });
      }
      function bindChip(chip) {
        chip.addEventListener('click', () => {
          selectedPreset = chip.dataset.preset || chip.textContent.trim();
          syncCarousel();
        });
      }
      chips().forEach(bindChip);

      if (prevBtn) prevBtn.addEventListener('click', () => { page -= 1; syncCarousel(); });
      if (nextBtn) nextBtn.addEventListener('click', () => { page += 1; syncCarousel(); });

      if (addBtn) {
        addBtn.addEventListener('click', () => {
          const n = chips().length + 1;
          const name = 'Preset ' + n;
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'preset-chip press';
          btn.setAttribute('role', 'listitem');
          btn.dataset.preset = name;
          btn.textContent = name;
          btn.style.background = 'var(--raised)';
          btn.style.border = '1px solid rgba(83,139,236,0.35)';
          btn.style.color = '#C8CDD8';
          track.appendChild(btn);
          bindChip(btn);
          selectedPreset = name;
          page = maxPage();
          syncCarousel();
          /* remeasure open section height after add */
          const body = document.getElementById('presets-body');
          if (body && !body.classList.contains('closed')) {
            body.style.maxHeight = body.scrollHeight + 'px';
          }
        });
      }
      if (editBtn) {
        editBtn.addEventListener('click', () => {
          /* UI shell stub — no backend */
          const label = selectedPreset || 'preset';
          editBtn.title = 'Edit "' + label + '" (stub)';
        });
      }

      if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(syncCarousel).observe(viewport);
      }
      window.addEventListener('resize', syncCarousel);
      requestAnimationFrame(syncCarousel);
    })();
  </script>
</body>
</html>
